# F-015 T-04: reviewed supplement to the CMMC L2 (NIST SP 800-171 Rev 2)
# mapping. profilegen maps Rev 2 to 800-53r5 through NIST's own data: the
# Rev 2 -> Rev 3 change analysis, then each Rev 3 requirement's 800-53r5
# source controls in NIST's Rev 3 OSCAL catalog (design §4.2, D-OQ1). This file
# covers what that chain cannot. Every entry is checked against the pinned
# sources at build time; see mapping.md for the generated 110-row table.

profile:
  id: cmmc-l2-r2
  title: "CMMC Level 2 (NIST SP 800-171 Rev 2), mapped to NIST SP 800-53 Rev 5"
  version: "1.0.0"
  published: "2026-10-26T00:00:00Z"

# Rows of NIST's change analysis that are not Rev 2 requirements.
errata:
  - r2_id: "3.11.4"
    reason: >-
      Mislabeled duplicate of 3.12.4 (system security plan) in NIST's change
      analysis; SP 800-171 Rev 2 has no 3.11.4 (Table D-11 lists 3.11.1-3.11.3).

# Rev 2 requirements that Rev 3 withdrew without a successor requirement.
# Mapped from Rev 2's own Appendix D (pinned NIST.SP.800-171r2.pdf), whose
# tables cite SP 800-53 Rev 4 (footnote 31); each control is checked to exist,
# not withdrawn, in the pinned 800-53r5 catalog.
no_rev3_successor:
  - r2_id: "3.5.6"
    rev3_note: "Consistency with SP 800-53."
    appendix_d: { table: D-5, rev4_controls: [IA-4] }
    controls: [ia-4]
  - r2_id: "3.5.8"
    rev3_note: "Consistency with SP 800-53."
    appendix_d: { table: D-5, rev4_controls: ["IA-5(1)"] }
    controls: [ia-5.1]
    review: "Table D-5's IA-5(1) cell spans 3.5.7-3.5.10; confirm against the PDF."
  - r2_id: "3.5.9"
    rev3_note: "Consistency with SP 800-53."
    appendix_d: { table: D-5, rev4_controls: ["IA-5(1)"] }
    controls: [ia-5.1]
    review: "Table D-5's IA-5(1) cell spans 3.5.7-3.5.10; confirm against the PDF."
  - r2_id: "3.7.1"
    rev3_note: "Recategorized as NCO."
    appendix_d: { table: D-7, rev4_controls: [MA-2] }
    controls: [ma-2]
  - r2_id: "3.13.2"
    rev3_note: "Recategorized as NCO."
    appendix_d: { table: D-13, rev4_controls: [SA-8] }
    controls: [sa-8]
  - r2_id: "3.13.14"
    rev3_note: "Technology-specific."
    appendix_d: { table: D-13, rev4_controls: [SC-19] }
    controls: []
    review: "SC-19 is withdrawn in SP 800-53 Rev 5 with no successor; the requirement maps to no Rev 5 control."
