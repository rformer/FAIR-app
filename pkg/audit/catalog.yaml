  - type: bu.rollup_tightened
    category: bu_restriction
    severities: [high]
    requires: [target]
    description: "A restricted BU's roll-up visibility was tightened"
  - type: bu.unrestricted
    category: bu_restriction
    severities: [high]
    requires: [target]
    description: "A BU was un-restricted after approval (AC-63)"
  - type: catalog.notices_acknowledged
