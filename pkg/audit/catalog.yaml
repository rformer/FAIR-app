# F-001 T-37 (AC-50, AC-54): the security event catalog. Every event type the
# platform emits, with its AC-50 category, the severities it may carry and the
# fields it must have (beyond the envelope in event.schema.json). The catalog test
# checks that the code emits exactly these types; audit.Validating refuses others.
events:
  - type: access.assignment_expired
    category: access
    severities: [low]
    requires: [target]
    description: "An expired role assignment was revoked by the system (T-32)"
  - type: access_review.campaign_closed
    category: access
    severities: [high]
    requires: [target]
    description: "An access review campaign closed, by its manager or at its due date; undecided items followed its policy (T-39)"
  - type: access_review.campaign_opened
    category: access
    severities: [high]
    requires: [target]
    description: "An access review campaign opened over a BU subtree (T-39, AC-49)"
  - type: access_review.decided
    category: access
    severities: [info, high]
    requires: [target]
    description: "An access review item was certified or revoked, by a reviewer or by the campaign's revoke policy (AC-49)"
  - type: approval.approved
    category: approval
    severities: [high]
    requires: [target]
    description: "A dual-approval request was approved by a second administrator (T-26)"
  - type: approval.consumed
    category: approval
    severities: [info]
    requires: [target]
    description: "An approved request was applied"
  - type: approval.expired
    category: approval
    severities: [info]
    requires: [target]
    description: "A pending approval request expired"
  - type: approval.rejected
    category: approval
    severities: [info]
    requires: [target]
    description: "A dual-approval request was rejected"
  - type: approval.requested
    category: approval
    severities: [info]
    requires: [target]
    description: "A dual-approval request was created"
  - type: assignment.mapped_granted
    category: access
    severities: [info]
    requires: [target]
    description: "A group mapping gave a member its role (T-24)"
  - type: assignment.mapped_revoked
    category: access
    severities: [info]
    requires: [target]
    description: "A group mapping's role was taken from a former member"
  - type: assignment.mapped_skipped
    category: access
    severities: [info, high]
    requires: [target]
    description: "A group mapping could not give a member its role (inactive, or a rule conflict)"
  - type: audit.invalid_event
    category: system
    severities: [critical]
    description: "An event that did not match this catalog, recorded instead of it (a defect; the original is attached)"
  - type: authn.client_credentials
    category: token
    severities: [info]
    requires: [target]
    description: "A service account obtained an access token (T-33)"
  - type: authn.client_credentials_failed
    category: token
    severities: [low, high]
    requires: [target]
    description: "A service account's token request failed authentication"
  - type: authn.login.denied
    category: authentication
    severities: [low, high]
    description: "A sign-in was refused (unknown or inactive user, failed check)"
  - type: authn.login.success
    category: authentication
    severities: [info]
    requires: [target]
    description: "A user signed in through an IdP"
  - type: authn.step_up_failed
    category: authentication
    severities: [high]
    requires: [target]
    description: "A step-up sign-in was refused: the IdP did not report an authentication at or after the request (F-015 T-24b)"
  - type: authn.mfa_missing
    category: authentication
    severities: [high]
    requires: [target]
    description: "A sign-in was refused for lacking the required MFA (T-18), or a phishing-resistant method for a privileged user (T-36)"
  - type: authz.scope.drift
    category: access
    severities: [high]
    description: "The nightly reconciliation found a user's stored scope out of date and repaired it"
  - type: banner.changed
    category: configuration
    severities: [high]
    requires: [target]
    description: "The system-use notification text changed (T-19)"
  - type: breakglass.accounts_disabled
    category: breakglass
    severities: [high]
    requires: [target]
    description: "Break-glass accounts were disabled because break-glass turned off (disabling, expiry, profile switch)"
  - type: breakglass.disabled
    category: breakglass
    severities: [high]
    requires: [target]
    description: "Break-glass was disabled (AC-45)"
  - type: breakglass.emergency_enabled
    category: breakglass
    severities: [critical]
    requires: [target]
    description: "An operator enabled break-glass during an IdP outage (T-35)"
  - type: breakglass.enabled
    category: breakglass
    severities: [high]
    requires: [target]
    description: "Break-glass was enabled, at install or after a second approval (AC-40, AC-41)"
  - type: breakglass.enrolled
    category: breakglass
    severities: [high]
    requires: [target]
    description: "A break-glass holder registered a security key"
  - type: breakglass.enrollment_reset
    category: breakglass
    severities: [high]
    requires: [target]
    description: "A break-glass account got a new enrollment code; its keys were removed"
  - type: breakglass.login
    category: breakglass
    severities: [high]
    requires: [target]
    description: "A break-glass account signed in (AC-43)"
  - type: breakglass.login_failed
    category: breakglass
    severities: [high]
    requires: [target]
    description: "A break-glass sign-in of a known account failed (counts towards lockout)"
  - type: bu.created
    category: bu_restriction
    severities: [high]
    requires: [target]
    description: "A BU was created (T-31 import)"
  - type: bu.moved
    category: bu_restriction
    severities: [info]
    description: "A BU was moved in the tree"
  - type: bu.renamed
    category: bu_restriction
    severities: [high]
    requires: [target]
    description: "A BU was renamed"
  - type: bu.restricted
    category: bu_restriction
    severities: [high]
    requires: [target]
    description: "A BU was restricted (AC-59)"
  - type: bu.rollup_loosened
    category: bu_restriction
