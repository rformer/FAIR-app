# F-001 T-37 (AC-50, AC-54): the security event catalog. Every event type the
# platform emits, with its AC-50 category, the severities it may carry and the
# fields it must have (beyond the envelope in event.schema.json). The catalog test
# checks that the code emits exactly these types; audit.Validating refuses others.
events:
  - type: access.assignment_expired
    category: access
    severities: [low]
    requires: [target]
    bu: required
    attributes: [assignment, bu, expires_at, granted_at, granted_by, role]
    description: "An expired role assignment was revoked by the system (T-32)"
  - type: access_review.campaign_closed
    category: access
    severities: [high]
    requires: [target]
    bu: required
    attributes: [decisions, name, on_expiry]
    description: "An access review campaign closed, by its manager or at its due date; undecided items followed its policy (T-39)"
  - type: access_review.campaign_opened
    category: access
    severities: [high]
    requires: [target]
    bu: required
    attributes: [bu, due_at, items, name, on_expiry, reviewers, roles]
    description: "An access review campaign opened over a BU subtree (T-39, AC-49)"
  - type: access_review.decided
    category: access
    severities: [info, high]
    requires: [target]
    bu: required
    attributes: [assignment, bu, campaign, decision, kind, mapping, outcome, principal, role]
    description: "An access review item was certified or revoked, by a reviewer or by the campaign's revoke policy (AC-49)"
  - type: approval.approved
    category: approval
    severities: [high]
    requires: [target]
    attributes: [bu_id, decided_by, expires_at, kind, requested_by, status, target_ref]
    description: "A dual-approval request was approved by a second administrator (T-26)"
  - type: approval.consumed
    category: approval
    severities: [info]
    requires: [target]
    attributes: [bu_id, decided_by, expires_at, kind, requested_by, status, target_ref]
    description: "An approved request was applied"
  - type: approval.expired
    category: approval
    severities: [info]
    requires: [target]
    attributes: [bu_id, decided_by, expires_at, kind, requested_by, status, target_ref]
    description: "A pending approval request expired"
  - type: approval.rejected
    category: approval
    severities: [info]
    requires: [target]
    attributes: [bu_id, decided_by, expires_at, kind, requested_by, status, target_ref]
    description: "A dual-approval request was rejected"
  - type: approval.requested
    category: approval
    severities: [info]
    requires: [target]
    attributes: [bu_id, decided_by, expires_at, kind, requested_by, status, target_ref]
    description: "A dual-approval request was created"
  - type: assignment.mapped_granted
    category: access
    severities: [info]
    requires: [target]
    bu: required
    attributes: [bu, group, mapping, role, user]
    description: "A group mapping gave a member its role (T-24)"
  - type: assignment.mapped_revoked
    category: access
    severities: [info]
    requires: [target]
    bu: required
    attributes: [bu, group, mapping, role, user]
    description: "A group mapping's role was taken from a former member"
  - type: assignment.mapped_skipped
    category: access
    severities: [info, high]
    requires: [target]
    bu: required
    attributes: [bu, group, mapping, role, user]
    description: "A group mapping could not give a member its role (inactive, or a rule conflict)"
  - type: audit.checkpoint
    category: system
    severities: [info]
    requires: [target]
    attributes: [key_id, segment, seq_from, seq_to, signature, statement]
    description: "A segment of the audit trail was closed with a signed checkpoint, copied to the SIEM through this event (F-002 T-09, AC-09, AC-10)"
  - type: audit.export_fetched
    category: access
    severities: [low]
    requires: [target]
    attributes: [digest, export_id]
    description: "Someone downloaded an evidence export's bundle (F-002 T-15, design §6.6)"
  - type: audit.exported
    category: access
    severities: [high]
    requires: [target]
    attributes: [bu_scope_count, checkpoint_segment, digest, export_id, failure, filter, format, record_count, status]
    description: "An evidence export of the audit trail was made (status ready: its filter, record count, bundle digest and closing checkpoint) or could not be made (status failed); the actor is the requester and the reason theirs (F-002 T-15, AC-32 to AC-34)"
  - type: audit.invalid_event
    category: system
    severities: [critical]
    attributes: [payload]
    description: "An event that did not match this catalog, recorded instead of it (a defect; the original is attached)"
  - type: audit.history_viewed
    category: access
    severities: [low]
    attributes: [filter, result_count]
    description: "Someone viewed the audit history of a target or an actor; the filter is attached (F-002 T-12, AC-20)"
  - type: audit.searched
    category: access
    severities: [low]
    attributes: [filter, result_count, view]
    description: "Someone read the audit trail: a search, a record and its proof, a request's records, checkpoints, keys or status; view says which and the filter is attached (F-002 T-12, AC-20)"
  - type: audit.verification_failed
    category: system
    severities: [critical]
    requires: [target]
    attributes: [failed_at_segment, failed_at_seq, kind, reason, verification_id]
    description: "A verification run found the audit trail altered, incomplete or diverging from its external copies; the audit_integrity finding is open (F-002 T-11, AC-13)"
  - type: audit.verification_recovered
    category: system
    severities: [high]
    requires: [target]
    attributes: [kind, to_segment, to_seq, verification_id]
    description: "A full verification passed after a failure, resolving the audit_integrity finding (F-002 T-11, AC-13)"
  - type: authn.client_credentials
    category: token
    severities: [info]
    requires: [target]
    attributes: [credential, expires_at, ip, method]
    description: "A service account obtained an access token (T-33)"
  - type: authn.client_credentials_failed
    category: token
    severities: [low, high]
    requires: [target]
    attributes: [ip, method, thumbprint]
    description: "A service account's token request failed authentication"
  - type: authn.group_claims_applied
    category: access
    severities: [info]
    requires: [target]
    attributes: [claim, idp, joined, left]
    description: "A sign-in's group claim changed the user's claim-group membership (T-24b); mapped roles follow"
  - type: authn.group_claims_unreadable
    category: access
    severities: [high]
    requires: [target]
    attributes: [claim, idp]
    description: "A sign-in's group claim was an overage pointer or over the caps (500 values, 256 characters); claim-group membership was left unchanged (T-24b)"
  - type: authn.login.denied
    category: authentication
    severities: [low, high]
    attributes: [acr, amr, assertion_id, authn_context, client, external_id, idp, idp_initiated, name_id, stage, subject, user_id]
    description: "A sign-in was refused (unknown or inactive user, failed check)"
  - type: authn.login.success
    category: authentication
    severities: [info]
    requires: [target]
    attributes: [acr, amr, assertion_id, authn_context, client, external_id, idp, idp_initiated, mfa_satisfied, name_id, step_up, subject, user_id]
    description: "A user signed in through an IdP"
  - type: authn.step_up_failed
    category: authentication
    severities: [high]
    requires: [target]
    attributes: [acr, amr, assertion_id, authn_context, client, external_id, idp, idp_initiated, name_id, step_up, subject]
    description: "A step-up sign-in was refused: the IdP did not report an authentication at or after the request (F-015 T-24b)"
  - type: authn.mfa_missing
    category: authentication
    severities: [high]
    requires: [target]
    attributes: [acr, amr, assertion_id, authn_context, client, external_id, idp, idp_initiated, mfa_satisfied, name_id, subject, user_id]
    description: "A sign-in was refused for lacking the required MFA (T-18), or a phishing-resistant method for a privileged user (T-36)"
  - type: authz.scope.drift
    category: access
    severities: [high]
    attributes: [user_id]
    description: "The nightly reconciliation found a user's stored scope out of date and repaired it"
  - type: banner.changed
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [text, version]
    description: "The system-use notification text changed (T-19)"
  - type: breakglass.accounts_disabled
    category: breakglass
    severities: [high]
    requires: [target]
    attributes: [accounts_disabled]
    description: "Break-glass accounts were disabled because break-glass turned off (disabling, expiry, profile switch)"
  - type: breakglass.disabled
    category: breakglass
    severities: [high]
    requires: [target]
    attributes: [accounts_disabled, reason]
    description: "Break-glass was disabled (AC-45)"
  - type: breakglass.emergency_enabled
    category: breakglass
    severities: [critical]
    requires: [target]
    attributes: [expires_at, holders, reason]
    description: "An operator enabled break-glass during an IdP outage (T-35)"
  - type: breakglass.enabled
    category: breakglass
    severities: [high]
    requires: [target]
    attributes: [approval, approved_by, at_install, emergency, exception, holders, operator, reason, requested_by]
    description: "Break-glass was enabled, at install or after a second approval (AC-40, AC-41)"
  - type: breakglass.enrolled
    category: breakglass
    severities: [high]
    requires: [target]
    attributes: [credential_id, ip]
    description: "A break-glass holder registered a security key"
  - type: breakglass.enrollment_reset
    category: breakglass
    severities: [high]
    requires: [target]
    attributes: [email]
    description: "A break-glass account got a new enrollment code; its keys were removed"
  - type: breakglass.login
    category: breakglass
    severities: [high]
    requires: [target]
    attributes: [credential_id, email, ip, user_agent]
    description: "A break-glass account signed in (AC-43)"
  - type: breakglass.login_failed
    category: breakglass
    severities: [high]
    requires: [target]
    attributes: [failures, ip, threshold]
    description: "A break-glass sign-in of a known account failed (counts towards lockout)"
  - type: bu.created
    category: bu_restriction
    severities: [high]
    requires: [target]
    bu: required
    attributes: [code, parent, restricted, rollup_mode, source]
    description: "A BU was created (T-31 import, T-30b API)"
  - type: bu.archived
    category: bu_restriction
    severities: [high]
    requires: [target]
    bu: required
    attributes: [code, restricted, rollup_mode]
    description: "A BU was archived (T-30b, AC-16)"
  - type: bu.max_depth_changed
    category: bu_restriction
    severities: [high]
    requires: [target]
    attributes: [code, from, restricted, rollup_mode, to]
    description: "The BU tree's maximum depth was changed (T-30b, AC-15)"
  - type: bu.moved
    category: bu_restriction
    severities: [info, high]
    bu: required
    attributes: [approval, approved_by, at, bu_id, code, new_parent, old_parent, reach_gained, reach_lost, requested_by, restricted, restricted_entered, restricted_left, rollup_mode, source]
    description: "A BU was moved in the tree: high from the BU API with the reason and the old and new parent (T-30b, AC-17); info from the scope worker"
  - type: bu.renamed
    category: bu_restriction
    severities: [high]
    requires: [target]
    bu: required
    attributes: [code, from, restricted, rollup_mode, source]
    description: "A BU was renamed"
  - type: bu.restricted
    category: bu_restriction
    severities: [high]
    requires: [target]
    bu: required
    attributes: [code, restricted, rollup_mode]
    description: "A BU was restricted (AC-59)"
  - type: bu.rollup_loosened
    category: bu_restriction
    severities: [high]
    requires: [target]
    bu: required
    attributes: [approval, approved_by, before, code, requested_by, restricted, rollup_mode]
    description: "A restricted BU's roll-up visibility was loosened after approval (AC-63)"
  - type: bu.rollup_tightened
    category: bu_restriction
    severities: [high]
    requires: [target]
    bu: required
    attributes: [before, code, restricted, rollup_mode]
    description: "A restricted BU's roll-up visibility was tightened"
  - type: bu.unrestricted
    category: bu_restriction
    severities: [high]
    requires: [target]
    bu: required
    attributes: [approval, approved_by, code, requested_by, restricted, rollup_mode]
    description: "A BU was un-restricted after approval (AC-63)"
  - type: catalog.notices_acknowledged
    category: role_permission
    severities: [info]
    requires: [target]
    attributes: [count]
    description: "Administrators acknowledged permission-catalog notices (T-29)"
  - type: catalog.permission_reclassified
    category: role_permission
    severities: [high]
    requires: [target]
    attributes: [action, admin_risk_users, catalog_version, privileged, risk_data]
    description: "A release reclassified a permission (action, privileged or risk-data flag)"
  - type: catalog.permission_restored
    category: role_permission
    severities: [high]
    requires: [target]
    attributes: [catalog_version]
    description: "A release restored a retired permission"
  - type: catalog.permission_retired
    category: role_permission
    severities: [high]
    requires: [target]
    attributes: [catalog_version]
    description: "A release retired a permission"
  - type: db.migrated
    category: system
    severities: [info, high]
    attributes: [added_permissions, applied, catalog_previous, catalog_version, created_roles, custom_roles_changed, event_types_added, event_types_retired, profiles_imported, reclassified_permissions, restored_permissions, retired_permissions, versioned_roles]
    description: "Database migrations and the release catalog were applied"
  - type: entitlement.exported
    category: access
    severities: [high]
    requires: [target]
    attributes: [filters, format, rows]
    description: "An entitlement report or restricted-BU access listing was exported as CSV or PDF (T-38)"
  - type: group_mapping.created
    category: access
    severities: [high]
    requires: [target]
    bu: required
    attributes: [bu, group, mapping, role, user]
    description: "A group-to-role mapping was created (T-24)"
  - type: group_mapping.removed
    category: access
    severities: [high]
    requires: [target]
    bu: required
    attributes: [bu, group, mapping, role, user]
    description: "A group-to-role mapping was removed"
  - type: idp.claim_group_added
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [claim_value, display_name, idp]
    description: "A claim group was declared for an IdP's group claim (T-24b)"
  - type: idp.claim_group_removed
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [claim_value, display_name, idp]
    description: "A claim group was removed from an IdP (T-24b)"
  - type: idp.created
    category: configuration
    severities: [high]
    attributes: [email_domains, enabled, kind, metadata_source, name]
    description: "An identity provider was configured (T-17)"
  - type: idp.disabled
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [email_domains, enabled, kind, metadata_source, name]
    description: "An identity provider was disabled"
  - type: idp.enabled
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [email_domains, enabled, kind, metadata_source, name]
    description: "An identity provider was enabled"
  - type: idp.metadata_changed
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [email_domains, enabled, fingerprints, kind, metadata_source, name]
    description: "An identity provider's metadata or trust anchors changed"
  - type: idp.mfa_rule_changed
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [email_domains, enabled, kind, metadata_source, mfa_evidence_rule, name]
    description: "An identity provider's MFA evidence rule changed (T-18)"
  - type: idp.updated
    category: configuration
    severities: [high]
    attributes: [email_domains, enabled, kind, metadata_source, name]
    description: "An identity provider's settings changed"
  - type: key.db_context_registered
    category: configuration
    severities: [high]
    requires: [target]
    attributes: []
    description: "The installer registered a DB-context signing key in authz.ctx_key (iam keys register, T-41)"
  - type: key.db_context_retired
    category: configuration
    severities: [high]
    requires: [target]
    attributes: []
    description: "The installer retired a DB-context signing key (iam keys retire-db-context, T-41)"
  - type: overlay.change_requested
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [change_id, controls, default, direction, key, previous, value]
    description: "A Restricted BU overlay change was requested (F-015 T-23)"
  - type: overlay.changed
    category: configuration
    severities: [info]
    requires: [target]
    attributes: [change_id, default, direction, key, previous, value]
    description: "A Restricted BU overlay value changed"
  - type: overlay.exception_created
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [approved_by, change_id, exception_id, expires_at, key, owner, value]
    description: "A Restricted BU overlay exception was approved"
  - type: overlay.weakened
    category: configuration
    severities: [high]
    attributes: []
    description: "SecOps notification (SaaS): the Restricted BU overlay was weakened"
  - type: posture.drift_acknowledged
    category: configuration
    severities: [low]
    requires: [target]
    attributes: [acknowledged_by, check_id, controls, finding_id, kind, remediation, severity, subject]
    description: "A drift finding was acknowledged (F-015 T-26)"
  - type: posture.drift_detected
    category: configuration
    severities: [high, critical]
    requires: [target]
    attributes: [check_id, controls, detail, finding_id, kind, remediation, severity, subject]
    description: "The drift engine opened a finding (F-015 T-25)"
  - type: posture.drift_resolved
    category: configuration
    severities: [info]
    requires: [target]
    attributes: [acknowledged_by, check_id, controls, detail, finding_id, kind, remediation, severity, subject]
    description: "A drift finding was resolved"
  - type: posture.export_fetched
    category: configuration
    severities: [low]
    requires: [target]
    attributes: [as_of, created_at, document_sha256, export_id, key_id, kind, snapshot_sha256]
    description: "A signed posture export was fetched (F-015 T-35)"
  - type: posture.export_mismatch
    category: configuration
    severities: [critical]
    requires: [target]
    attributes: [as_of, created_at, document_sha256, export_id, key_id, kind, reason, snapshot_sha256]
    description: "A posture export no longer reproduces from its snapshot"
  - type: posture.exported
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [as_of, created_at, document_sha256, export_id, key_id, kind, snapshot_sha256]
    description: "A signed OSCAL posture export was created"
  - type: posture.k8s_access_declined
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [permissions_digest, previous, state]
    description: "Kubernetes-access consent was declined (F-015 T-30)"
  - type: posture.k8s_access_granted
    category: configuration
    severities: [info]
    requires: [target]
    attributes: [acknowledged, permissions_digest, previous, state]
    description: "Kubernetes-access consent was granted or acknowledged"
  - type: posture.k8s_access_requested
    category: configuration
    severities: [low]
    requires: [target]
    attributes: [permissions_digest, previous, state]
    description: "A change of the Kubernetes permissions awaits acknowledgement"
  - type: posture.k8s_access_revoked
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [permissions_digest, previous, state]
    description: "Kubernetes-access consent was revoked"
  - type: posture.package_imported
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [package_digest, profile, version]
    description: "A signed profile package was imported (F-015 T-10)"
  - type: posture.seeded
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [package_digest, profile, settings, version]
    description: "The installation's posture was seeded from a profile"
  - type: profile.activated
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [changed, switch_id]
    description: "A profile switch was activated (F-015 T-21)"
  - type: profile.approved
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [profile, version]
    description: "A custom profile was approved (F-015 T-19)"
  - type: profile.conflict_resolved
    category: configuration
    severities: [info]
    requires: [target]
    attributes: [bu_id, key, resolution, switch_id]
    description: "A profile-switch conflict was resolved"
  - type: profile.created
    category: configuration
    severities: [info]
    requires: [target]
    attributes: [base, base_version, name, profile]
    description: "A custom profile was created"
  - type: profile.imported
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [base, base_version, format, profile, version]
    description: "A custom profile was imported (F-015 T-20)"
  - type: profile.rebased
    category: configuration
    severities: [info]
    requires: [target]
    attributes: [base_version, from_version, profile]
    description: "A custom profile was rebased on its updated base"
  - type: profile.reopened
    category: configuration
    severities: [info]
    requires: [target]
    attributes: [profile, version]
    description: "An approved custom profile was reopened for edits"
  - type: profile.submitted
    category: configuration
    severities: [high]
    requires: [target]
    attributes: [profile, version]
    description: "A custom profile was submitted for approval"
  - type: profile.switch_cancelled
    category: configuration
    severities: [info]
    requires: [target]
    attributes: [switch_id]
    description: "A pending profile switch was cancelled"
  - type: profile.switch_requested
    category: configuration
    severities: [info, high]
    requires: [target]
    attributes: [conflicts, loosening, switch_id]
    description: "A profile switch was requested"
  - type: profile.switched
    category: configuration
    severities: [high]
    attributes: []
    description: "SecOps notification (SaaS): a loosening profile switch was activated"
  - type: profile.value_changed
    category: configuration
    severities: [info, low]
    requires: [target]
    attributes: [bound, default, key, loosened, profile, version]
    description: "A custom profile value was edited"
  - type: profile.versioned
    category: configuration
    severities: [info]
    requires: [target]
    attributes: [from_version, profile]
    description: "A custom profile got a new version"
  - type: role.cloned
    category: role_permission
    severities: [info]
    requires: [target]
    attributes: [added, affected_users, name, removed, version]
    description: "A role was created by cloning another (T-28)"
  - type: role.cloned_from
    category: role_permission
    severities: [info]
    requires: [target]
    attributes: [name, source]
    description: "The source of a cloned role"
  - type: role.created
    category: role_permission
    severities: [info]
    requires: [target]
    attributes: [added, affected_users, name, removed, version]
    description: "A custom role was created"
  - type: role.imported
    category: role_permission
    severities: [info]
    requires: [target]
    attributes: [added, affected_users, name, removed, version]
    description: "A role was created or changed by import (T-29)"
  - type: role.privileged_added
    category: role_permission
    severities: [high]
    requires: [target]
    attributes: [name, permissions, version]
    description: "A privileged permission was added to a role (AC-54)"
  - type: role.reactivated
    category: role_permission
    severities: [high]
    requires: [target]
    attributes: [name]
    description: "A role suspended for a SoD conflict was reactivated"
  - type: role.retired
    category: role_permission
    severities: [high]
    requires: [target]
    attributes: [name]
    description: "A custom role was retired"
  - type: role.suspended
    category: role_permission
    severities: [high]
    requires: [target]
    attributes: [conflicts, name]
    description: "A role was suspended for a SoD conflict (T-27)"
  - type: role.updated
    category: role_permission
    severities: [info, high]
    requires: [target]
    attributes: [added, affected_users, catalog_version, name, removed, version]
    description: "A role got a new version"
  - type: scim.group.created
    category: scim
    severities: [info]
    requires: [target]
    attributes: [display_name, idp, members_added, members_removed]
    description: "SCIM created a group (T-21)"
  - type: scim.group.deleted
    category: scim
    severities: [high]
    requires: [target]
    attributes: [display_name, idp]
    description: "SCIM deleted a group"
  - type: scim.group.updated
    category: scim
    severities: [info]
    requires: [target]
    attributes: [display_name, idp, members_added, members_removed]
