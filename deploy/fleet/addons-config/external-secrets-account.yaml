# The account whose token the SecretStore fair-instance-keys presents
# (deploy/k8s/keys/saas/external-secrets.yaml): its IRSA role may read the
# instance's Secrets Manager entries fair/<instance>/* and nothing else
# (infra/modules/instance output workload_roles.external-secrets). No pod
# runs as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fair-external-secrets
  namespace: fair-platform
  labels: { app.kubernetes.io/part-of: fair-platform }
  annotations:
    eks.amazonaws.com/role-arn: "${FAIR_ROLE_EXTERNAL_SECRETS}"
automountServiceAccountToken: false
