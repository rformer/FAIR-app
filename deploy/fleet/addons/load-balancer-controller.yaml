# F-012 T-15 (design §3.5): the AWS Load Balancer Controller, chart 3.6.2,
# image by digest. It only registers the gateway's pods in the public load
# balancer's existing target group (the TargetGroupBinding of
# deploy/fleet/addons-config; infra/modules/instance output
# gateway_target_group_arn): the load balancer, its listeners, TLS policy
# and WAF are OpenTofu's, so no Ingress, Service or Gateway mutation is
# enabled. IRSA role load-balancer-controller (kube-system/
# aws-load-balancer-controller), FIPS endpoints.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: flux-system
  labels: { app.kubernetes.io/part-of: fair-platform }
spec:
  interval: 30m
  releaseName: aws-load-balancer-controller
  targetNamespace: kube-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: aws-load-balancer-controller
      version: 3.6.2
      sourceRef: { kind: HelmRepository, name: eks }
  values:
    image:
      repository: public.ecr.aws/eks/aws-load-balancer-controller
      tag: v3.6.2@sha256:fd51f0ec82f8d357837aa57fdfaa4fca7137b75f25a09b421d95c425c9dc2d94
    clusterName: "${FAIR_CLUSTER_NAME}"
    region: "${FAIR_REGION}"
    vpcId: "${FAIR_VPC_ID}"
    serviceAccount:
      create: true
      name: aws-load-balancer-controller
      annotations:
        eks.amazonaws.com/role-arn: "${FAIR_ROLE_LOAD_BALANCER_CONTROLLER}"
    createIngressClassResource: false
    enableServiceMutatorWebhook: false
    enableShield: false
    enableWaf: false
    enableWafv2: false
    env:
      AWS_USE_FIPS_ENDPOINT: "true"
