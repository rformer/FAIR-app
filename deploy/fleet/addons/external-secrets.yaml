# F-012 T-15 (design §3.5; F-001 T-41): the External Secrets Operator, chart
# 2.15.0, image by digest. It copies the instance's Secrets Manager entries
# into the Secrets the services mount (the release's secrets/ directory:
# deploy/k8s/keys/saas). It holds no AWS credentials of its own: the
# SecretStore authenticates with the token of fair-platform/
# fair-external-secrets, whose IRSA role may read fair/<instance>/* only
# (deploy/fleet/addons-config; infra/modules/instance).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
  labels: { app.kubernetes.io/part-of: fair-platform }
spec:
  interval: 30m
  releaseName: external-secrets
  targetNamespace: external-secrets
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: external-secrets
      version: 2.15.0
      sourceRef: { kind: HelmRepository, name: external-secrets }
  values:
    installCRDs: true
    image:
      repository: ghcr.io/external-secrets/external-secrets
      tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
    webhook:
      image:
        repository: ghcr.io/external-secrets/external-secrets
        tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
    certController:
      image:
        repository: ghcr.io/external-secrets/external-secrets
        tag: v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31
    extraEnv:
      - { name: AWS_USE_FIPS_ENDPOINT, value: "true" }
