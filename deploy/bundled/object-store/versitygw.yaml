# F-014 T-08 (F-014-AC-01, AC-03; design §3.3, D-OQ12; ADR-020): the
# bundled object store, versitygw rebuilt from source with the Go FIPS module
# (Dockerfile target versitygw), POSIX backend with versioning and Object
# Lock, one replica on one encrypted volume (the cluster's default
# StorageClass; ADR-020's limits: software WORM, not highly available, made
# durable by backups). TLS 1.2 or later from Secret versitygw-tls
# (installation CA; SAN versitygw.fair-objects.svc). Set stores.*.endpoint to
# versitygw.fair-objects.svc:443.
#
# Accounts (ADR-020 T-07 findings): the internal IAM backend, --iam-dir on
# the same volume (iam/users.json, 0600, owned by 65532). fairctl creates
# the audit store, the WORM copy and the report store, and one account of
# role "user" per bucket owning only that bucket (admin
# change-bucket-owner), and delivers each account's keys only to the
# platform's key store (the service's own key mounts). The root account is
# the only admin and is given to no service.
#
# The root credential: versitygw reads it only from flags or the
# environment (ROOT_ACCESS_KEY_ID, ROOT_SECRET_ACCESS_KEY), with no file
# option, so it comes from Secret versitygw-root (generated by fairctl) by
# secretKeyRef, never as a literal: the manifests, the chart and its values
# hold no credential. Hardening otherwise as the platform's: non-root,
# read-only root filesystem, capabilities dropped, no ServiceAccount token.
apiVersion: v1
kind: Namespace
metadata:
  name: fair-objects
  labels:
    app.kubernetes.io/part-of: fair-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: fair-objects
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: versitygw
  namespace: fair-objects
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: versitygw-data
  namespace: fair-objects
  labels: { app.kubernetes.io/name: versitygw, app.kubernetes.io/part-of: fair-platform }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 100Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: versitygw
  namespace: fair-objects
  labels: { app.kubernetes.io/name: versitygw, app.kubernetes.io/part-of: fair-platform }
spec:
  replicas: 1
  strategy: { type: Recreate } # one writer of the volume
  selector:
    matchLabels: { app.kubernetes.io/name: versitygw }
  template:
    metadata:
      labels: { app.kubernetes.io/name: versitygw, app.kubernetes.io/part-of: fair-platform }
    spec:
      serviceAccountName: versitygw
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: versitygw
          image: ghcr.io/rformer/fair-versitygw:REPLACE_WITH_DIGEST
          # The image's entrypoint holds --cert and --key; the backend is
          # POSIX only (no other backend is configured).
          args: ["--port", ":7070", "--iam-dir", "/var/lib/versitygw/iam", "posix", "--versioning-dir", "/var/lib/versitygw/versions", "/var/lib/versitygw/data"]
          ports: [{ name: s3, containerPort: 7070 }]
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: versitygw-root, key: access-key-id } }
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: versitygw-root, key: secret-access-key } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 10
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: tls, mountPath: /etc/versitygw/tls, readOnly: true }
            - { name: data, mountPath: /var/lib/versitygw/data, subPath: data }
            - { name: data, mountPath: /var/lib/versitygw/versions, subPath: versions }
            - { name: data, mountPath: /var/lib/versitygw/iam, subPath: iam }
      volumes:
        - name: tls
          secret: { secretName: versitygw-tls, defaultMode: 0440 }
        - name: data
          persistentVolumeClaim: { claimName: versitygw-data }
---
apiVersion: v1
kind: Service
metadata:
  name: versitygw
  namespace: fair-objects
  labels: { app.kubernetes.io/name: versitygw, app.kubernetes.io/part-of: fair-platform }
spec:
  selector: { app.kubernetes.io/name: versitygw }
  ports: [{ name: s3, port: 443, targetPort: s3 }]
---
# Ingress: S3 from the audit service (audit store, WORM copy) and the risk
# service (report store) only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: versitygw-ingress
  namespace: fair-objects
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: versitygw }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: fair-platform }
          podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [audit, risk] }
      ports: [{ port: 7070, protocol: TCP }]
---
# The audit and risk services' egress to the store's pod port (policies
# apply after Service translation, so their 443 rule does not cover 7070).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: object-store-egress
  namespace: fair-platform
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [audit, risk] }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: fair-objects }
          podSelector:
            matchLabels: { app.kubernetes.io/name: versitygw }
      ports: [{ port: 7070, protocol: TCP }]
