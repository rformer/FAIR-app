# F-014 T-08: the bundled Keycloak (chart switch keycloak.bundled, which
# needs postgres.bundled) with the realm of deploy/keycloak.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [keycloak.yaml, database.yaml]
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: keycloak-realm
    namespace: fair-identity
    files: [fair-realm.json=../../keycloak/fair-realm.json]
