# F-014 T-08: the bundled OpenTelemetry Collector (chart switch
# collector.bundled) with deploy/observability's self-hosted configuration.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [collector.yaml]
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: otelcol-selfhosted
    namespace: fair-platform
    files: [config.yaml=../../observability/collector-selfhosted.yaml]
