# F-014 T-08 (design §3.3): the bundled NATS JetStream server (ConfigMap
# nats-config, mounted at /etc/nats/nats.conf). Every listener is TLS 1.2 or
# later with installation-CA certificates (Secret nats-tls); the client port
# accepts a TLS-first handshake (the scanner's probe) and the classic one
# (the platform's clients). Clients authenticate with NKEY-signed user JWTs
# (the services' .creds files): the operator, account and user JWTs are
# generated by fairctl into Secret nats-auth (auth/resolver.conf: operator,
# system_account, resolver MEMORY and resolver_preload). No password, bcrypt
# hash or auth callout is configured: those run outside the Go FIPS module
# (deploy/bundled/sources.json). Routes between the three servers require
# client certificates from the same CA.
server_name: $POD_NAME
listen: 0.0.0.0:4222
https: 0.0.0.0:8222
max_payload: 1M
lame_duck_duration: 30s

tls {
  cert_file: /etc/nats/tls/tls.crt
  key_file: /etc/nats/tls/tls.key
  ca_file: /etc/nats/tls/ca.crt
  min_version: "1.2"
  handshake_first: "300ms"
  timeout: 2
}

include ./auth/resolver.conf

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256M
  max_file_store: 8G
}

cluster {
  name: fair
  listen: 0.0.0.0:6222
  tls {
    cert_file: /etc/nats/tls/tls.crt
    key_file: /etc/nats/tls/tls.key
    ca_file: /etc/nats/tls/ca.crt
    verify: true
    min_version: "1.2"
    timeout: 2
  }
  routes: [
    nats-route://nats-0.nats-headless.fair-platform.svc:6222
    nats-route://nats-1.nats-headless.fair-platform.svc:6222
    nats-route://nats-2.nats-headless.fair-platform.svc:6222
  ]
}
