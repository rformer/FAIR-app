# F-014 T-08 (design §3.3, D-OQ2): the bundled PostgreSQL 16, a
# CloudNativePG Cluster of three instances in fair-data running our image
# (Dockerfile target postgres: PostgreSQL 16 with the OpenSSL FIPS provider
# 3.1.2, CMVP #4985). Its postgres user is 65532 (the image's), not the
# operator's default 26.
#
# TLS: the server certificate and CA are fairctl's (installation CA, or the
# customer's issuer), so the platform's PGSSLROOTCERT (Secret db-ca in
# fair-platform) holds the same CA; TLS 1.2 is the floor, and pg_hba refuses
# every connection without TLS. The platform's roles are created by fairctl's
# database bootstrap (design §3.6) through the superuser, whose password
# fairctl generates into fair-db-superuser; the database owner CloudNativePG
# creates is made NOLOGIN at once (the platform's tables belong to
# fair_owner). Set database.host to fair-db-rw.fair-data.svc.
#
# The instance pods are the operator's: it sets their security context
# (non-root, read-only root filesystem, capabilities dropped, seccomp
# RuntimeDefault) and mounts their ServiceAccount token, which the instance
# manager needs (hardening exception, as for the operator). Backups (WAL
# archiving and base backups through our plugin) come with T-24.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fair-db
  namespace: fair-data
  labels: { app.kubernetes.io/name: fair-db, app.kubernetes.io/part-of: fair-platform }
spec:
  instances: 3
  imageName: ghcr.io/rformer/fair-postgres:REPLACE_WITH_DIGEST
  postgresUID: 65532
  postgresGID: 65532
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true
  superuserSecret: { name: fair-db-superuser }
  certificates:
    serverCASecret: fair-db-ca
    serverTLSSecret: fair-db-server-tls
  bootstrap:
    initdb:
      database: fair
      owner: fair_db_owner
      dataChecksums: true
      postInitSQL:
        - ALTER ROLE fair_db_owner NOLOGIN
  postgresql:
    parameters:
      ssl_min_protocol_version: TLSv1.2
      password_encryption: scram-sha-256
      log_connections: "on"
      log_disconnections: "on"
    pg_hba:
      - hostnossl all all 0.0.0.0/0 reject
      - hostnossl all all ::/0 reject
      # The bundled Keycloak's role reaches its own database only.
      - hostssl keycloak keycloak all scram-sha-256
      - host all keycloak all reject
  monitoring:
    tls: { enabled: true }
  storage:
    size: 50Gi
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 4Gi }
---
# Ingress: PostgreSQL from the platform's pods (fair-platform), the bundled
# Keycloak (fair-identity) and the other instances (replication); the
# instance manager's status port from the operator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fair-db-ingress
  namespace: fair-data
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: fair-db }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: fair-platform }
          podSelector:
            matchLabels: { app.kubernetes.io/part-of: fair-platform }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: fair-identity }
          podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak }
        - podSelector:
            matchLabels: { cnpg.io/cluster: fair-db }
      ports: [{ port: 5432, protocol: TCP }]
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cloudnative-pg }
      ports: [{ port: 8000, protocol: TCP }]
---
# Egress: the API server (the instance manager), the other instances, DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fair-db-egress
  namespace: fair-data
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: fair-db }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: REPLACE_WITH_APISERVER_CIDR }
      ports: [{ port: 443, protocol: TCP }, { port: 6443, protocol: TCP }]
    - to:
        - podSelector:
            matchLabels: { cnpg.io/cluster: fair-db }
      ports: [{ port: 5432, protocol: TCP }, { port: 8000, protocol: TCP }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
