# Runs migrations as app_migrator (never as app_rw). The Helm chart (F-014)
# runs this as a pre-install/pre-upgrade hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: iam-migrate
  namespace: fair
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: iam-migrate, app.kubernetes.io/part-of: fair }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: fair-iam:dev
          args: ["migrate"]
          env:
            - { name: IAM_MIGRATOR_DATABASE_URL_FILE, value: /var/run/secrets/fair/migrator/url }
          volumeMounts:
            - { name: migrator, mountPath: /var/run/secrets/fair/migrator, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: migrator
          secret: { secretName: iam-migrator-db, defaultMode: 0400 }
