# Reference manifest for the notify service (F-009 T-03, design §1, §2, §11).
# The supported install path is the Helm/Zarf bundle from F-014; this file
# documents the hardening every chart must preserve. Key material comes from
# the mode's key store (deploy/k8s/keys: secret-mounts.yaml, saas/, openbao/).
# Stateless (A5): two replicas; one leads (collects, fans out, digests,
# retention), every replica delivers. notify is the only platform service
# with egress beyond the platform: to the SMTP relay and the webhooks that
# notification.allowed_hosts names (design §3.4). Narrow the egress rule
# below to the destinations' addresses where the cluster's CNI allows it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notify
  namespace: fair-platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify
  namespace: fair-platform
  labels: { app.kubernetes.io/name: notify, app.kubernetes.io/part-of: fair-platform }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: notify }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notify, app.kubernetes.io/part-of: fair-platform }
    spec:
      serviceAccountName: notify
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notify
          image: ghcr.io/rformer/fair-notify:REPLACE_WITH_DIGEST
          ports: [{ name: https, containerPort: 8443 }]
          env:
            - { name: FAIR_ENV, value: production }
            - { name: FAIR_DEPLOYMENT_MODE, value: self-hosted } # saas or air-gapped as installed (ADR-005)
            - { name: FAIR_TLS_CERT_FILE, value: /tls/tls.crt }
            - { name: FAIR_TLS_KEY_FILE, value: /tls/tls.key }
            - { name: PGHOST, value: REPLACE_WITH_DB_HOST }
            - { name: PGDATABASE, value: fair }
            - { name: PGSSLMODE, value: verify-full }
            - { name: PGSSLROOTCERT, value: /db-ca/ca.crt }
            # app_notify's password: the notify schema only through its functions.
            - { name: FAIR_DB_PASSWORD_FILE, value: /secrets/db/password }
            # Links in notices are built from this, never from data (design §3.3).
            - { name: FAIR_NOTIFY_BASE_URL, value: https://REPLACE_WITH_PLATFORM_HOST }
            # The cluster's pod and service ranges: never a destination (design §3.4).
            - { name: FAIR_NOTIFY_CLUSTER_CIDRS, value: "10.96.0.0/12,10.244.0.0/16" }
            # The SMTP relay's password file(s), named in its configuration.
            - { name: FAIR_NOTIFY_SMTP_DIR, value: /keys/smtp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: db, mountPath: /secrets/db, readOnly: true }
            - { name: db-ca, mountPath: /db-ca, readOnly: true }
            - { name: smtp, mountPath: /keys/smtp, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: notify-tls }
        - name: db
          secret: { secretName: notify-db-app, defaultMode: 0400 }
        - name: db-ca
          secret: { secretName: db-ca }
        # The customer's own Secret with the relay's password, if it needs one.
        - name: smtp
          secret: { secretName: fair-notify-smtp, defaultMode: 288, optional: true } # 0440
---
apiVersion: v1
kind: Service
metadata:
  name: notify
  namespace: fair-platform
spec:
  selector: { app.kubernetes.io/name: notify }
  ports: [{ name: https, port: 443, targetPort: https }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notify-ingress-from-gateway
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: notify }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      ports: [{ port: 8443, protocol: TCP }]
---
# Egress: PostgreSQL, DNS, NATS, and SMTP (465, 587, 25) and HTTPS (443) for
# the relay and webhooks. The service itself refuses any destination that
# notification.allowed_hosts does not name, loopback, link-local and the
# cluster's ranges, and in air-gapped mode anything outside private ranges
# (design §3.4); this policy is the second fence.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notify-egress
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: notify }
  policyTypes: [Egress]
  egress:
    - ports: [{ port: 5432, protocol: TCP }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 4222, protocol: TCP }]
    - to:
        - ipBlock: { cidr: 0.0.0.0/0, except: [10.96.0.0/12, 10.244.0.0/16, 169.254.0.0/16, 127.0.0.0/8] }
      ports: [{ port: 443, protocol: TCP }, { port: 465, protocol: TCP }, { port: 587, protocol: TCP }, { port: 25, protocol: TCP }]
