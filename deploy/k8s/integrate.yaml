# Reference manifest for the integrate service (F-011 T-15, design §1, §2, §11).
# The supported install path is the Helm/Zarf bundle from F-014; this file
# documents the hardening every chart must preserve. Key material comes from
# the mode's key store (deploy/k8s/keys: secret-mounts.yaml, saas/, openbao/).
# Stateless (A5): two replicas; one leads (claims due connector runs). It
# holds connectors' sealed credentials and fetches from the hosts that
# integration.allowed_hosts names (design §3.3); it submits what it fetched
# through the gateway as the integration's service account and never writes
# risk data itself. In air-gapped installs it may run at zero replicas when
# no connector is configured (design §11). Narrow the egress rule below to
# the sources' addresses where the cluster's CNI allows it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: integrate
  namespace: fair-platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrate
  namespace: fair-platform
  labels: { app.kubernetes.io/name: integrate, app.kubernetes.io/part-of: fair-platform }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: integrate }
  template:
    metadata:
      labels: { app.kubernetes.io/name: integrate, app.kubernetes.io/part-of: fair-platform }
    spec:
      serviceAccountName: integrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: integrate
          image: ghcr.io/rformer/fair-integrate:REPLACE_WITH_DIGEST
          ports: [{ name: https, containerPort: 8443 }]
          env:
            - { name: FAIR_ENV, value: production }
            - { name: FAIR_DEPLOYMENT_MODE, value: self-hosted } # saas or air-gapped as installed (ADR-005)
            - { name: FAIR_TLS_CERT_FILE, value: /tls/tls.crt }
            - { name: FAIR_TLS_KEY_FILE, value: /tls/tls.key }
            - { name: PGHOST, value: REPLACE_WITH_DB_HOST }
            - { name: PGDATABASE, value: fair }
            - { name: PGSSLMODE, value: verify-full }
            - { name: PGSSLROOTCERT, value: /db-ca/ca.crt }
            # app_integrate's password: the integration schema only through its functions.
            - { name: FAIR_DB_PASSWORD_FILE, value: /secrets/db/password }
            # Connectors submit their batches here, as the integration's service account (design §3.3).
            - { name: FAIR_INTEGRATE_GATEWAY_URL, value: https://gateway.fair-platform.svc }
            - { name: FAIR_INTEGRATE_GATEWAY_CA_FILE, value: /gateway-ca/ca.crt }
            # The cluster's pod and service ranges: never a source (design §3.3).
            - { name: FAIR_INTEGRATE_CLUSTER_CIDRS, value: "10.96.0.0/12,10.244.0.0/16" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: db, mountPath: /secrets/db, readOnly: true }
            - { name: db-ca, mountPath: /db-ca, readOnly: true }
            - { name: gateway-ca, mountPath: /gateway-ca, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: integrate-tls }
        - name: db
          secret: { secretName: integrate-db-app, defaultMode: 0400 }
        - name: db-ca
          secret: { secretName: db-ca }
        - name: gateway-ca
          secret: { secretName: gateway-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: integrate
  namespace: fair-platform
spec:
  selector: { app.kubernetes.io/name: integrate }
  ports: [{ name: https, port: 443, targetPort: https }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: integrate-ingress-from-gateway
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: integrate }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      ports: [{ port: 8443, protocol: TCP }]
---
# Egress: PostgreSQL, DNS, the gateway (connectors submit through it), and
# HTTPS (443) to sources outside the cluster. The service itself refuses any
# source that integration.allowed_hosts does not name, loopback, link-local
# and the cluster's ranges, and in air-gapped mode anything outside private
# ranges (design §3.3, internal/egress); this policy is the second fence.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: integrate-egress
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: integrate }
  policyTypes: [Egress]
  egress:
    - ports: [{ port: 5432, protocol: TCP }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      ports: [{ port: 8443, protocol: TCP }]
    - to:
        - ipBlock: { cidr: 0.0.0.0/0, except: [10.96.0.0/12, 10.244.0.0/16, 169.254.0.0/16, 127.0.0.0/8] }
      ports: [{ port: 443, protocol: TCP }]
