# Reference manifest for the audit service (F-002 T-05, design §2). The
# supported install path is the Helm/Zarf bundle from F-014; this file
# documents the hardening every chart must preserve. Key material comes from
# the mode's key store (deploy/k8s/keys: secret-mounts.yaml, saas/, openbao/).
# Two replicas: one leads (a PostgreSQL advisory lock) and sequences,
# checkpoints and verifies; both serve the audit API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit
  namespace: fair-platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: fair-platform
  labels: { app.kubernetes.io/name: audit, app.kubernetes.io/part-of: fair-platform }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: audit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: audit, app.kubernetes.io/part-of: fair-platform }
    spec:
      serviceAccountName: audit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: audit
          image: ghcr.io/rformer/fair-audit:REPLACE_WITH_DIGEST
          ports: [{ name: https, containerPort: 8443 }]
          env:
            - { name: FAIR_ENV, value: production }
            - { name: FAIR_DEPLOYMENT_MODE, value: self-hosted } # saas on vendor-operated instances (ADR-005)
            - { name: FAIR_TLS_CERT_FILE, value: /tls/tls.crt }
            - { name: FAIR_TLS_KEY_FILE, value: /tls/tls.key }
            - { name: PGHOST, value: REPLACE_WITH_DB_HOST }
            - { name: PGDATABASE, value: fair }
            - { name: PGSSLMODE, value: verify-full }
            - { name: PGSSLROOTCERT, value: /db-ca/ca.crt }
            - { name: FAIR_DB_PASSWORD_FILE, value: /secrets/db/password }
            # The audit store (F-002 T-15): evidence export bundles and, from
            # T-18, archives. Required in every mode; the bucket must have
            # versioning and Object Lock; credentials are files.
            - { name: FAIR_AUDIT_STORE_BUCKET, value: REPLACE_WITH_BUCKET }
            - { name: FAIR_AUDIT_STORE_ENDPOINT, value: REPLACE_WITH_HOST_PORT }
            - { name: FAIR_AUDIT_STORE_REGION, value: us-east-1 }
            - { name: FAIR_AUDIT_STORE_ACCESS_KEY_FILE, value: /secrets/store/access-key }
            - { name: FAIR_AUDIT_STORE_SECRET_KEY_FILE, value: /secrets/store/secret-key }
            # Export bundles are spooled here before upload (the root file
            # system is read-only).
            - { name: TMPDIR, value: /spool }
            # The SIEM's CA for syslog over TLS (F-002 T-16; the destination
            # is the setting audit.syslog_destination). Without it, the
            # system roots.
            # - { name: FAIR_AUDIT_SYSLOG_CA_FILE, value: /secrets/siem/ca.crt }
            # The same for OTLP (T-17; audit.otlp_destination).
            # - { name: FAIR_AUDIT_OTLP_CA_FILE, value: /secrets/siem/otlp-ca.crt }
            # SaaS: write-once storage for checkpoint copies (F-002 AC-10).
            # The bucket must have versioning and Object Lock (the service
            # refuses one without); credentials are files (internal/objstore).
            # - { name: FAIR_AUDIT_WORM_BUCKET, value: REPLACE_WITH_BUCKET }
            # - { name: FAIR_AUDIT_WORM_ENDPOINT, value: REPLACE_WITH_HOST_PORT }
            # - { name: FAIR_AUDIT_WORM_REGION, value: us-east-1 }
            # - { name: FAIR_AUDIT_WORM_ACCESS_KEY_FILE, value: /secrets/worm/access-key }
            # - { name: FAIR_AUDIT_WORM_SECRET_KEY_FILE, value: /secrets/worm/secret-key }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: db, mountPath: /secrets/db, readOnly: true }
            - { name: db-ca, mountPath: /db-ca, readOnly: true }
            - { name: store, mountPath: /secrets/store, readOnly: true }
            - { name: spool, mountPath: /spool }
      volumes:
        - name: store
          secret: { secretName: audit-store, defaultMode: 0400 }
        # Two exports at a time, each up to a few GiB spooled (1 million
        # records with proofs is about 1.5 GiB).
        - name: spool
          emptyDir: { sizeLimit: 8Gi }
        - name: tls
          secret: { secretName: audit-tls }
        - name: db
          secret: { secretName: audit-db-app, defaultMode: 0400 }
        - name: db-ca
          secret: { secretName: db-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: fair-platform
spec:
  selector: { app.kubernetes.io/name: audit }
  ports: [{ name: https, port: 443, targetPort: https }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-ingress-from-gateway
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: audit }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      ports: [{ port: 8443, protocol: TCP }]
---
# Egress: PostgreSQL, DNS, NATS (scope changes for the audit API, T-12) and
# object storage over TLS (write-once checkpoint copies, T-09; exports,
# T-15; archives, T-18), and the SIEM: syslog over TLS on 6514 (T-16, the
# setting audit.syslog_destination; change the port here if the SIEM listens
# elsewhere), and OTLP over gRPC with TLS on 4317 (T-17, the setting
# audit.otlp_destination); narrow `to` once the chart knows where they run.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-egress
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: audit }
  policyTypes: [Egress]
  egress:
    - ports: [{ port: 5432, protocol: TCP }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 4222, protocol: TCP }]
    - ports: [{ port: 443, protocol: TCP }]
    - ports: [{ port: 6514, protocol: TCP }]
    - ports: [{ port: 4317, protocol: TCP }]
