# F-012 T-15 (design §3.5, §3.6): SaaS, the services' TLS certificates,
# issued by cert-manager from the instance's ACM Private CA (the cluster
# issuer fair-internal, an AWSPCAClusterIssuer: deploy/fleet/addons-config).
# ECDSA P-256, short-lived and renewed by cert-manager; each Secret also
# carries the CA (ca.crt). gateway-ca and otelcol-agent-ca are mounted for
# their ca.crt only.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: iam-tls
  namespace: fair-platform
spec:
  secretName: iam-tls
  commonName: iam.fair-platform.svc
  dnsNames: [iam.fair-platform.svc]
  usages: [digital signature, server auth]
  duration: 720h
  renewBefore: 240h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  issuerRef: { group: awspca.cert-manager.io, kind: AWSPCAClusterIssuer, name: fair-internal }
---
