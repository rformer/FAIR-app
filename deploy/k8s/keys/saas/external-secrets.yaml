# F-001 T-41 (design §10, SaaS): the instance's keys live in the cloud secret
# manager, encrypted under the instance's own KMS key, one secret per store
# entry: fair/<instance>/<service>/<dir>, a JSON object whose fields are the
# file names (`iam keys init` output; docs/install/keys.md). The External
# Secrets Operator copies each into the Secret that secret-mounts.yaml mounts.
# The example store is AWS Secrets Manager, reached with the operator's own
# workload identity (IRSA); GCP Secret Manager and Azure Key Vault stores
# take the same ExternalSecrets. REPLACE_WITH_INSTANCE is the instance id.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: fair-instance-keys
  namespace: fair-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_WITH_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: fair-external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fair-gateway-jwt
  namespace: fair-platform
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: SecretStore, name: fair-instance-keys }
  target:
    name: fair-gateway-jwt
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: fair/REPLACE_WITH_INSTANCE/gateway/jwt
