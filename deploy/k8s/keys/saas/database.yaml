# F-012 T-15 (design §3.5, §3.6): SaaS, the database role passwords from
# the instance's Secrets Manager entries fair/<instance>/database/<role>
# ({"password": ...}, loaded at onboarding, infra/modules/instance
# secrets.tf), copied by the External Secrets Operator into the Secrets the
# services mount (/secrets/db/password, mode 0400). The release renders
# REPLACE_WITH_INSTANCE as the instance's id (releasegen fleet).
# the migration Job (iam migrate)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-db-migrator
  namespace: fair-platform
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: SecretStore, name: fair-instance-keys }
  target:
    name: iam-db-migrator
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: fair/REPLACE_WITH_INSTANCE/database/app_migrator
        property: password
---
