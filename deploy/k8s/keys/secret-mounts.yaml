# F-001 T-41 (design §10): each service's keys as Kubernetes Secrets, one per
# store entry (fair-<service>-<dir>), mounted read-only at /keys/<dir> with
# mode 0440 (the services refuse key files open to other users). Used in SaaS,
# where saas/external-secrets.yaml fills the Secrets from the cloud secret
# manager (encrypted under the instance's KMS key), and in air-gapped and
# self-hosted installs without OpenBao, where the installer creates them from
# `iam keys init` (docs/install/keys.md).
# Strategic-merge patches for the gateway, iam, posture, audit and risk Deployments (the
# F-014 chart applies them; by hand: kubectl patch deployment NAME -n
# fair-platform --type strategic --patch-file FILE, one document per file).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fair-platform
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: gateway
          env:
            - { name: FAIR_JWT_KEYS_DIR, value: /keys/jwt }
            - { name: FAIR_LOGIN_TICKET_KEYS_DIR, value: /keys/login-ticket }
            - { name: FAIR_SESSION_PEPPER_FILE, value: /keys/secrets/session-pepper }
            - { name: FAIR_TOKEN_PEPPER_FILE, value: /keys/secrets/token-pepper }
            - { name: FAIR_DB_CONTEXT_KEY_FILE, value: /keys/secrets/db-context.key }
            - { name: FAIR_DB_CONTEXT_KEY_ID_FILE, value: /keys/secrets/db-context.id }
          volumeMounts:
            - { name: keys-jwt, mountPath: /keys/jwt, readOnly: true }
            - { name: keys-login-ticket, mountPath: /keys/login-ticket, readOnly: true }
            - { name: keys-secrets, mountPath: /keys/secrets, readOnly: true }
      volumes:
        - name: keys-jwt
          secret: { secretName: fair-gateway-jwt, defaultMode: 288 } # 0440
        - name: keys-login-ticket
          secret: { secretName: fair-gateway-login-ticket, defaultMode: 288 } # 0440
        - name: keys-secrets
          secret: { secretName: fair-gateway-secrets, defaultMode: 288 } # 0440
---
