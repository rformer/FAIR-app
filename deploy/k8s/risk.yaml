# Reference manifest for the risk service (F-003 T-04, design §2, §7). The
# supported install path is the Helm/Zarf bundle from F-014; this file
# documents the hardening every chart must preserve. Key material comes from
# the mode's key store (deploy/k8s/keys: secret-mounts.yaml, saas/, openbao/).
# Stateless (A5): two replicas serve the risk API; the database holds
# everything, under row-level security. The installation currency is set
# once at install (`risk currency set CODE -operator NAME`, as app_migrator).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risk
  namespace: fair-platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk
  namespace: fair-platform
  labels: { app.kubernetes.io/name: risk, app.kubernetes.io/part-of: fair-platform }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: risk }
  template:
    metadata:
      labels: { app.kubernetes.io/name: risk, app.kubernetes.io/part-of: fair-platform }
    spec:
      serviceAccountName: risk
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: risk
          image: ghcr.io/rformer/fair-risk:REPLACE_WITH_DIGEST
          ports: [{ name: https, containerPort: 8443 }]
          env:
            - { name: FAIR_ENV, value: production }
            - { name: FAIR_DEPLOYMENT_MODE, value: self-hosted } # saas on vendor-operated instances (ADR-005)
            - { name: FAIR_TLS_CERT_FILE, value: /tls/tls.crt }
            - { name: FAIR_TLS_KEY_FILE, value: /tls/tls.key }
            - { name: PGHOST, value: REPLACE_WITH_DB_HOST }
            - { name: PGDATABASE, value: fair }
            - { name: PGSSLMODE, value: verify-full }
            - { name: PGSSLROOTCERT, value: /db-ca/ca.crt }
            # app_rw's password: the risk service writes only under RLS.
            - { name: FAIR_DB_PASSWORD_FILE, value: /secrets/db/password }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: db, mountPath: /secrets/db, readOnly: true }
            - { name: db-ca, mountPath: /db-ca, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: risk-tls }
        - name: db
          secret: { secretName: risk-db-app, defaultMode: 0400 }
        - name: db-ca
          secret: { secretName: db-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: risk
  namespace: fair-platform
spec:
  selector: { app.kubernetes.io/name: risk }
  ports: [{ name: https, port: 443, targetPort: https }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: risk-ingress-from-gateway
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: risk }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      ports: [{ port: 8443, protocol: TCP }]
---
# Egress: PostgreSQL, DNS and NATS (scope changes for the API's grant cache)
# only. The risk service makes no outbound connections in any mode (design
# §7).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: risk-egress
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: risk }
  policyTypes: [Egress]
  egress:
    - ports: [{ port: 5432, protocol: TCP }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 4222, protocol: TCP }]
