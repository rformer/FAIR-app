# Reference manifest for the risk service (F-003 T-04, design §2, §7). The
# supported install path is the Helm/Zarf bundle from F-014; this file
# documents the hardening every chart must preserve. Key material comes from
# the mode's key store (deploy/k8s/keys: secret-mounts.yaml, saas/, openbao/).
# Stateless (A5): two replicas serve the risk API; the database holds
# everything, under row-level security. The installation currency is set
# once at install (`risk currency set CODE -operator NAME`, as app_migrator).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risk
  namespace: fair-platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk
  namespace: fair-platform
  labels: { app.kubernetes.io/name: risk, app.kubernetes.io/part-of: fair-platform }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: risk }
  template:
    metadata:
      labels: { app.kubernetes.io/name: risk, app.kubernetes.io/part-of: fair-platform }
    spec:
      serviceAccountName: risk
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: risk
          image: ghcr.io/rformer/fair-risk:REPLACE_WITH_DIGEST
          ports: [{ name: https, containerPort: 8443 }]
          env:
            - { name: FAIR_ENV, value: production }
            - { name: FAIR_DEPLOYMENT_MODE, value: self-hosted } # saas on vendor-operated instances (ADR-005)
            - { name: FAIR_TLS_CERT_FILE, value: /tls/tls.crt }
            - { name: FAIR_TLS_KEY_FILE, value: /tls/tls.key }
            - { name: PGHOST, value: REPLACE_WITH_DB_HOST }
            - { name: PGDATABASE, value: fair }
            - { name: PGSSLMODE, value: verify-full }
            - { name: PGSSLROOTCERT, value: /db-ca/ca.crt }
            # app_rw's password: the risk service writes only under RLS.
            - { name: FAIR_DB_PASSWORD_FILE, value: /secrets/db/password }
            # F-005 T-11: the simulation engine, through engine-gate (its client
            # keys come from the key store: FAIR_ENGINE_CLIENT_DIR).
            - { name: FAIR_ENGINE_ADDR, value: engine.fair-platform.svc:8444 }
            - { name: FAIR_ENGINE_IMAGE_DIGEST, value: REPLACE_WITH_ENGINE_DIGEST } # sha256:<hex> of the engine image
            # F-010 T-05: the report store (generated report files, deleted
            # after report.retention_days). Required in every mode; the bucket
            # must be versioned (not write-once); credentials are files.
            - { name: FAIR_REPORT_STORE_BUCKET, value: REPLACE_WITH_BUCKET }
            - { name: FAIR_REPORT_STORE_ENDPOINT, value: REPLACE_WITH_HOST_PORT }
            - { name: FAIR_REPORT_STORE_REGION, value: us-east-1 }
            - { name: FAIR_REPORT_STORE_ACCESS_KEY_FILE, value: /secrets/report-store/access-key }
            - { name: FAIR_REPORT_STORE_SECRET_KEY_FILE, value: /secrets/report-store/secret-key }
            # The store's CA, if not one the system trusts.
            # - { name: FAIR_REPORT_STORE_CA_FILE, value: /secrets/report-store/ca.crt }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: db, mountPath: /secrets/db, readOnly: true }
            - { name: db-ca, mountPath: /db-ca, readOnly: true }
            - { name: report-store, mountPath: /secrets/report-store, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: risk-tls }
        - name: db
          secret: { secretName: risk-db-app, defaultMode: 0400 }
        - name: db-ca
          secret: { secretName: db-ca }
        - name: report-store
          secret: { secretName: report-store, defaultMode: 0400 }
---
apiVersion: v1
kind: Service
metadata:
  name: risk
  namespace: fair-platform
spec:
  selector: { app.kubernetes.io/name: risk }
  ports: [{ name: https, port: 443, targetPort: https }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: risk-ingress-from-gateway
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: risk }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      ports: [{ port: 8443, protocol: TCP }]
---
# Egress: PostgreSQL, DNS, NATS (scope changes for the API's grant cache),
# the simulation engine's gate (F-005 T-10) and the report store over TLS
# (F-010 T-05; narrow the rule to the store's address or port where known).
# No other outbound connection in any mode.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: risk-egress
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: risk }
  policyTypes: [Egress]
  egress:
    - ports: [{ port: 5432, protocol: TCP }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 4222, protocol: TCP }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: engine }
      ports: [{ port: 8444, protocol: TCP }]
    - ports: [{ port: 443, protocol: TCP }]
