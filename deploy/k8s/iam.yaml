# iam Deployment for dev clusters (kind/k3d). The Helm chart (F-014) replaces
# this; the security posture here is what the chart must keep.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam
  namespace: fair
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: fair
  labels: { app.kubernetes.io/name: iam, app.kubernetes.io/part-of: fair }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: iam }
  template:
    metadata:
      labels: { app.kubernetes.io/name: iam, app.kubernetes.io/part-of: fair }
    spec:
      serviceAccountName: iam
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Omit runAsUser/runAsGroup on OpenShift so the restricted SCC can
        # assign an arbitrary UID; the image works under any non-root UID.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: iam
          image: fair-iam:dev
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: IAM_PROFILE, value: fedramp-moderate }
            - { name: AUDIT_SINKS, value: log }
            # Production: mount the app_rw URL from a Secret / ExternalSecret.
            # - name: IAM_DATABASE_URL_FILE
            #   value: /var/run/secrets/fair/db/url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  namespace: fair
spec:
  selector: { app.kubernetes.io/name: iam }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# iam accepts traffic only from the gateway (and kubelet probes, which
# NetworkPolicy does not filter). Egress: DNS, PostgreSQL, NATS, OTLP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iam
  namespace: fair
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: iam }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      ports: [{ port: 8080 }]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/part-of: fair-data } }
      ports: [{ port: 5432 }, { port: 4222 }, { port: 4318 }]
