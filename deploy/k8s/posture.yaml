# Reference manifest for the posture service (F-015 T-08, design §5, §6;
# F-014 T-04, design §3.2). The supported install path is the Helm/Zarf
# bundle from F-014; this file documents the hardening every chart must
# preserve. Key material comes from the mode's key store (deploy/k8s/keys:
# secret-mounts.yaml, saas/, openbao/).
# posture serves the Posture API (from the gateway only) and the scanner
# channel (mTLS gRPC on 9443, from posture-scanner only: its policy is in
# deploy/k8s/posture-scanner.yaml), and runs drift detection, reverts and
# exception notices. One replica: those loops have no leader election, and
# their writes are serialised by row locks, not shared out. Connects as
# app_posture, which reaches the posture schema only through its SECURITY
# DEFINER functions (design §5 access model).
# Install-time, as Jobs or by fairctl, with the same image: `posture seed`,
# `posture import`, `posture k8s-access`, `posture export-key`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: posture
  namespace: fair-platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posture
  namespace: fair-platform
  labels: { app.kubernetes.io/name: posture, app.kubernetes.io/part-of: fair-platform }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: posture }
  template:
    metadata:
      labels: { app.kubernetes.io/name: posture, app.kubernetes.io/part-of: fair-platform }
    spec:
      serviceAccountName: posture
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: posture
          image: ghcr.io/rformer/fair-posture:REPLACE_WITH_DIGEST
          ports:
            - { name: https, containerPort: 8443 }
            - { name: scanner, containerPort: 9443 }
          env:
            - { name: FAIR_ENV, value: production }
            # Must equal posture.set_deployment_mode (F-015 T-15).
            - { name: FAIR_DEPLOYMENT_MODE, value: self-hosted } # saas or air-gapped as installed (ADR-005)
            - { name: FAIR_TLS_CERT_FILE, value: /tls/tls.crt }
            - { name: FAIR_TLS_KEY_FILE, value: /tls/tls.key }
            - { name: PGHOST, value: REPLACE_WITH_DB_HOST }
            - { name: PGDATABASE, value: fair }
            - { name: PGSSLMODE, value: verify-full }
            - { name: PGSSLROOTCERT, value: /db-ca/ca.crt }
            # app_posture's password: no table privileges, definer functions only.
            - { name: FAIR_DB_PASSWORD_FILE, value: /secrets/db/password }
            # Settings changes, heartbeats and scope changes (required in
            # production: drift detection, F-015 T-25).
            - { name: FAIR_NATS_URL, value: tls://nats.fair-platform:4222 }
            - { name: FAIR_NATS_CREDS_FILE, value: /secrets/nats/posture.creds }
            # Signs OSCAL exports (F-015 T-35; `posture export-key` at install).
            - { name: FAIR_EXPORT_SIGNING_KEY_FILE, value: /secrets/export/export-signing.pem }
            # The scanner channel (F-015 T-27): posture's certificate, and the CA
            # and URI SAN the scanner's client certificate must have. Required
            # in SaaS mode (drift detection is always on there).
            - { name: FAIR_SCANNER_GRPC_ADDR, value: ":9443" }
            - { name: FAIR_SCANNER_GRPC_CERT_FILE, value: /tls/tls.crt }
            - { name: FAIR_SCANNER_GRPC_KEY_FILE, value: /tls/tls.key }
            - { name: FAIR_SCANNER_CLIENT_CA_FILE, value: /tls/ca.crt }
            - { name: FAIR_SCANNER_IDENTITY, value: "spiffe://fair-platform/posture-scanner" }
            # SaaS only (required there; refused when air-gapped): vendor SecOps
            # notifications (F-015 AC-23).
            # - { name: FAIR_SECOPS_WEBHOOK_URL, value: https://secops.example }
            # - { name: FAIR_SECOPS_SECRET_FILE, value: /secrets/secops/secret }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: db, mountPath: /secrets/db, readOnly: true }
            - { name: db-ca, mountPath: /db-ca, readOnly: true }
            - { name: nats, mountPath: /secrets/nats, readOnly: true }
            - { name: export-key, mountPath: /secrets/export, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: posture-tls }
        - name: db
          secret: { secretName: posture-db-app, defaultMode: 0400 }
        - name: db-ca
          secret: { secretName: db-ca }
        - name: nats
          secret: { secretName: posture-nats, defaultMode: 0400 }
        - name: export-key
          secret: { secretName: posture-export-key, defaultMode: 0400 }
---
apiVersion: v1
kind: Service
metadata:
  name: posture
  namespace: fair-platform
spec:
  selector: { app.kubernetes.io/name: posture }
  ports:
    - { name: https, port: 443, targetPort: https }
    - { name: scanner, port: 9443, targetPort: scanner }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: posture-ingress-from-gateway
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: posture }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      ports: [{ port: 8443, protocol: TCP }]
---
# Egress: PostgreSQL, DNS and NATS. No other outbound connection, except in
# SaaS the SecOps webhook over HTTPS, which a SaaS install adds with the
# webhook's address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: posture-egress
  namespace: fair-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: posture }
  policyTypes: [Egress]
  egress:
    - ports: [{ port: 5432, protocol: TCP }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: nats }
      ports: [{ port: 4222, protocol: TCP }]
