# NIST SP 800-53 Rev 5 control implementation statements for F-008 (risk
# acceptance lifecycle), task T-10. Source for the platform's OSCAL
# component definition (F-014 assembles the features' files); checked by
# internal/compliance tests: the controls are exactly F-008's control
# mapping, every evidence path and test exists, and the OSCAL output
# validates against the pinned schema.
#
# responsibility, per deployment mode (ADR-005):
#   provider  the platform (and, in SaaS, the vendor operating it) meets it
#   shared    the platform provides the mechanism; the customer operates it
#   customer  the customer meets it
# customer: what the customer does wherever the responsibility is shared
# or customer. Evidence tests are "<package dir>:<test name>".
feature: F-008
title: Risk acceptance lifecycle
status: approved # signed off by Robert Former, 2026-11-16
controls:
  - id: ac-3
    responsibility: { saas: provider, self-hosted: provider, air-gapped: provider }
    statement: >-
      Acceptances and their steps are business-unit-owned data under forced
      row-level security, read under the caller's signed database context
      with acceptance.view. Only the acceptance definer role writes them,
      through functions that take the actor from the signed context and
      check the permission themselves; the application role cannot insert,
      update or delete a row. An approver's inbox lists only acceptances the
      approver sees and may decide. Names shown on the pages are only those
      of people who requested or acted on an acceptance the reader sees.
      Inside a restricted business unit an acceptance never needs approvers
      from outside its restricted subtree, who could not see it.
    evidence:
      code: [db/migrations/0115_acceptance_schema.sql, db/migrations/0117_acceptance_lifecycle.sql, db/migrations/0120_acceptance_people.sql,
             db/migrations/0121_acceptance_restricted_tier.sql, internal/acceptanceapi/acceptances.go]
      tests: ["db/tests:TestSTRIDEF008Visibility", "db/tests:TestAcceptanceRestrictedTier", "db/tests:TestRLSHarnessEveryBUOwnedTable",
              "db/tests:TestAcceptanceSchema"]

  - id: ac-5
    responsibility: { saas: provider, self-hosted: shared, air-gapped: shared }
    statement: >-
      The person who requests an acceptance and the risk's owner can never
      decide it, even when they hold acceptance.approve. Each approver
      decides once per round, so a tier that needs two approvals needs two
      different approvers, and one rejection ends the request. F-001's
      built-in separation-of-duties rule keeps analysis.edit and
      acceptance.approve out of one role, so the analyst who models a risk
      does not approve accepting it.
    customer: >-
      Assign the Approver role to people independent of the risks they
      approve, and review the assignments in access reviews (F-001).
    evidence:
      code: [db/migrations/0117_acceptance_lifecycle.sql, internal/access/catalog/release/builtin_roles.json]
      tests: ["db/tests:TestSTRIDEF008SeparationOfDuties", "db/tests:TestSoDBlocksCustomRolesUnlessExcepted"]

  - id: ac-6
    responsibility: { saas: provider, self-hosted: provider, air-gapped: provider }
    statement: >-
      Requesting needs acceptance.request at the risk's business unit, and
      deciding or revoking needs acceptance.approve at the tier's business
      unit, which the tier settings fix when the request is made or a review
      opens: the risk's unit, an ancestor a set number of levels up, or the
      root. A later change to the settings does not move an existing
      acceptance, except through the higher-tier check. The job runs without
      a user, as the system, through one function granted to the
      application role, and can only expire, notify and suspend.
    evidence:
      code: [db/migrations/0117_acceptance_lifecycle.sql, db/migrations/0122_acceptance_sweep_set_based.sql, internal/acceptance/job.go]
      tests: ["db/tests:TestSTRIDEF008Authority", "db/tests:TestAcceptanceLifecycle"]

  - id: au-2
    responsibility: { saas: shared, self-hosted: shared, air-gapped: shared }
    statement: >-
      F-008 adds these events to the security event catalog under the
      category risk_data:
      acceptance.requested, withdrawn, approved, rejected and activated;
      acceptance.suspended, review_requested and reactivated;
      and acceptance.revoked, expired, replaced and ended.
      Decisions (approved, rejected, revoked) are recorded at high severity.
    customer: >-
      Decide which acceptance events to forward to the SIEM and review, for
      example approvals and revocations.
    evidence:
      code: [pkg/audit/catalog.yaml]
      tests: ["pkg/audit:TestCatalogMatchesCode", "db/tests:TestSTRIDEF008Attribution"]

  - id: au-12
    responsibility: { saas: provider, self-hosted: shared, air-gapped: shared }
    statement: >-
      Every step is recorded in the transaction that takes it, with the
      actor (the system for the job), the business unit and, for decisions,
      withdrawals and revocations, the reason. A refused step leaves neither
      a step nor an event, and if the event cannot be recorded the step is
      not taken. The steps are append-only for every role, and the evidence
      a request was made on (the exposure, its pinned analyses and the tier)
      is copied into the request, so later changes to the risk do not alter
      what was approved.
    customer: >-
      Monitor the audit trail's capacity and forwarding (F-002).
    evidence:
      code: [db/migrations/0117_acceptance_lifecycle.sql, db/migrations/0115_acceptance_schema.sql]
      tests: ["db/tests:TestSTRIDEF008Attribution", "db/tests:TestSTRIDEF008HistoryTamper", "db/tests:TestAcceptanceSweep"]

  - id: cm-6
    responsibility: { saas: shared, self-hosted: shared, air-gapped: shared }
    statement: >-
      The tiers and the longest duration are F-015 settings with bounds and
      profile floors: acceptance.tier1_max and tier2_max (the mean annual
      loss bounds of tiers 1 and 2), tier1_levels_up and tier2_levels_up,
      tier1_approvals, tier2_approvals and tier3_approvals (one or two, never
      none), and max_duration_days (30 to 730). The service refuses to start
      when tier 2's bound is below tier 1's.
    customer: >-
      Choose the tiers and the longest duration within the bounds, through
      the posture workflow.
    evidence:
      code: [pkg/settings/profiles.go, bindings/acceptance.tier1_max.yaml, bindings/acceptance.max_duration_days.yaml, internal/acceptance/acceptance.go]
      tests: ["db/tests:TestAcceptanceSettings", "internal/acceptance:TestLimitsCheck"]

  - id: pm-9
    responsibility: { saas: customer, self-hosted: customer, air-gapped: customer }
    statement: >-
      The tiers express the organization's risk tolerance as the platform
      applies it: how large a risk's simulated mean annual loss may be for
      its own business unit to accept it, when it must go higher, and when
      two approvers are needed. Acceptance is bounded in time, always
      expires, and is suspended for approval again when the risk's exposure
      grows into a higher tier.
    customer: >-
      Set the tiers to the organization's risk management strategy and
      review them when it changes.
    evidence:
      code: [internal/acceptance/acceptance.go, db/migrations/0122_acceptance_sweep_set_based.sql]
      tests: ["internal/acceptance:TestPlace", "db/tests:TestAcceptanceSweep"]

  - id: ra-7
    responsibility: { saas: shared, self-hosted: shared, air-gapped: shared }
    statement: >-
      A register risk whose treatment decision is accept is accepted only
      through an approved acceptance, requested on a current exposure with a
      justification, any conditions and an expiry, and approved at the tier
      its exposure places it in. Acceptances expire on their date unless
      renewed, with notices 30, 14 and 7 days before and on expiry; a
      renewal replaces the acceptance in force without a gap. One in force
      needs review when the exposure goes stale, the treatment changes or
      the risk moves, and is suspended when the exposure enters a higher
      tier. Approvers may revoke it, and closing the risk ends it.
    customer: >-
      Approve, renew and revoke acceptances, and act on reviews and notices.
    evidence:
      code: [db/migrations/0117_acceptance_lifecycle.sql, db/migrations/0122_acceptance_sweep_set_based.sql, internal/acceptanceapi/acceptances.go,
             web/src/acceptance/AcceptancePage.tsx]
      tests: ["db/tests:TestAcceptanceLifecycle", "db/tests:TestAcceptanceSweep", "db/tests:TestAcceptanceAPI"]

  - id: si-10
    responsibility: { saas: provider, self-hosted: provider, air-gapped: provider }
    statement: >-
      Every request and decision is checked in the database: the risk is
      open, its treatment decision accept and its exposure current; the
      expiry after today and within the longest duration, an approval's
      expiry never later than requested; justifications, conditions,
      rationales and reasons bounded in length; one open request per risk.
      The API refuses unknown fields, bodies over 64 KiB and out-of-range
      parameters, and reports problems by JSON pointer.
    evidence:
      code: [db/migrations/0117_acceptance_lifecycle.sql, internal/acceptanceapi/api.go]
      tests: ["db/tests:TestSTRIDEF008Limits", "db/tests:TestAcceptanceLifecycle"]
