openapi: 3.1.0
info:
  title: FAIR Estimate API
  version: "1"
  contact: { name: FAIR Risk Platform, url: "https://github.com/rformer/FAIR-app" }
  description: |
    F-004 design §5. Estimate requests, answers and calibration, served by the risk service
    behind the gateway, which authenticates the session and forwards an internal JWT (ES256,
    audience `risk`, at most 5 minutes) and the DB context token it was minted with (F-001
    design §4, §5.2).

    Without a permission the routes need anywhere they do not exist for the caller (404,
    F-001 AC-25). The estimating aids change nothing and need no Idempotency-Key.
servers:
  - url: /
security:
  - internalJWT: []
    dbContext: []
tags:
  - { name: aids, description: "Estimating aids (F-004 R-03)" }
  - { name: requests, description: "Estimate requests (F-004 R-01)" }
  - { name: inbox, description: "The estimator's requests and answers (F-004 R-02)" }
components:
  securitySchemes:
    internalJWT: { type: http, scheme: bearer, bearerFormat: JWT }
    dbContext: { type: apiKey, in: header, name: X-Fair-DB-Context }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    EstimatorView:
      description: A request as its estimator sees it
      content:
        application/json:
          schema:
            type: object
            required: [request, context, factors, references, answers]
            properties:
              request: { type: object }
              context: { type: object }
              factors: { type: array, items: { type: object } }
              references: { type: array, items: { type: object } }
              answers: { type: array, items: { type: object } }
    Error:
      description: An error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
    Request:
      type: object
      required: [id, bu_id, scenario_id, scenario_version, title, instructions, confidence, due_at, status, affected, created_by, created_at, ended_at, factors, estimators]
      properties:
        id: { type: string, format: uuid }
        bu_id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        scenario_version: { type: integer, description: "The version the request was made from" }
        title: { type: string }
        instructions: { type: string }
        confidence: { type: string, description: "The confidence asked for, a decimal" }
        due_at: { type: string, format: date-time }
        status: { enum: [open, complete, closed, cancelled] }
        affected: { type: [string, "null"], enum: [moved, archived, factor_changed, null], description: "Set once when the scenario changed under the request (AC-06)" }
        cancel_reason: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        factors: { type: integer }
        estimators: { type: integer, description: "Estimators not removed" }
    Range:
      type: object
      required: [min, ml, max, confidence]
      additionalProperties: false
      properties:
        min: { type: string, description: "A decimal" }
        ml: { type: string, description: "A decimal" }
        max: { type: string, description: "A decimal" }
        confidence: { type: string, description: "A decimal between 0 and 1, exclusive" }
paths:
  /api/v1/estimates/inbox:
    get:
      operationId: listInbox
      tags: [inbox]
      summary: The requests addressed to the caller, soonest due first
      x-permission: estimate.submit (a request only to its current estimators)
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      required: [id, title, status, due_at, confidence, factors, answered]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        status: { enum: [open, complete, closed, cancelled] }
                        due_at: { type: string, format: date-time }
                        confidence: { type: string }
                        scenario_name: { type: [string, "null"] }
                        factors: { type: integer }
                        answered: { type: integer, description: "Factors with a submitted answer" }
                        finished_at: { type: [string, "null"], format: date-time }
                        created_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/estimates/inbox/{id}:
    get:
      operationId: getInboxRequest
      tags: [inbox]
      summary: A request as its estimator sees it
      description: >-
        The request's text, the shared context, the factors with their definitions, the pinned reference
        classes, and the caller's own answers with every revision (AC-07, AC-09). Never the scenario or
        another estimator's answers.
      x-permission: estimate.submit at the request's BU, as a current estimator of it
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/EstimatorView" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/estimates/inbox/{id}/answers:
    put:
      operationId: saveAnswers
      tags: [inbox]
      summary: Save drafts of, or submit, answers to factors
      description: >-
        Each answer is an estimate (checked as F-003 checks one, without elicitation provenance) or a decline
        with a reason, appended as a revision (AC-08 to AC-10). Drafts are the estimator's own; submitted
        revisions are recorded. Taken while the request is open or complete and before its due date. An
        estimator who has submitted every factor is finished, and when all are, the request is complete.
      x-permission: estimate.submit at the request's BU, as a current estimator of it
      x-reason-exempt: each estimate carries its rationale, each decline its reason
      x-audit-events: [estimate.answer_saved]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              additionalProperties: false
              properties:
                submit: { type: boolean, description: "false (the default) saves drafts" }
                answers:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    type: object
                    required: [pointer]
                    additionalProperties: false
                    properties:
                      pointer: { type: string }
                      estimate: { type: object, description: "min, ml, max, unit, confidence, rationale, sources (F-003 estimate)" }
                      declined: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/EstimatorView" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/estimates/requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: A scenario's estimate requests, newest first
      x-permission: scenario.view (under RLS)
      parameters:
        - { name: scenario, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { $ref: "#/components/schemas/Request" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createRequest
      tags: [requests]
      summary: Send an estimate request
      description: >-
        Asks the named estimators (each must hold estimate.submit at the scenario's BU) for estimates
        of factors of the scenario's current version: estimates its taxonomy levels require (AC-01).
        The context shown to them is a snapshot of the chosen fields, never an estimate (AC-02); the
        pinned reference classes are copied. Each estimator is sent an assigned notice (AC-05).
      x-permission: estimate.request and scenario.edit at the scenario's BU
      x-reason-field: instructions
      x-audit-events: [estimate.request_created]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario_id, title, due_at, factors, estimators]
              additionalProperties: false
              properties:
                scenario_id: { type: string, format: uuid }
                title: { type: string, minLength: 1, maxLength: 200 }
                instructions: { type: string, maxLength: 10000 }
                confidence: { type: string, description: "The confidence to answer at (default 0.9)" }
                due_at: { type: string, format: date-time }
                factors: { type: array, minItems: 1, maxItems: 60, items: { type: string, description: "JSON pointer of the factor's estimate" } }
                context: { type: array, items: { enum: [name, description, scope, analysis_period, asset, threat_community, threat_effects, loss_event] }, description: "Default: all" }
                estimators: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
                references:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [id, version]
                    additionalProperties: false
                    properties: { id: { type: string, format: uuid }, version: { type: integer, minimum: 1 } }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [id, scenario_version]
                properties: { id: { type: string, format: uuid }, scenario_version: { type: integer } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/estimates/requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: A request with its factors, estimators, references and context
      x-permission: scenario.view (under RLS)
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                type: object
                required: [request, context, factors, estimators, references]
                properties:
                  request: { $ref: "#/components/schemas/Request" }
                  context: { type: object }
                  factors: { type: array, items: { type: object } }
                  estimators: { type: array, items: { type: object } }
                  references: { type: array, items: { type: object } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: changeRequest
      tags: [requests]
      summary: Extend the due date, add or remove estimators
      description: While the request is open (AC-03). A removed estimator's answers are kept; an added one is sent an assigned notice.
      x-permission: estimate.request and scenario.edit at the request's BU
      x-audit-events: [estimate.request_changed]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                due_at: { type: string, format: date-time }
                add_estimators: { type: array, maxItems: 50, items: { type: string, format: uuid } }
                remove_estimators: { type: array, maxItems: 50, items: { type: string, format: uuid } }
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Changed
          content: { application/json: { schema: { type: object, required: [request], properties: { request: { $ref: "#/components/schemas/Request" } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/estimates/requests/{id}/cancel:
    post:
      operationId: cancelRequest
      tags: [requests]
      summary: Cancel an open request
      description: With a reason; its estimators are sent a closed notice (AC-03).
      x-permission: estimate.request and scenario.edit at the request's BU
      x-audit-events: [estimate.request_cancelled]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }
      responses:
        "200":
          description: Cancelled
          content: { application/json: { schema: { type: object, required: [request], properties: { request: { $ref: "#/components/schemas/Request" } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/estimates/warnings:
    post:
      operationId: checkEstimate
      tags: [aids]
      summary: Warnings, the equivalent bet and a preview for an estimate being entered
      description: >-
        For the answer form and the scenario editor (F-004 AC-11, AC-12; design §3.7). Warnings advise
        and never refuse: a most likely value at a bound, a range implausibly narrow or wide for its
        unit, a probability reaching 0 or 1, a confidence other than the one requested. The preview is an
        illustrative Beta-PERT curve through the range; the simulation chooses its own distributions
        (F-005). Nothing is changed or recorded.
      x-permission: estimate.submit, scenario.edit, library.edit or control.edit (anywhere)
      x-idempotency-exempt: it changes nothing
      x-reason-exempt: it changes nothing, so there is nothing to explain
      x-audit-events: []
      x-audit-note: a computation over the request body; nothing is changed or read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit, estimate]
              additionalProperties: false
              properties:
                unit: { enum: [events_per_year, probability, currency, percentile, fraction] }
                estimate: { $ref: "#/components/schemas/Range" }
                requested_confidence: { type: string, description: "The confidence a request asked for, if any" }
      responses:
        "200":
          description: The aids
          content:
            application/json:
              schema:
                type: object
                required: [warnings, bet, preview]
                properties:
                  warnings:
                    type: array
                    items:
                      type: object
                      required: [code, message]
                      properties:
                        code: { enum: [ml_at_bound, narrow_range, wide_range, reaches_certainty, other_confidence] }
                        pointer: { type: string }
                        message: { type: string }
                  bet: { type: string }
                  preview:
                    type: object
                    required: [shape, points]
                    properties:
                      shape: { enum: [beta_pert, point] }
                      points:
                        type: array
                        items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
