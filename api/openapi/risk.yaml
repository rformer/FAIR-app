                  version: { $ref: "#/components/schemas/Version" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/risk/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: The installation currency (design §3.4)
      x-permission: scenario.view, library.view or control.view
      responses:
        "200":
          description: Settings
          content: { application/json: { schema: { type: object, required: [currency], properties: { currency: { type: [string, "null"] } } } } }
        "404": { $ref: "#/components/responses/Error" }
