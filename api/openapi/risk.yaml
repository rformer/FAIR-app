openapi: 3.1.0
info:
  title: FAIR Risk API
  version: "1"
  contact: { name: FAIR Risk Platform, url: "https://github.com/rformer/FAIR-app" }
  description: |
    F-003 design §5. Requests reach the risk service through the gateway, which
    authenticates the session and forwards an internal JWT (ES256, audience `risk`, at most
    5 minutes) and the DB context token it was minted with (F-001 design §4, §5.2).

    Scenarios need `scenario.view` at some BU; without it the routes do not exist for the
    caller (404, F-001 AC-25). Which scenarios a caller sees is decided by the database from
    the signed DB context (row-level security, AC-18); one the caller cannot see answers 404,
    like one that does not exist. Creating needs `scenario.edit` at the scenario's BU and
    saving a version needs it at the scenario's BU: 403 for a caller who can see there, 404
    otherwise.

    A scenario is a document (design §3; JSON Schema `urn:fair:risk:scenario:1`, published
    with the release). Every save is a new version; earlier versions never change (AC-15). A
    save names the version it was made from (`expected_version`): if another version was
    saved since, it is refused (409 `stale_version`). An invalid document is refused with
    every problem, each at its JSON pointer (422 `invalid_document`); the database checks
    the same rules again. Stored documents are canonical (RFC 8785 subset: decimals as
    strings) and identified by their SHA-256 `digest`. A document holding amounts cannot be
    saved until the installation currency is set (409 `currency_not_set`).

    Library entries (assets, asset groups, threat communities, loss profiles: `library.view`,
    `library.edit`; AC-08) and controls (`control.view`, `control.edit`; AC-12, AC-14) have the
    same shape. They are shared down the BU tree (ADR-007 amendment 2): a caller also reads the
    entries of the BUs above their own, marked `inherited`, stopping at restricted BUs, and
    cannot change them (403). An asset group's members must be assets the writer can see.

    Every change is recorded in the audit trail in its own transaction, with the BU and the
    change note (AC-21); a change that cannot be recorded is not made (503).
servers:
  - url: /
security:
  - internalJWT: []
    dbContext: []
tags:
  - { name: scenarios, description: "Loss scenarios (F-003 R-01, R-02, R-05)" }
  - { name: library, description: "Assets, asset groups, threat communities and loss profiles (F-003 R-03)" }
  - { name: controls, description: "Controls and their effects (F-003 R-04)" }
  - { name: settings, description: Installation settings of the risk service }
components:
  securitySchemes:
    internalJWT: { type: http, scheme: bearer, bearerFormat: JWT }
    dbContext: { type: apiKey, in: header, name: X-Fair-DB-Context }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: An error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Invalid:
      description: The document is invalid; every problem is listed
      content: { application/json: { schema: { $ref: "#/components/schemas/Invalid" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
    Invalid:
      type: object
      required: [error, problems]
      properties:
        error: { const: invalid_document }
        problems:
          type: array
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer: { type: string, description: "RFC 6901 JSON pointer into the document (empty: the whole document)" }
              message: { type: string }
    Document:
      type: object
      description: "A document: a scenario (JSON Schema urn:fair:risk:scenario:1), a library entry or a control (urn:fair:risk:library:1#/$defs/<kind>); internal/risk/model/schema"
    Head:
      type: object
      required: [id, bu_id, kind, current_version, created_at, created_by, inherited]
      properties:
        id: { type: string, format: uuid }
        bu_id: { type: string, format: uuid }
        kind: { enum: [scenario, asset, asset_group, threat_community, loss_profile, control] }
        name: { type: [string, "null"] }
        owner: { type: [string, "null"], format: uuid, description: Scenarios only }
        asset_id: { type: [string, "null"], format: uuid, description: Scenarios only }
        threat_community_id: { type: [string, "null"], format: uuid, description: Scenarios only }
        current_version: { type: integer }
        archived_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        inherited: { type: boolean, description: "Owned by a BU above the caller's, read by inheritance; not editable by the caller" }
    Version:
      type: object
      required: [version, digest, author, created_at, change_note]
      properties:
        version: { type: integer }
        digest: { type: string, description: SHA-256 of the canonical document, hex }
        author: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        change_note: { type: string }
        document: { $ref: "#/components/schemas/Document" }
    Pin:
      type: object
      required: [pointer, kind, id, version, digest]
      description: A library entry or control version the scenario version uses (AC-09)
      properties:
        pointer: { type: string }
        kind: { enum: [asset, asset_group, threat_community, control] }
        id: { type: string, format: uuid }
        version: { type: integer }
        digest: { type: string }
        current_version: { type: [integer, "null"], description: "The pinned entry's current version as the caller sees it; null when the caller cannot see it" }
        newer: { type: boolean, description: A later version exists (adopt it with /adopt; AC-10) }
        member_of: { type: string, description: "A member of a pinned asset group, copied with the group: not a pin of the document (adopt moves the group)" }
        reachable: { type: boolean, description: "Scenarios: whether the scenario's BU reads the pinned entry's BU (itself or by inheritance); false after a move away from it (AC-20). The scenario keeps its copy." }
    Node:
      type: object
      required: [factor, status]
      description: One factor of the FAIR taxonomy as the scenario estimates it (AC-28)
      properties:
        factor: { type: string }
        parent: { type: string }
        status: { enum: [entered, derived, library, not_used] }
        pointer: { type: string }
    Diff:
      type: object
      required: [id, from, to, changes, pins]
      description: The structural difference between two versions (AC-17); estimates are compared and shown whole
      properties:
        id: { type: string, format: uuid }
        from: { type: integer }
        to: { type: integer }
        changes:
          type: array
          items:
            type: object
            required: [pointer, op]
            properties:
              pointer: { type: string }
              op: { enum: [added, removed, changed] }
              from: {}
              to: {}
        pins:
          type: array
          items:
            type: object
            required: [pointer, kind]
            properties:
              pointer: { type: string }
              kind: { type: string }
              from_id: { type: string, format: uuid }
              from_version: { type: integer }
              to_id: { type: string, format: uuid }
              to_version: { type: integer }
    Transfer:
      type: object
      description: A fair.risk.v1 file (docs/formats/fair-risk-v1.md; JSON Schema docs/formats/fair-risk-v1.schema.json)
      required: [format, currency, exported_at, scenarios, library, controls, pinned]
      properties:
        format: { const: fair.risk.v1 }
        currency: { type: [string, "null"] }
        exported_at: { type: string, format: date-time }
        scenarios: { type: array, items: { type: object } }
        library: { type: array, items: { type: object } }
        controls: { type: array, items: { type: object } }
        pinned: { type: array, items: { type: object } }
    ImportResult:
      type: object
      properties:
        dry_run: { type: boolean }
        created:
          type: array
          items:
            type: object
            required: [section, kind, source_id, id, versions]
            properties:
              section: { enum: [scenarios, library, controls, pinned] }
              kind: { type: string }
              source_id: { type: string, format: uuid }
              source_version: { type: integer }
              id: { type: string, format: uuid }
              versions: { type: integer }
              reused: { type: boolean }
        problems:
          type: array
          items:
            type: object
            required: [item, pointer, message]
            properties:
              item: { type: string, description: "section/id[/vN]" }
              pointer: { type: string }
              message: { type: string }
    Saved:
      type: object
      required: [id, version, digest]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        digest: { type: string }
paths:
  /api/v1/scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: The scenarios the caller can see, newest first
      x-permission: scenario.view
      parameters:
        - { name: bu, in: query, schema: { type: string, format: uuid } }
        - { name: owner, in: query, schema: { type: string, format: uuid } }
        - { name: asset, in: query, schema: { type: string, format: uuid } }
        - { name: threat_community, in: query, schema: { type: string, format: uuid } }
        - { name: archived, in: query, schema: { enum: ["false", "true", all], default: "false" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: The next_cursor of the previous page }
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema:
                type: object
                required: [scenarios]
                properties:
                  scenarios: { type: array, items: { $ref: "#/components/schemas/Head" } }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Create a scenario with its first version
      x-permission: scenario.edit
      x-audit-events: [scenario.created]
      x-reason-field: change_note
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bu_id, document, change_note]
              additionalProperties: false
              properties:
                bu_id: { type: string, format: uuid }
                document: { $ref: "#/components/schemas/Document" }
                change_note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Saved" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/scenarios/{id}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: A scenario's current version
      x-permission: scenario.view
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The scenario
          content:
            application/json:
              schema:
                type: object
                required: [scenario, version, currency, pins, taxonomy]
                properties:
                  scenario: { $ref: "#/components/schemas/Head" }
                  version: { $ref: "#/components/schemas/Version" }
                  pins: { type: array, items: { $ref: "#/components/schemas/Pin" } }
                  taxonomy: { type: array, items: { $ref: "#/components/schemas/Node" } }
                  currency: { type: [string, "null"], description: The installation currency of every amount (AC-07) }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: saveScenario
      tags: [scenarios]
      summary: Save a new version of a scenario (AC-15)
      x-permission: scenario.edit
      x-audit-events: [scenario.version_saved]
      x-reason-field: change_note
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document, expected_version, change_note]
              additionalProperties: false
              properties:
                document: { $ref: "#/components/schemas/Document" }
                expected_version: { type: integer, minimum: 1, description: The version the change was made from }
                change_note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Saved" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/scenarios/{id}/versions:
    get:
      operationId: listScenarioVersions
      tags: [scenarios]
      summary: A scenario's versions, newest first (without documents)
      x-permission: scenario.view
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Versions
          content: { application/json: { schema: { type: object, required: [versions], properties: { versions: { type: array, items: { $ref: "#/components/schemas/Version" } } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/scenarios/{id}/versions/{version}:
    get:
      operationId: getScenarioVersion
      tags: [scenarios]
      summary: One version of a scenario, with its document
      x-permission: scenario.view
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                type: object
                required: [id, version, pins]
                properties:
                  id: { type: string, format: uuid }
                  version: { $ref: "#/components/schemas/Version" }
                  pins: { type: array, items: { $ref: "#/components/schemas/Pin" } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/scenarios/{id}/versions/{version}/bundle:
    get:
      operationId: getScenarioBundle
      tags: [scenarios]
      summary: A scenario version's simulation input bundle (AC-16)
      description: >-
        The scenario version with every library and control version it pins (asset group members
        included, marked member_of), and the installation currency, in canonical form (format
        fair.scenario-input.v1). digest is the SHA-256 of the canonical form of bundle; it changes
        whenever any input does. Built from the scenario's own pin rows: a reader of the scenario
        gets exactly what it uses, without library.view (AC-20).
      x-permission: scenario.view
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The bundle
          content:
            application/json:
              schema:
                type: object
                required: [digest, bundle]
                properties:
                  digest: { type: string, description: "SHA-256, hex, of the canonical form of bundle" }
                  bundle:
                    type: object
                    required: [format, currency, scenario, pins]
                    properties:
                      format: { const: fair.scenario-input.v1 }
                      currency: { type: [string, "null"] }
                      scenario: { type: object, required: [id, version, digest, document] }
                      pins: { type: array, items: { type: object, required: [pointer, kind, id, version, digest, document] } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/scenarios/{id}/move:
    post:
      operationId: moveScenario
      tags: [scenarios]
      summary: Move a scenario with its versions to another BU (AC-19)
      description: >-
        Needs scenario.edit at the scenario's BU and at the destination. A scenario inside a restricted
        BU never leaves its subtree (409 restricted_move). Documents and digests do not change; pins the
        new BU does not read are flagged reachable false (AC-20).
      x-permission: scenario.edit
      x-audit-events: [scenario.moved]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_bu_id, reason]
              additionalProperties: false
              properties:
                to_bu_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Moved
          content: { application/json: { schema: { type: object, required: [id, bu_id, from_bu_id], properties: { id: { type: string, format: uuid }, bu_id: { type: string, format: uuid }, from_bu_id: { type: string, format: uuid } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/scenarios/{id}/archive:
    post:
      operationId: archiveScenario
      tags: [scenarios]
      summary: "Archive a scenario with its versions: read-only, out of active lists (AC-22)"
      x-permission: scenario.edit
      x-audit-events: [scenario.archived]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Done
          content: { application/json: { schema: { type: object, required: [id, archived], properties: { id: { type: string, format: uuid }, archived: { type: boolean } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/scenarios/{id}/restore:
    post:
      operationId: restoreScenario
      tags: [scenarios]
      summary: Restore an archived scenario (AC-22)
      x-permission: scenario.edit
      x-audit-events: [scenario.restored]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Done
          content: { application/json: { schema: { type: object, required: [id, archived], properties: { id: { type: string, format: uuid }, archived: { type: boolean } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/scenarios/{id}/diff:
    get:
      operationId: diffScenario
      tags: [scenarios]
      summary: What changed between two versions of a scenario (AC-17)
      x-permission: scenario.view
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: from, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: to, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: The difference, content: { application/json: { schema: { $ref: "#/components/schemas/Diff" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/scenarios/{id}/adopt:
    post:
      operationId: adoptScenarioPins
      tags: [scenarios]
      summary: Save a new version moving pins to their entries' current versions (AC-09, AC-10)
      description: The pins named, or every pin with a newer version; nothing else changes. Recorded as scenario.version_saved with the adopted pointers.
      x-permission: scenario.edit
      x-audit-events: [scenario.version_saved]
      x-reason-field: change_note
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, change_note]
              additionalProperties: false
              properties:
                expected_version: { type: integer, minimum: 1, description: The version the adoption was reviewed against }
                pins: { type: array, items: { type: string }, description: The pins' pointers; none means every pin with a newer version }
                change_note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Saved" }
                  - { type: object, required: [adopted], properties: { adopted: { type: array, items: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/library:
    get:
      operationId: listLibrary
      tags: [library]
      summary: The library entrys the caller can see, newest first
      x-permission: library.view
      parameters:
        - { name: bu, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { enum: [asset, asset_group, threat_community, loss_profile] } }
        - { name: archived, in: query, schema: { enum: ["false", "true", all], default: "false" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: The next_cursor of the previous page }
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/Head" } }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createLibraryEntry
      tags: [library]
      summary: Create a library entry with its first version
      x-permission: library.edit
      x-audit-events: [library.created]
      x-reason-field: change_note
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bu_id, kind, document, change_note]
              additionalProperties: false
              properties:
                bu_id: { type: string, format: uuid }
                kind: { enum: [asset, asset_group, threat_community, loss_profile] }
                document: { $ref: "#/components/schemas/Document" }
                change_note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Saved" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/library/starter:
    get:
      operationId: listStarterEntries
      tags: [library]
      summary: The release's starter library (AC-11)
      description: >-
        Generic threat communities and guidance for each Open FAIR form of loss, written from Open
        FAIR concepts. Every number in it is illustrative (illustrative is true and each estimate's
        rationale says so): a starting point to replace, never industry data. Starter entries are
        not edited; copy one into a BU to adapt it.
      x-permission: library.view
      responses:
        "200":
          description: Starter entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [key, release, kind, name, illustrative, guidance, digest, document]
                      properties:
