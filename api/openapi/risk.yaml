      operationId: getControl
      tags: [controls]
      summary: A control's current version
      x-permission: control.view
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The control
          content:
            application/json:
              schema:
                type: object
                required: [control, version, currency]
                properties:
                  control: { $ref: "#/components/schemas/Head" }
                  version: { $ref: "#/components/schemas/Version" }
                  currency: { type: [string, "null"], description: The installation currency of every amount (AC-07) }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: saveControl
      tags: [controls]
      summary: Save a new version of a control (AC-15)
      x-permission: control.edit
      x-audit-events: [control.version_saved]
      x-reason-field: change_note
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document, expected_version, change_note]
              additionalProperties: false
              properties:
                document: { $ref: "#/components/schemas/Document" }
                expected_version: { type: integer, minimum: 1, description: The version the change was made from }
                change_note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Saved" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/controls/{id}/versions:
    get:
      operationId: listControlVersions
      tags: [controls]
      summary: A control's versions, newest first (without documents)
      x-permission: control.view
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Versions
          content: { application/json: { schema: { type: object, required: [versions], properties: { versions: { type: array, items: { $ref: "#/components/schemas/Version" } } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/controls/{id}/versions/{version}:
    get:
      operationId: getControlVersion
      tags: [controls]
      summary: One version of a control, with its document
      x-permission: control.view
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                type: object
                required: [id, version]
                properties:
