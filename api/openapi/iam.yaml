      requestBody:
        required: true
        content:
          application/samlmetadata+xml: { schema: { type: string } }
          application/xml: { schema: { type: string } }
          application/json: { schema: { type: object } }
      responses:
        "204": { description: Applied }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The trust anchors change and were not confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pinning" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /idps/{id}/metadata/fetch:
    parameters:
      - $ref: "#/components/parameters/IdpID"
    post:
      x-audit-events: [idp.metadata_changed]
      summary: Fetch metadata from a URL (SAML metadata URL or OIDC issuer)
      x-permission: idp.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, reason]
              additionalProperties: false
              properties:
                url: { type: string, format: uri }
                confirm: { $ref: "#/components/schemas/Fingerprints" }
                reason: { type: string }
      responses:
        "204": { description: Applied }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Air-gapped install (`air_gapped`), or unconfirmed trust anchors (`confirm_fingerprints`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/Pinning"
        "422": { $ref: "#/components/responses/Error" }
  /idps/{id}/scim-tokens:
    parameters:
      - $ref: "#/components/parameters/IdpID"
    get:
      summary: The IdP's SCIM tokens (never the secrets)
      x-permission: scim.manage
      responses:
        "200":
          description: Tokens, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        prefix: { type: string, description: The token's first 12 characters, to recognise it }
                        created_at: { type: string, format: date-time }
                        created_by: { type: [string, "null"], format: uuid }
                        expires_at: { type: string, format: date-time }
                        last_used_at: { type: [string, "null"], format: date-time }
                        revoked_at: { type: [string, "null"], format: date-time }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      x-audit-events: [token.created]
      summary: Issue a SCIM bearer token for the IdP (T-21, AC-08)
      description: |
        The token (`fscim_...`, 256 random bits) is returned once and only its SHA-256 is
        kept. It is valid only at `/scim/v2` and only for this IdP's users and groups. It
        expires after `expires_in_days` (default 90, at most 365); rotate by issuing another
        and revoking the old one. A replay of this request (same Idempotency-Key) answers 409
        `secret_not_replayed` and never returns the token again.
      x-permission: scim.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, reason]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 200 }
                expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 90 }
                reason: { type: string }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  token: { type: string }
                  prefix: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /idps/{id}/scim-tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/IdpID"
      - { name: token, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      x-audit-events: [token.revoked]
      summary: Revoke a SCIM token
      x-permission: scim.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: reason, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /users:
    get:
      summary: Users the caller may see (T-23b)
      description: |
        With `user.view` at the root, every user; with `user.view` at a BU, the users holding an
        assignment in that BU's subtree (directly or through a group; restricted BUs as usual).
        Assignments shown are those the caller may see. Without `user.view` anywhere, 404.
      x-permission: user.view
      parameters:
        - { name: status, in: query, schema: { enum: [active, disabled, locked] } }
