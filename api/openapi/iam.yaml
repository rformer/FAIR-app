openapi: 3.1.0
info:
  title: FAIR IAM API
  version: "1"
  description: |
    F-001 design §6. Requests reach the iam service through the gateway, which
    authenticates the session and forwards an internal JWT (ES256, audience `iam`, at
    most 5 minutes) and the DB context token it was minted with (design §4, §5.2). The
    gateway routes each resource's first path segment to the service that owns it
    (`/api/v1/idps` → iam).

    Every IdP route requires `idp.view` at the root BU; without it the answer is 404
    (AC-25). Mutations additionally need `idp.manage`, checked by the database (403
    without it), and an `Idempotency-Key` header: a repeated key with the same request
    returns the stored response; with a different request it is 422. Every change is
    audited at high severity with its `reason`.

    Metadata (T-17, AC-03): SAML metadata XML, an OIDC discovery document or a JWKS file
    is uploaded as the body of `PUT /idps/{id}/metadata`, or fetched with
    `POST /idps/{id}/metadata/fetch` (https only, TLS 1.2+, 1 MiB, no redirects; refused
    in air-gapped installs, which take files only). Documents are validated: signing
    keys are RSA ≥ 2048 or ECDSA, a JWKS holds public keys only, endpoints are https.
    The trust anchors (SAML signing certificates, OIDC issuer and JWKS URI, inline JWKS
    keys) are pinned: once an IdP has anchors, a document that changes them is applied
    only when `confirm` lists exactly the new fingerprints; otherwise the answer is 409
    `confirm_fingerprints` with the current and proposed sets. There is no background
    refresh: rotation is an administrator's confirmed change.

    SCIM 2.0 (T-21) is served at `/scim/v2` as RFC 7644 defines it (its discovery endpoints
    describe it); its bearer tokens are issued here (`/idps/{id}/scim-tokens`).

    Home-realm discovery (`POST /auth/discover`, AC-02) needs no session. It answers
    every email with the same shape: the login URL of the enabled IdP serving the
    email's domain, or `null` and a generic message. It is rate-limited per client (429).
servers:
  - url: /api/v1
security:
  - internalJWT: []
    dbContext: []
components:
  securitySchemes:
    internalJWT: { type: http, scheme: bearer, bearerFormat: JWT }
    dbContext: { type: apiKey, in: header, name: X-Fair-DB-Context }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdpID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
    Fingerprints:
      type: array
      description: Sorted trust-anchor fingerprints, `cert:sha256:<hex>`, `jwk:sha256:<RFC 7638 thumbprint>`, `issuer:<url>`, `jwks_uri:<url>`
      items: { type: string }
    IdP:
      type: object
      required: [id, kind, name, email_domains, metadata, enabled, created_at, fingerprints]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [saml, oidc, keycloak] }
        name: { type: string }
        email_domains: { type: array, items: { type: string }, description: Lower-case; a domain is served by at most one enabled IdP }
        metadata: { type: object, description: "scim_subject_attribute (userName or externalId: which SCIM attribute is the login subject). SAML: entity_id, sso_url, certificates, allow_idp_initiated. OIDC: issuer, authorization_endpoint, token_endpoint, jwks_uri or jwks, client_id, client_secret_file, scopes, subject_claim" }
        metadata_source: { enum: [file, url] }
        mfa_evidence_rule: { type: object }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        fingerprints: { $ref: "#/components/schemas/Fingerprints" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        status: { enum: [active, disabled, locked] }
        disabled_reason: { type: [string, "null"], description: "scim, scim_deleted, inactive or admin" }
        source: { enum: [scim, jit, breakglass] }
        idp_id: { type: [string, "null"], format: uuid }
        external_id: { type: [string, "null"], description: The login subject at the IdP }
        user_name: { type: [string, "null"], description: SCIM userName }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        reactivated_at: { type: [string, "null"], format: date-time }
        live_sessions: { type: integer }
        groups: { type: array, items: { type: object, properties: { id: { type: string }, display_name: { type: string } } } }
        assignments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              role: { type: string }
              bu: { type: string }
              bu_id: { type: string }
              via_group: { type: [string, "null"] }
              expires_at: { type: [string, "null"], format: date-time }
    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        external_id: { type: [string, "null"] }
        idp_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        members: { type: integer }
        assignments: { type: array, items: { type: object } }
    Pinning:
      type: object
      required: [error, current, fingerprints]
      properties:
        error: { const: confirm_fingerprints }
        detail: { type: string }
        current: { $ref: "#/components/schemas/Fingerprints" }
        fingerprints: { $ref: "#/components/schemas/Fingerprints" }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /idps:
    get:
      summary: List identity providers
      x-permission: idp.view
      responses:
        "200":
          description: The IdPs
          content:
            application/json:
              schema:
                type: object
                required: [idps]
                properties:
                  idps: { type: array, items: { $ref: "#/components/schemas/IdP" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Create an identity provider (disabled until it has metadata)
      x-permission: idp.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, reason]
              additionalProperties: false
              properties:
                kind: { enum: [saml, oidc, keycloak] }
                name: { type: string }
                email_domains: { type: array, items: { type: string } }
                reason: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  enabled: { const: false }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /idps/{id}:
    parameters:
      - $ref: "#/components/parameters/IdpID"
    get:
      summary: Read an identity provider
      x-permission: idp.view
      responses:
        "200":
          description: The IdP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdP" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Change name, email domains, settings or enabled
      description: |
        `settings` sets configuration fields (null removes one): `allow_idp_initiated` for
        SAML; `client_id`, `client_secret_file`, `scopes`, `subject_claim` for OIDC. An IdP
        is enabled only with complete metadata. Enabling, or changing domains, is refused
        with 409 when a domain is already served by another enabled IdP.
      x-permission: idp.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                name: { type: string }
                email_domains: { type: array, items: { type: string } }
                enabled: { type: boolean }
                settings: { type: object }
                mfa_evidence_rule:
                  description: |
                    The IdP's MFA evidence rule (T-18, AC-05); null or {} restores the standards
                    defaults. Any one satisfied condition is MFA. SAML: `authn_contexts` (class
                    refs), `attribute` ({name, values}). OIDC: `amr`, `amr_two_categories`
                    (factors of two RFC 8176 categories), `acr`.
                  type: [object, "null"]
                  additionalProperties: false
                  properties:
                    authn_contexts: { type: array, items: { type: string } }
                    attribute:
                      type: object
                      required: [name, values]
                      properties:
                        name: { type: string }
                        values: { type: array, items: { type: string } }
                    amr: { type: array, items: { type: string } }
                    amr_two_categories: { type: boolean }
                    acr: { type: array, items: { type: string } }
                reason: { type: string }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /idps/{id}/metadata:
    parameters:
      - $ref: "#/components/parameters/IdpID"
    put:
      summary: Upload SAML metadata, an OIDC discovery document or a JWKS file
      x-permission: idp.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: reason, in: query, required: true, schema: { type: string } }
        - { name: confirm, in: query, description: Comma-separated new fingerprints, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/samlmetadata+xml: { schema: { type: string } }
          application/xml: { schema: { type: string } }
          application/json: { schema: { type: object } }
      responses:
        "204": { description: Applied }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The trust anchors change and were not confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pinning" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /idps/{id}/metadata/fetch:
    parameters:
      - $ref: "#/components/parameters/IdpID"
    post:
      summary: Fetch metadata from a URL (SAML metadata URL or OIDC issuer)
      x-permission: idp.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, reason]
              additionalProperties: false
              properties:
                url: { type: string, format: uri }
                confirm: { $ref: "#/components/schemas/Fingerprints" }
                reason: { type: string }
      responses:
        "204": { description: Applied }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Air-gapped install (`air_gapped`), or unconfirmed trust anchors (`confirm_fingerprints`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/Pinning"
        "422": { $ref: "#/components/responses/Error" }
  /idps/{id}/scim-tokens:
    parameters:
      - $ref: "#/components/parameters/IdpID"
    get:
      summary: The IdP's SCIM tokens (never the secrets)
      x-permission: scim.manage
      responses:
        "200":
          description: Tokens, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        prefix: { type: string, description: The token's first 12 characters, to recognise it }
                        created_at: { type: string, format: date-time }
                        created_by: { type: [string, "null"], format: uuid }
                        expires_at: { type: string, format: date-time }
                        last_used_at: { type: [string, "null"], format: date-time }
                        revoked_at: { type: [string, "null"], format: date-time }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Issue a SCIM bearer token for the IdP (T-21, AC-08)
      description: |
        The token (`fscim_...`, 256 random bits) is returned once and only its SHA-256 is
        kept. It is valid only at `/scim/v2` and only for this IdP's users and groups. It
        expires after `expires_in_days` (default 90, at most 365); rotate by issuing another
        and revoking the old one. A replay of this request (same Idempotency-Key) answers 409
        `secret_not_replayed` and never returns the token again.
      x-permission: scim.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, reason]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 200 }
                expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 90 }
                reason: { type: string }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  token: { type: string }
                  prefix: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /idps/{id}/scim-tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/IdpID"
      - { name: token, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Revoke a SCIM token
      x-permission: scim.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: reason, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /users:
    get:
      summary: Users the caller may see (T-23b)
      description: |
        With `user.view` at the root, every user; with `user.view` at a BU, the users holding an
        assignment in that BU's subtree (directly or through a group; restricted BUs as usual).
        Assignments shown are those the caller may see. Without `user.view` anywhere, 404.
      x-permission: user.view
      parameters:
        - { name: status, in: query, schema: { enum: [active, disabled, locked] } }
        - { name: source, in: query, schema: { enum: [scim, jit, breakglass] } }
        - { name: idp, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: Email or display-name prefix, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: A user the caller may see
      x-permission: user.view
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
  /users/{id}/{action}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { enum: [disable, enable, unlock] } }
    post:
      summary: Disable, re-enable or unlock a user (T-23b)
      description: |
        `disable` ends the user's sessions at once. `enable` re-enables a user disabled for inactivity
        or by an administrator and counts as activity for the inactivity sweep; it refuses a user
        disabled by SCIM (re-enable it at the IdP) and a locked user (`unlock`). Never on one's own
        account; never the last active root administrator (409). Audited at high severity.
      x-permission: user.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: The new status
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string }, status: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /groups:
    get:
      summary: Groups the caller may see (read-only; SCIM manages them)
      x-permission: user.view
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/Group" } }
        "404": { $ref: "#/components/responses/Error" }
  /groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: A group the caller may see
      x-permission: user.view
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/Error" }
  /banner:
    get:
      summary: The system-use banner in force (T-19, AC-34)
      x-permission: none (any session)
      responses:
        "200":
          description: The banner
          content:
            application/json:
              schema:
                type: object
                required: [version, text, updated_at]
                properties:
                  version: { type: integer }
                  text: { type: string }
                  updated_at: { type: string, format: date-time }
    put:
      summary: Change the banner text (a new version; sessions acknowledge at their next sign-in)
      x-permission: banner.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, reason]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 1, maxLength: 10000 }
                reason: { type: string }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { type: object, properties: { version: { type: integer } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/discover:
    post:
      summary: Home-realm discovery
      security: []
      x-unauthenticated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                return: { type: string, description: A local path to land on after sign-in }
      responses:
        "200":
          description: The same shape for every email
          content:
            application/json:
              schema:
                type: object
                required: [login_url, message]
                properties:
                  login_url: { type: [string, "null"] }
                  message: { type: string }
        "429": { $ref: "#/components/responses/Error" }
