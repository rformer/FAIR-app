openapi: 3.1.0
info:
  title: FAIR IAM API
  version: "1"
  description: |
    F-001 design §6. Requests reach the iam service through the gateway, which
    authenticates the session and forwards an internal JWT (ES256, audience `iam`, at
    most 5 minutes) and the DB context token it was minted with (design §4, §5.2). The
    gateway routes each resource's first path segment to the service that owns it
    (`/api/v1/idps` → iam).

    Every IdP route requires `idp.view` at the root BU; without it the answer is 404
    (AC-25). Mutations additionally need `idp.manage`, checked by the database (403
    without it), and an `Idempotency-Key` header: a repeated key with the same request
    returns the stored response; with a different request it is 422. Every change is
    audited at high severity with its `reason`.

    Metadata (T-17, AC-03): SAML metadata XML, an OIDC discovery document or a JWKS file
    is uploaded as the body of `PUT /idps/{id}/metadata`, or fetched with
    `POST /idps/{id}/metadata/fetch` (https only, TLS 1.2+, 1 MiB, no redirects; refused
    in air-gapped installs, which take files only). Documents are validated: signing
    keys are RSA ≥ 2048 or ECDSA, a JWKS holds public keys only, endpoints are https.
    The trust anchors (SAML signing certificates, OIDC issuer and JWKS URI, inline JWKS
    keys) are pinned: once an IdP has anchors, a document that changes them is applied
    only when `confirm` lists exactly the new fingerprints; otherwise the answer is 409
    `confirm_fingerprints` with the current and proposed sets. There is no background
    refresh: rotation is an administrator's confirmed change.

    SCIM 2.0 (T-21) is served at `/scim/v2` as RFC 7644 defines it (its discovery endpoints
    describe it); its bearer tokens are issued here (`/idps/{id}/scim-tokens`).

    Home-realm discovery (`POST /auth/discover`, AC-02) needs no session. It answers
    every email with the same shape: the login URL of the enabled IdP serving the
    email's domain, or `null` and a generic message. It is rate-limited per client (429).
servers:
  - url: /api/v1
security:
  - internalJWT: []
    dbContext: []
components:
  securitySchemes:
    internalJWT: { type: http, scheme: bearer, bearerFormat: JWT }
    dbContext: { type: apiKey, in: header, name: X-Fair-DB-Context }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdpID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
    Fingerprints:
      type: array
      description: Sorted trust-anchor fingerprints, `cert:sha256:<hex>`, `jwk:sha256:<RFC 7638 thumbprint>`, `issuer:<url>`, `jwks_uri:<url>`
      items: { type: string }
    IdP:
      type: object
      required: [id, kind, name, email_domains, metadata, enabled, created_at, fingerprints]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [saml, oidc, keycloak] }
        name: { type: string }
        email_domains: { type: array, items: { type: string }, description: Lower-case; a domain is served by at most one enabled IdP }
        metadata: { type: object, description: "scim_subject_attribute (userName or externalId: which SCIM attribute is the login subject). SAML: entity_id, sso_url, certificates, allow_idp_initiated. OIDC: issuer, authorization_endpoint, token_endpoint, jwks_uri or jwks, client_id, client_secret_file, scopes, subject_claim" }
        metadata_source: { enum: [file, url] }
        mfa_evidence_rule: { type: object }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        fingerprints: { $ref: "#/components/schemas/Fingerprints" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        status: { enum: [active, disabled, locked] }
        disabled_reason: { type: [string, "null"], description: "scim, scim_deleted, inactive or admin" }
        source: { enum: [scim, jit, breakglass] }
        idp_id: { type: [string, "null"], format: uuid }
        external_id: { type: [string, "null"], description: The login subject at the IdP }
        user_name: { type: [string, "null"], description: SCIM userName }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        reactivated_at: { type: [string, "null"], format: date-time }
        live_sessions: { type: integer }
        groups: { type: array, items: { type: object, properties: { id: { type: string }, display_name: { type: string } } } }
        assignments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              role: { type: string }
              bu: { type: string }
              bu_id: { type: string }
              via_group: { type: [string, "null"] }
              expires_at: { type: [string, "null"], format: date-time }
    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        external_id: { type: [string, "null"] }
        idp_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        members: { type: integer }
        assignments: { type: array, items: { type: object } }
    GroupMapping:
      type: object
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        group_name: { type: string }
        role_id: { type: string, format: uuid }
        role_name: { type: string }
        bu_id: { type: string, format: uuid }
        bu_code: { type: string }
        reason: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        assigned: { type: integer, description: Members holding the mapped assignment }
        skipped:
          type: array
          items: { type: object, properties: { user_id: { type: string }, reason: { type: string }, at: { type: string, format: date-time } } }
    SoDRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        permission_a: { type: string }
        permission_b: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        builtin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Approval:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        target_ref: { type: string }
        reason: { type: string }
        payload: { type: object }
        bu_id: { type: string }
        requested_by: { type: string, format: uuid }
        status: { enum: [pending, approved, rejected, expired] }
        decided_by: { type: string }
        decision_reason: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        consumed_at: { type: [string, "null"], format: date-time }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        builtin: { type: boolean }
        status: { enum: [active, suspended, retired] }
        current_version: { type: integer }
        permissions: { type: array, items: { type: string } }
        privileged: { type: array, items: { type: string }, description: The role's privileged permissions (AC-54) }
        created_at: { type: string, format: date-time }
        assignments: { type: integer }
        users: { type: integer }
        group_mappings: { type: integer }
    ServiceAccount:
      type: object
      description: A service account (F-001 T-33, AC-36); its scopes are live, non-privileged permissions at its BU
      properties:
        id: { type: string, format: uuid, description: Also the OAuth client_id }
        name: { type: string }
        bu_id: { type: string, format: uuid }
        bu_code: { type: string }
        auth_method: { type: string, enum: [client_credentials, mtls] }
        status: { type: string, enum: [active, disabled, locked] }
        disabled_reason: { type: [string, "null"] }
        scopes: { type: array, items: { type: string } }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time, description: When it last obtained an access token }
        live_secrets: { type: integer }
        live_certificates: { type: integer }
    ScopesPending:
      type: object
      description: Scopes the caller does not hold at the BU wait for a service_account.scopes approval (T-26)
      properties:
        approval_id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
        unheld_scopes: { type: array, items: { type: string } }
    BU:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        code: { type: string }
        name: { type: string }
        depth: { type: integer }
        restricted: { type: boolean }
        rollup_mode: { enum: [excluded, aggregate, full] }
        archived_at: { type: [string, "null"], format: date-time }
        manageable: { type: boolean, description: The caller holds bu.restrict at the parent }
    BUDocument:
      type: object
      required: [format, bus]
      properties:
        format: { const: fair.bus.v1 }
        bus:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              parent_code: { type: [string, "null"] }
              name: { type: string }
              restricted: { type: boolean }
              rollup_mode: { enum: [excluded, aggregate, full] }
    Pinning:
      type: object
      required: [error, current, fingerprints]
      properties:
        error: { const: confirm_fingerprints }
        detail: { type: string }
        current: { $ref: "#/components/schemas/Fingerprints" }
        fingerprints: { $ref: "#/components/schemas/Fingerprints" }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /access-reviews:
    get:
      summary: Access review campaigns the caller manages or reviews in (T-39, AC-49)
      x-permission: access_review.manage or access_review.decide
      responses:
        "200": { description: "{campaigns: [{id, name, bu_id, bu_code, role_ids, reviewers, due_at, on_expiry, reason, state, created_by, created_at, closed_at, closed_by, manages, items, decided, revoked, open_for_me}]}" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Open a campaign over a BU subtree
      description: |
        Snapshots the live access in the BU's subtree (optionally only `role_ids`): one item per
        user assignment, group assignment, group mapping and service account, and the break-glass
        accounts. `reviewers` optionally names who may decide (each must hold
        access_review.decide at the BU). `due_at` is an hour to a year away; `on_expiry` (keep, the
        default, or revoke) says what happens to undecided items then. Audited high.
      x-permission: access_review.manage (at the BU)
      x-audit-events: [access_review.campaign_opened]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, bu_id, due_at, reason]
              additionalProperties: false
              properties:
                name: { type: string }
                bu_id: { type: string, format: uuid }
                role_ids: { type: array, items: { type: string, format: uuid } }
                reviewers: { type: array, items: { type: string, format: uuid } }
                due_at: { type: string, format: date-time }
                on_expiry: { type: string, enum: [keep, revoke] }
                reason: { type: string }
      responses:
        "201": { description: "The campaign and its items" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /access-reviews/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: A campaign and the items the caller may see
      description: All items for its managers; otherwise the items at BUs where the caller holds access_review.decide, each with `can_decide`.
      x-permission: access_review.manage (at the BU) or access_review.decide
      responses:
        "200": { description: "{campaign, items: [{id, kind, assignment_id, mapping_id, role_id, bu_id, snapshot, decision, decided_by, decided_at, comment, outcome, can_decide}]}" }
        "404": { $ref: "#/components/responses/Error" }
  /access-reviews/{id}/close:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Close a campaign now; undecided items follow its policy (keep or revoke)
      x-permission: access_review.manage (at the BU)
      x-audit-events: [access_review.campaign_closed, access_review.decided, group_mapping.removed, session.revoked]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        "200": { description: "The closed campaign and its items" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /access-reviews/{id}/items/{item}/decision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: item, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Certify or revoke an item (AC-49)
      description: |
        Needs access_review.decide at the item's BU (and to be a named reviewer when the campaign
        names them); never for one's own access or access one granted. A revocation needs a
        comment and applies at once: the assignment ends (a group's for every member), the
        mapping is removed (fix the IdP group too), or the service account is disabled; the
        scope worker removes the access within 60 seconds. Break-glass accounts are certified
        only. Audited (high for a revocation).
      x-permission: access_review.decide (at the item's BU)
      x-audit-events: [access_review.decided, group_mapping.removed, session.revoked]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [certify, revoke] }
                comment: { type: string }
      responses:
        "200": { description: "{item, decision, outcome: kept, revoked, mapping_removed, account_disabled or already_ended}" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /entitlements/report:
    get:
      summary: The entitlement report (T-38, AC-48, AC-64)
      description: |
        One row per user and live assignment (a group's assignment once per member): the user
        (kind user, service_account or breakglass; status; last sign-in), the role (built-in or
        custom) and its permissions, the BU and whether it is restricted, how it was granted
        (manual, group, mapped, service_account, breakglass), by whom and when, and the expiry.
        Rows cover the BUs where the caller holds entitlement.view, restricted subtrees only by
        an explicit assignment there (AC-64). The answer also lists the restricted BUs the caller
        may see and everyone with access to them, with a count of those not shown.
        `format=csv` or `pdf` (the PDF has both sections; tagged for assistive technology) also
        needs entitlement.export at the BUs exported, and is audited (`entitlement.exported`).
      x-permission: entitlement.view (entitlement.export for csv and pdf)
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv, pdf] } }
        - { name: user, in: query, schema: { type: string, format: uuid } }
        - { name: role, in: query, schema: { type: string, format: uuid } }
        - { name: bu, in: query, description: The BU and its subtree, schema: { type: string, format: uuid } }
        - { name: source, in: query, schema: { type: string, enum: [manual, group, mapped, service_account, breakglass] } }
        - { name: restricted_only, in: query, schema: { type: boolean } }
        - { name: expiring_before, in: query, schema: { type: string, format: date-time } }
        - { name: include_inactive, in: query, schema: { type: boolean } }
      responses:
        "200": { description: "JSON {as_of, filters, entitlements, restricted_bus, restricted_bus_not_shown}; or a CSV or PDF attachment" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: A file without entitlement.export }
        "404": { $ref: "#/components/responses/Error" }
  /entitlements/restricted:
    get:
      summary: The restricted-BU access listing (AC-64)
      description: |
        Every restricted BU the caller may see (an explicit entitlement.view there, or bu.restrict
        at its parent) and everyone with access to it, from the materialized scopes: write, read
        or aggregate-only roll-up, with the resource types. `not_shown` counts the restricted BUs
        the caller may not see. `format=csv` or `pdf` as for the report.
      x-permission: entitlement.view (entitlement.export for csv and pdf)
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv, pdf] } }
      responses:
        "200": { description: "JSON {as_of, restricted_bus, not_shown}; or a CSV or PDF attachment" }
        "403": { description: A file without entitlement.export }
        "404": { $ref: "#/components/responses/Error" }
  /breakglass:
    get:
      summary: Break-glass status and accounts (T-34)
      x-permission: breakglass.manage (at the root)
      responses:
        "200": { description: "{enabled, accounts: [{id, email, name, status, disabled_reason, last_login_at, credentials, enrollment_expires_at}], pending_approval}" }
        "404": { $ref: "#/components/responses/Error" }
  /breakglass/enable:
    post:
      x-audit-events: [approval.requested]
      summary: Ask to enable break-glass after install (AC-41)
      description: |
        One or two holders (AC-42), each with an email address of its own (not an existing
        account's) and a name, and a reason. Answers 202 with a `breakglass.enable` approval; a
        second holder of breakglass.manage approves it (`/approvals/{id}/decision`), then
        `POST /breakglass/apply` enables it. At install, before anyone has signed in, the
        installer runs `iam breakglass enable` instead (AC-40).
      x-permission: breakglass.manage (at the root)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holders, reason]
              additionalProperties: false
              properties:
                holders:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: { type: object, required: [email, name], properties: { email: { type: string }, name: { type: string } } }
                reason: { type: string }
      responses:
        "202": { description: "Pending approval ({approval_id})" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /breakglass/apply:
    post:
      x-audit-events: [approval.consumed, breakglass.enabled, breakglass.accounts_disabled]
      summary: Enable break-glass once the request is approved
      description: |
        Sets breakglass.enabled, creates or reactivates the holders' accounts (Platform Admin at
        the root, no risk data, AC-44) and answers each holder's one-time enrollment code (24
        hours), shown once: a replay answers 409 `secret_not_replayed`. Audited high
        (`breakglass.enabled`, with the requester and approver).
      x-permission: breakglass.manage (at the root)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_id]
              additionalProperties: false
              properties:
                approval_id: { type: string, format: uuid }
      responses:
        "200": { description: "{enabled, accounts: [{user_id, email, enrollment_code, expires_at}]}" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /breakglass/disable:
    post:
      x-audit-events: [breakglass.disabled, session.revoked]
      summary: Disable break-glass at once (AC-45)
      description: No approval. The setting goes off, the accounts are disabled and their sessions revoked in the same transaction; audited high.
      x-permission: breakglass.manage (at the root)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        "200": { description: "{enabled: false, accounts_disabled}" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /breakglass/accounts/{id}/enrollment:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      x-audit-events: [breakglass.enrollment_reset]
      summary: A new enrollment code for a break-glass account (a lost or replaced key)
      description: The account's registered keys are removed, so the old key no longer signs in. Shown once; audited high.
      x-permission: breakglass.manage (at the root)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        "201": { description: "{user_id, enrollment_code, expires_at}" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/breakglass/enroll/begin:
    post:
      x-audit-events: []
      x-audit-note: starts a WebAuthn ceremony; nothing changes until finish
      summary: Start registering a break-glass security key with an enrollment code (WebAuthn)
      description: |
        No session. 404 while break-glass is off (AC-39). Body `{code}`; answers
        `{ceremony, options}` (PublicKeyCredentialCreationOptions: a discoverable credential,
        user verification required, ES256/ES384/RS256/PS256). Rate-limited per client.
      x-unauthenticated: true
      responses:
        "200": { description: "{ceremony, options}" }
        "401": { description: Invalid or spent code }
        "404": { description: Break-glass is off }
  /auth/breakglass/enroll/finish:
    post:
      x-audit-events: [breakglass.enrolled, authn.login.denied]
      summary: Register the key (spends the code)
      x-unauthenticated: true
      responses:
        "201": { description: Registered (audited high) }
        "400": { description: The registration does not verify }
        "401": { description: Invalid code or ceremony }
        "404": { description: Break-glass is off }
  /auth/breakglass/login/begin:
    post:
      x-audit-events: []
      x-audit-note: starts a WebAuthn ceremony; nothing changes until finish
      summary: Start a break-glass sign-in (discoverable WebAuthn assertion)
      x-unauthenticated: true
      responses:
        "200": { description: "{ceremony, options}" }
        "404": { description: Break-glass is off }
  /auth/breakglass/login/finish:
    post:
      x-audit-events: [breakglass.login, breakglass.login_failed, user.locked, session.revoked, authn.login.denied]
      summary: Finish the sign-in
      description: |
        Body `{ceremony, credential, return}`. On success the gateway answers with the session
        cookie, as for an IdP login; the login is audited high and announced (AC-43). Failures
        of a known account count towards its lockout (AC-47); every failure answers alike.
      x-unauthenticated: true
      responses:
        "200": { description: Signed in (through the gateway) }
        "401": { description: Sign-in failed }
        "404": { description: Break-glass is off }
  /service-accounts:
    get:
      summary: Service accounts at BUs where the caller holds service_account.manage (T-33)
      x-permission: service_account.manage
      responses:
        "200":
          description: Service accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  service_accounts: { type: array, items: { $ref: "#/components/schemas/ServiceAccount" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      x-audit-events: [service_account.created, approval.requested]
      summary: Create a service account (AC-36)
      description: |
        Needs service_account.manage at the BU. Scopes are live, non-privileged catalog
        permissions (no admin rights). If the caller holds every scope at the BU the account is
        created (201, audited high); otherwise the request answers 202 with a
        `service_account.scopes` approval, which another holder of service_account.manage at the
        BU approves (`/approvals/{id}/decision`) before `POST /service-accounts/apply` creates it.
      x-permission: service_account.manage (at the BU)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, bu_id, scopes, auth_method, reason]
              additionalProperties: false
              properties:
                name: { type: string }
                bu_id: { type: string, format: uuid }
                scopes: { type: array, items: { type: string } }
                auth_method: { type: string, enum: [client_credentials, mtls] }
                reason: { type: string }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccount" } } }
        "202":
          description: Pending approval of scopes the caller does not hold
          content: { application/json: { schema: { $ref: "#/components/schemas/ScopesPending" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /service-accounts/apply:
    post:
      x-audit-events: [approval.consumed, service_account.created, service_account.scopes_changed]
      summary: Apply an approved service_account.scopes request (create, or change scopes)
      x-permission: service_account.manage (at the BU)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_id]
              additionalProperties: false
              properties:
                approval_id: { type: string, format: uuid }
      responses:
        "200":
          description: The account as it is now
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccount" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /service-accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: A service account
      x-permission: service_account.manage (at its BU)
      responses:
        "200":
          description: The account
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccount" } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      x-audit-events: [service_account.renamed, service_account.scopes_changed, approval.requested]
      summary: Rename it or change its scopes
      description: |
        A rename, removed scopes and added scopes the caller holds at the BU apply at once (200,
        audited high). Other added scopes answer 202 with an approval, as at creation; the scopes
        stay as they are until it is applied, and applying fails if they changed meanwhile.
      x-permission: service_account.manage (at its BU)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
                reason: { type: string }
      responses:
        "200":
          description: The account as it is now
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccount" } } }
        "202":
          description: Pending approval of scopes the caller does not hold
          content: { application/json: { schema: { $ref: "#/components/schemas/ScopesPending" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /service-accounts/{id}/{action}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
