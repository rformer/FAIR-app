              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/Error" }
  /group-mappings:
    get:
      summary: Group-to-role mappings at BUs where the caller holds access.view (T-24)
      x-permission: access.view
      responses:
        "200":
          description: Live mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  mappings: { type: array, items: { $ref: "#/components/schemas/GroupMapping" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      x-audit-events: [group_mapping.created, assignment.mapped_granted, assignment.mapped_skipped]
      summary: Map a group to a role at a BU (AC-12)
      description: |
        Every active member of the group gets an assignment with source `mapped` and this
        mapping's id (AC-14); joining or leaving the group, deactivation and reactivation keep them
        in line in the same transaction (AC-13). A member for whom the grant would break a rule
