        - { name: q, in: query, description: Email or display-name prefix, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: A user the caller may see
      x-permission: user.view
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
  /users/{id}/{action}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { enum: [disable, enable, unlock] } }
    post:
      x-audit-events: [user.disabled, user.enabled, user.unlocked, session.revoked]
      summary: Disable, re-enable or unlock a user (T-23b)
      description: |
        `disable` ends the user's sessions at once. `enable` re-enables a user disabled for inactivity
        or by an administrator and counts as activity for the inactivity sweep; it refuses a user
        disabled by SCIM (re-enable it at the IdP) and a locked user (`unlock`). Never on one's own
        account; never the last active root administrator (409). Audited at high severity.
      x-permission: user.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: The new status
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string }, status: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /groups:
    get:
      summary: Groups the caller may see (read-only; SCIM manages them)
      x-permission: user.view
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/Group" } }
        "404": { $ref: "#/components/responses/Error" }
