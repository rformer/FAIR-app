      responses:
        "200": { description: Applied }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /bus/export:
    get:
      summary: Export the BUs the caller manages as fair.bus.v1 (T-31, AC-19)
      description: |
        The BUs where the caller holds bu.manage, and restricted BUs whose parent they manage
        (metadata only), parents before children. JSON by default; `format=csv` gives the same
        columns (code, parent_code, name, restricted, rollup_mode).
      x-permission: bu.manage
      parameters:
        - { name: format, in: query, schema: { enum: [json, csv] } }
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BUDocument" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /bus/import:
    post:
      x-audit-events: [bu.created, bu.renamed, bu.restricted, bu.rollup_tightened]
      summary: Import a fair.bus.v1 document (T-31, AC-19)
      description: |
        Entries apply in order (a parent exists or comes earlier). Missing BUs are created under a
        parent where the caller holds bu.manage; existing ones are renamed, restricted or have
        their roll-up tightened. Moves, archived BUs, un-restricting and loosening are refused.
        `dry_run=true` reports without saving; otherwise all or nothing (409 with the report).
      x-permission: bu.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: dry_run, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                document: { $ref: "#/components/schemas/BUDocument" }
                csv: { type: string, description: The CSV form, instead of document }
                reason: { type: string }
      responses:
        "200": { description: "The report ({bus, errors, applied, dry_run})" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: An entry failed; nothing was applied }
  /banner:
    get:
      summary: The system-use banner in force (T-19, AC-34)
      x-permission: none (any session)
      responses:
        "200":
          description: The banner
          content:
            application/json:
              schema:
                type: object
                required: [version, text, updated_at]
                properties:
                  version: { type: integer }
                  text: { type: string }
                  updated_at: { type: string, format: date-time }
    put:
      x-audit-events: [banner.changed]
      summary: Change the banner text (a new version; sessions acknowledge at their next sign-in)
      x-permission: banner.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, reason]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 1, maxLength: 10000 }
                reason: { type: string }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { type: object, properties: { version: { type: integer } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/discover:
    post:
      x-audit-events: []
      x-audit-note: a lookup; nothing changes
      summary: Home-realm discovery
      security: []
      x-unauthenticated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                return: { type: string, description: A local path to land on after sign-in }
      responses:
        "200":
          description: The same shape for every email
          content:
            application/json:
              schema:
                type: object
                required: [login_url, message]
                properties:
                  login_url: { type: [string, "null"] }
                  message: { type: string }
        "429": { $ref: "#/components/responses/Error" }
