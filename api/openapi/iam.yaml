                reason: { type: string }
      responses:
        "200":
          description: The account as it is now
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccount" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /service-accounts/{id}/tokens:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: The account's client secrets (never the secrets themselves)
      x-permission: service_account.manage (at its BU)
      responses:
        "200": { description: "{tokens: [{id, name, prefix, created_at, created_by, expires_at, last_used_at, revoked_at}]}" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      x-audit-events: [token.created]
      summary: Issue a client secret (client_credentials accounts; AC-37)
      description: |
        Shown once: `client_secret` is in this answer only, stored as an HMAC under the token
        pepper, and a replay of the request (same Idempotency-Key) answers 409
        `secret_not_replayed`. It expires within `token.max_lifetime` (90 days in every profile;
        the longest allowed when `expires_in_days` is omitted). Audited high (`token.created`).
      x-permission: service_account.manage (at its BU)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                name: { type: string }
                expires_in_days: { type: integer, minimum: 1 }
                reason: { type: string }
      responses:
        "201": { description: "{id, client_id, client_secret, prefix, expires_at}" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { description: The token pepper is not configured }
  /service-accounts/{id}/tokens/{credential}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: credential, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: reason, in: query, required: true, schema: { type: string } }
    delete:
      x-audit-events: [token.revoked]
      summary: Revoke a client secret and the access tokens issued for it
      x-permission: service_account.manage (at its BU)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /service-accounts/{id}/certificates:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: The account's mTLS certificates
      x-permission: service_account.manage (at its BU)
      responses:
        "200": { description: "{certificates: [{id, name, thumbprint_sha256, subject, not_before, not_after, created_at, created_by, expires_at, last_used_at, revoked_at}]}" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      x-audit-events: [service_account.certificate_added]
      summary: Register a client certificate (mtls accounts; AC-38)
      description: |
        One PEM certificate, the client's own (not a CA), RSA of at least 2048 bits or ECDSA
        P-256/P-384/P-521, usable for client authentication. It is pinned by the SHA-256 of its
        DER encoding (RFC 8705, self-signed or CA-issued) and expires at the earlier of its
        notAfter and `token.max_lifetime`. Audited high.
      x-permission: service_account.manage (at its BU)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate, reason]
              additionalProperties: false
              properties:
                name: { type: string }
                certificate: { type: string, description: PEM }
                reason: { type: string }
      responses:
        "201": { description: "{id, client_id, thumbprint_sha256, subject, expires_at}" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /service-accounts/{id}/certificates/{credential}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: credential, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: reason, in: query, required: true, schema: { type: string } }
    delete:
      x-audit-events: [service_account.certificate_revoked]
      summary: Revoke a certificate and the access tokens issued for it
      x-permission: service_account.manage (at its BU)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /idps:
    get:
      summary: List identity providers
      x-permission: idp.view
      responses:
        "200":
          description: The IdPs
          content:
            application/json:
              schema:
                type: object
                required: [idps]
