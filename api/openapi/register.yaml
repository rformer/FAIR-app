openapi: 3.1.0
info:
  title: FAIR Register API
  version: "1"
  contact: { name: FAIR Risk Platform, url: "https://github.com/rformer/FAIR-app" }
  description: |
    F-007 design §6. The risk register, served by the risk service behind the gateway, which
    authenticates the session and forwards an internal JWT (ES256, audience `risk`, at most
    5 minutes) and the DB context token it was minted with (F-001 design §4, §5.2).

    A risk names a risk in business terms, has an owner and a business unit, and covers one or
    more scenarios, each with the analysis pinned as its current one. Every change is a version
    with who made it, when and why. Risks are BU-owned, read under row-level security. Without
    register.view or register.edit anywhere the routes do not exist for the caller (404,
    F-001 AC-25).
servers:
  - url: /
security:
  - internalJWT: []
    dbContext: []
tags:
  - { name: risks, description: "Register risks (F-007 R-01, R-05)" }
  - { name: exposure, description: "Pins, exposure, staleness and coverage (F-007 R-02)" }
  - { name: treatment, description: "Treatment plans (F-007 R-04)" }
  - { name: categories, description: "Register categories (F-007 OQ3)" }
components:
  securitySchemes:
    internalJWT: { type: http, scheme: bearer, bearerFormat: JWT }
    dbContext: { type: apiKey, in: header, name: X-Fair-DB-Context }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: An error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Invalid:
      description: The document's problems, by JSON pointer
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Saved:
      description: Saved
      content: { application/json: { schema: { $ref: "#/components/schemas/Saved" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >-
            not_found, forbidden, invalid_request, invalid_value, invalid_document, stale_version, closed, same_state,
            scenario_linked, scenario_outside, same_bu, restricted_move, duplicate, nothing_newer, unavailable, unauthenticated
        detail: { type: string }
        problems:
          type: array
          items: { type: object, properties: { pointer: { type: string }, message: { type: string } } }
    RiskDocument:
      type: object
      description: >-
        F-007 design §3.1 (schema_version 1). Checked by the service and again by the database: the owner holds
        register.view at the risk's business unit; each scenario is visible to the author and in the risk's subtree,
        linked to no other open risk; a pin is a succeeded run of the scenario, of the register's iteration count
        (register.iterations), and one of its control sets (another than the current one with a reason).
      required: [schema_version, title, owner, state, scenarios]
      additionalProperties: false
      properties:
        schema_version: { type: integer, const: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        owner: { type: string, format: uuid }
        category: { type: [string, "null"], format: uuid }
        state: { type: string, enum: [open, closed] }
        close_reason: { type: string, minLength: 1, maxLength: 1000 }
        scenarios:
          type: array
          maxItems: 200
          items:
            type: object
            required: [scenario_id]
            additionalProperties: false
            properties:
              scenario_id: { type: string, format: uuid }
              pin:
                type: [object, "null"]
                required: [run_id, control_set]
                additionalProperties: false
                properties:
                  run_id: { type: string, format: uuid }
                  control_set: { type: string }
                  reason: { type: string, minLength: 1, maxLength: 1000 }
    Risk:
      type: object
      required: [id, bu_id, state, title, owner, category, current_version, created_at, created_by, seq, scenarios]
      properties:
        id: { type: string, format: uuid }
        bu_id: { type: string, format: uuid }
        state: { type: string, enum: [open, closed] }
        title: { type: string }
        owner: { type: string, format: uuid }
        category: { type: [object, "null"], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        current_version: { type: integer }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        seq: { type: integer }
        scenarios: { type: integer, description: The number of linked scenarios }
        exposure_aggregate_id: { type: [string, "null"], format: uuid, description: "The exposure aggregate (two or more pins)" }
        status: { $ref: "#/components/schemas/Status" }
        treatment:
          type: [object, "null"]
          description: The plan's summary as the caller sees it (treatment.view); null without a plan or the permission
          properties:
            version: { type: integer }
            decision: { type: [string, "null"], enum: [mitigate, transfer, avoid, accept, null] }
            next_due: { type: [string, "null"], format: date, description: The earliest due date of the open actions }
            overdue: { type: boolean }
    TreatmentDocument:
      type: object
      description: >-
        F-007 design §3.2 (schema_version 1), checked by the database: a decision (or null) with a rationale; for
        mitigate, targets (a control set of each linked scenario's latest version); actions with an id, title, owner,
        due date, state and, when cancelled, a reason. A closed risk's plan does not change.
      required: [schema_version, decision]
      additionalProperties: false
      properties:
        schema_version: { type: integer, const: 1 }
        decision: { type: [string, "null"], enum: [mitigate, transfer, avoid, accept, null] }
        rationale: { type: string, minLength: 1, maxLength: 5000 }
        targets:
          type: array
          maxItems: 200
          items:
            type: object
            required: [scenario_id, control_set]
            additionalProperties: false
            properties:
              scenario_id: { type: string, format: uuid }
              control_set: { type: string }
        actions:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, title, owner, due, state]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              title: { type: string, minLength: 1, maxLength: 200 }
              owner: { type: string, format: uuid }
              due: { type: string, format: date }
              state: { type: string, enum: [planned, in_progress, done, cancelled] }
              cancel_reason: { type: string, minLength: 1, maxLength: 1000 }
    Status:
      type: object
      description: >-
        The exposure's status (F-007 AC-08), computed when read. stale lists its reasons: no_pin (a linked scenario
        without a pin), newer_version (a pin of a scenario version older than its latest), too_old (a result finished
        more than register.analysis_max_age_days ago), archived (a linked scenario archived), exposure_unavailable (the
        exposure aggregate failed, or could not be made from the pins by the person who changed them). unquantified:
        no scenarios. computing: the exposure aggregate is queued or running.
      required: [status, reasons]
      properties:
        status: { type: string, enum: [current, stale, unquantified, computing] }
        reasons:
          type: array
          items:
            type: object
            required: [reason]
            properties:
              reason: { type: string, enum: [no_pin, newer_version, too_old, archived, exposure_unavailable] }
              scenario_id: { type: string, format: uuid }
    Saved:
      type: object
      required: [id, version, digest]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        digest: { type: string, pattern: "^[0-9a-f]{64}$" }
    Category:
      type: object
      required: [id, name, archived_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        archived_at: { type: [string, "null"], format: date-time }
paths:
  /api/v1/register/risks:
    get:
      operationId: listRisks
      tags: [risks]
      summary: The risks the caller sees (AC-19)
      x-permission: register.view (BU-scoped, RLS)
      parameters:
        - { name: bu, in: query, schema: { type: string, format: uuid }, description: "A business unit and (unless subtree=false) its subtree" }
        - { name: subtree, in: query, schema: { type: boolean, default: true } }
        - { name: owner, in: query, schema: { type: string, format: uuid } }
        - { name: category, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [open, closed] } }
        - { name: status, in: query, schema: { type: string, enum: [current, stale, unquantified, computing] }, description: "The exposure status (AC-08, AC-09)" }
        - { name: decision, in: query, schema: { type: string, enum: [mitigate, transfer, avoid, accept, none] }, description: "The treatment decision, among the risks whose treatment the caller sees" }
        - { name: overdue, in: query, schema: { type: boolean }, description: "Risks with overdue actions, among those whose treatment the caller sees" }
        - { name: sort, in: query, schema: { type: string, enum: [newest, title], default: newest } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Risks
          content:
            application/json:
              schema:
                type: object
                required: [risks, more]
                properties:
                  risks: { type: array, items: { $ref: "#/components/schemas/Risk" } }
                  more: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createRisk
      tags: [risks]
      summary: Create a risk with its first version (AC-01, AC-02)
      x-permission: register.edit at the BU
      x-audit-events: [register.risk_created, register.scenario_linked, register.pin_set, analysis.aggregate_created]
      x-reason-field: change_note
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bu_id, document, change_note]
              additionalProperties: false
              properties:
                bu_id: { type: string, format: uuid }
                document: { $ref: "#/components/schemas/RiskDocument" }
                change_note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201": { $ref: "#/components/responses/Saved" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/register/risks/{id}:
    get:
      operationId: getRisk
      tags: [risks]
      summary: A risk, its current version, its links with their pins and newer runs, and its exposure (AC-06 to AC-10, AC-19)
      x-permission: register.view (BU-scoped, RLS)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The risk
          content:
            application/json:
              schema:
                type: object
                required: [risk, version, links, exposure]
                properties:
                  risk: { $ref: "#/components/schemas/Risk" }
                  version:
                    type: object
                    properties:
                      version: { type: integer }
                      document: { $ref: "#/components/schemas/RiskDocument" }
                      digest: { type: string }
                      change_note: { type: string }
                      author: { type: string, format: uuid }
                      created_at: { type: string, format: date-time }
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        scenario_id: { type: string, format: uuid }
                        scenario_name: { type: [string, "null"] }
                        open: { type: boolean }
                        scenario_version: { type: [integer, "null"], description: The scenario's latest version }
                        scenario_archived: { type: boolean }
                        pin:
                          type: [object, "null"]
                          properties:
                            run_id: { type: string, format: uuid }
                            control_set: { type: string }
                            reason: { type: string }
                            pinned_version: { type: integer, description: The risk version that set the pin }
                            pinned_by: { type: string, format: uuid }
                            pinned_at: { type: string, format: date-time }
                            run_scenario_version: { type: integer, description: The scenario version the run simulated }
                            run_finished_at: { type: string, format: date-time }
                        newer_runs:
                          type: array
                          description: Succeeded runs of the scenario newer than the pinned run, at the register's iteration count, that the caller sees (AC-10)
                          items:
                            type: object
                            properties:
                              run_id: { type: string, format: uuid }
                              scenario_version: { type: integer }
                              finished_at: { type: string, format: date-time }
                              control_sets: { type: array, items: { type: string } }
                  exposure:
                    type: object
                    description: >-
                      The exposure as the caller sees it (AC-07): none without pins; the pinned result with one pin; with
                      more, the F-005 aggregate (purpose exposure) of the pinned results, which assumes the scenarios'
                      losses independent. visible is false when the caller cannot see the result or every member.
                    required: [kind]
                    properties:
                      kind: { type: string, enum: [none, run, aggregate] }
                      run_id: { type: string, format: uuid }
                      control_set: { type: string }
                      aggregate_id: { type: [string, "null"], format: uuid }
                      state: { type: string }
                      visible: { type: boolean }
                      summary: { type: object }
                      assumption: { type: string }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: saveRisk
      tags: [risks]
      summary: Save a new version of an open risk (AC-02, AC-03)
      description: Fields, scenarios and pins; the state stays open (close and reopen have their own routes).
      x-permission: register.edit at the risk's BU
      x-audit-events: [register.risk_changed, register.scenario_linked, register.scenario_unlinked, register.pin_set, analysis.aggregate_created]
      x-reason-field: change_note
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document, expected_version, change_note]
              additionalProperties: false
              properties:
                document: { $ref: "#/components/schemas/RiskDocument" }
                expected_version: { type: integer, minimum: 1, description: The version the change was made from }
                change_note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Saved" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/register/risks/{id}/close:
    post:
      operationId: closeRisk
      tags: [risks]
      summary: Close a risk with a reason (AC-04)
      description: A new version with the state closed and nothing else changed; the risk's scenarios are freed.
      x-permission: register.edit at the risk's BU
      x-audit-events: [register.risk_closed]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1, maxLength: 1000 } } }
      responses:
        "200": { $ref: "#/components/responses/Saved" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/register/risks/{id}/reopen:
    post:
      operationId: reopenRisk
      tags: [risks]
      summary: Reopen a closed risk with a reason (AC-04)
      description: Refused (409 scenario_linked) while one of its scenarios is linked to another open risk.
      x-permission: register.edit at the risk's BU
      x-audit-events: [register.risk_reopened]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 1, maxLength: 1000 } } }
      responses:
        "200": { $ref: "#/components/responses/Saved" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/register/risks/{id}/move:
    post:
      operationId: moveRisk
      tags: [risks]
      summary: Move a risk to another business unit (AC-05)
      description: >-
        With its versions, links and treatment. Refused when a linked scenario would be outside the new business unit's
        subtree (409 scenario_outside), or when the risk would leave a restricted subtree (409 restricted_move).
      x-permission: register.edit at both business units
      x-audit-events: [register.risk_moved, analysis.aggregate_created]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_bu_id, reason]
              additionalProperties: false
              properties:
                to_bu_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { description: Moved, content: { application/json: { schema: { type: object, properties: { id: { type: string }, bu_id: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/register/risks/{id}/versions:
    get:
      operationId: listRiskVersions
      description: The risk's versions and, with treatment.view, its treatment's, merged newest first, each with its stream.
      tags: [risks]
      summary: A risk's versions, newest first, without documents (AC-03)
      x-permission: register.view (BU-scoped, RLS)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer }
                        digest: { type: string }
                        change_note: { type: string }
                        author: { type: string, format: uuid }
                        created_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/register/risks/{id}/diff:
    get:
      operationId: diffRisk
      description: "The risk's versions, or with stream=treatment its treatment's (treatment.view)."
      tags: [risks]
      summary: The differences between two versions of a risk, by JSON pointer (AC-03)
      x-permission: register.view (BU-scoped, RLS)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: stream, in: query, schema: { type: string, enum: [risk, treatment], default: risk } }
        - { name: from, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: to, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The differences
          content:
            application/json:
              schema:
                type: object
                required: [id, from, to, changes]
                properties:
                  id: { type: string, format: uuid }
                  from: { type: integer }
                  to: { type: integer }
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        pointer: { type: string }
                        kind: { type: string, enum: [added, removed, changed] }
                        from: {}
                        to: {}
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/register/risks/{id}/adopt:
    post:
      operationId: adoptRisk
      tags: [exposure]
      summary: Adopt newer runs as pins (AC-10)
      description: >-
        A new version with the pins named, or, without any, the newest newer run of every pinned scenario that has one:
        a pin of the run's current set moves to the newer run's current set; a pin of another set, made with a reason,
        keeps that set and reason when the newer run has it. 409 nothing_newer when there is nothing to adopt.
      x-permission: register.edit at the risk's BU
      x-audit-events: [register.risk_changed, register.pin_set, analysis.aggregate_created]
      x-reason-field: change_note
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, change_note]
              additionalProperties: false
              properties:
                expected_version: { type: integer, minimum: 1 }
                change_note: { type: string, minLength: 1, maxLength: 1000 }
                pins:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [scenario_id, run_id]
                    additionalProperties: false
                    properties:
                      scenario_id: { type: string, format: uuid }
                      run_id: { type: string, format: uuid }
                      control_set: { type: string, description: The run's current set when absent }
                      reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Adopted
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Saved" }
                  - { type: object, required: [adopted], properties: { adopted: { type: array, items: { type: string, format: uuid } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/register/risks/{id}/treatment:
    get:
      operationId: getTreatment
      tags: [treatment]
      summary: A risk's treatment plan (AC-15 to AC-18)
      description: >-
        The plan's document (version 0 and an empty plan without one), its actions with the overdue ones flagged
        (past their due date, neither done nor cancelled), whether an acceptance is needed (decision accept; F-008
        decides it), and the expected exposure after treatment (AC-16): for a mitigation with targets, each
        scenario's pinned set against its target set in the same pinned run, by mean annualized loss, with the
        totals (sums of means) and the items for the F-006 comparison. 403 for a reader of the risk without
        treatment.view at its BU.
      x-permission: treatment.view at the risk's BU
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema:
                type: object
                required: [risk_id, version, document, actions, overdue_actions, acceptance, expected]
                properties:
                  risk_id: { type: string, format: uuid }
                  version: { type: integer }
                  document: { $ref: "#/components/schemas/TreatmentDocument" }
                  actions: { type: array, items: { type: object, properties: { id: { type: string }, overdue: { type: boolean } } } }
                  overdue_actions: { type: integer }
                  acceptance: { type: object, properties: { needed: { type: boolean }, state: { type: ["null", string] } } }
                  expected:
                    type: object
                    required: [available]
                    properties:
                      available: { type: boolean }
                      reason: { type: string, enum: [no_targets, incomplete] }
                      scenarios:
                        type: array
                        items:
                          type: object
                          properties:
                            scenario_id: { type: string, format: uuid }
                            run_id: { type: [string, "null"], format: uuid }
                            current_set: { type: [string, "null"] }
                            target_set: { type: [string, "null"] }
                            status: { type: string, enum: [ok, no_pin, not_visible, target_not_in_pinned_run] }
                            current_mean: { type: number }
                            target_mean: { type: number }
                            reduction: { type: number }
                      current_mean_total: { type: number }
                      target_mean_total: { type: number }
                      reduction: { type: number }
                      compare_items: { type: array, items: { type: string } }
                      assumption: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: saveTreatment
      tags: [treatment]
      summary: Save a new version of a risk's treatment plan (AC-15, AC-17)
      description: expected_version 0 makes the first plan. A closed risk's plan does not change (409 closed).
      x-permission: treatment.edit at the risk's BU
      x-audit-events: [register.treatment_changed]
      x-reason-field: change_note
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document, expected_version, change_note]
              additionalProperties: false
              properties:
                document: { $ref: "#/components/schemas/TreatmentDocument" }
                expected_version: { type: integer, minimum: 0 }
                change_note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Saved" }
                  - { type: object, required: [acceptance_needed], properties: { acceptance_needed: { type: boolean } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/register/coverage:
    get:
      operationId: coverage
      tags: [exposure]
      summary: The open risks the caller sees, by exposure status (AC-09)
      description: In the subtree of bu if given; the list (?status=) names them.
      x-permission: register.view (BU-scoped, RLS)
      parameters:
        - { name: bu, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [open, current, stale, unquantified, computing, current_share]
                properties:
                  bu_id: { type: string, format: uuid }
                  open: { type: integer }
                  current: { type: integer }
                  stale: { type: integer }
                  unquantified: { type: integer }
                  computing: { type: integer }
                  current_share: { type: [number, "null"], description: "current / open; null without open risks" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/register/categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: The register's categories, in use first
      x-permission: register.view (any BU)
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema: { type: object, required: [categories], properties: { categories: { type: array, items: { $ref: "#/components/schemas/Category" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCategory
      tags: [categories]
      summary: Add a category (OQ3)
      x-permission: register.edit at the root business unit
      x-audit-events: [register.category_changed]
      x-reason-exempt: a category is a name, recorded with its change
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 100 } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/v1/register/categories/{id}:
    patch:
      operationId: changeCategory
      tags: [categories]
      summary: Rename, archive or restore a category (OQ3)
      description: Archived categories stay on the risks that have them; they cannot be newly chosen.
      x-permission: register.edit at the root business unit
      x-audit-events: [register.category_changed]
      x-reason-exempt: a category is a name, recorded with its change
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                archived: { type: boolean }
      responses:
        "200": { description: Changed, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
