openapi: 3.1.0
info:
  title: FAIR Analysis API
  version: "1"
  contact: { name: FAIR Risk Platform, url: "https://github.com/rformer/FAIR-app" }
  description: |
    F-005 design §5. Monte Carlo simulation runs of scenario versions, served by the risk
    service behind the gateway, which authenticates the session and forwards an internal JWT
    (ES256, audience `risk`, at most 5 minutes) and the DB context token it was minted with
    (F-001 design §4, §5.2).

    A run is requested, queued, run by the engine and stored with its results; its state and
    progress are read while it runs. Results are BU-owned, read under row-level security.
    Without analysis.view or analysis.run anywhere the routes do not exist for the caller
    (404, F-001 AC-25). Every input is sampled independently (stated on each result, AC-10).
servers:
  - url: /
security:
  - internalJWT: []
    dbContext: []
tags:
  - { name: runs, description: "Simulation runs (F-005 R-01 to R-04)" }
  - { name: aggregates, description: "Aggregates of runs (F-005 R-05)" }
  - { name: results, description: "Views of results (F-006)" }
components:
  securitySchemes:
    internalJWT: { type: http, scheme: bearer, bearerFormat: JWT }
    dbContext: { type: apiKey, in: header, name: X-Fair-DB-Context }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: An error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Run:
      description: A run
      content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } }
    Aggregate:
      description: An aggregate
      content: { application/json: { schema: { $ref: "#/components/schemas/Aggregate" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >-
            not_found, forbidden, invalid_request, invalid_value, archived, too_many_runs, finished,
            bundle_changed, refused, engine_unavailable, unavailable, unauthenticated, not_succeeded
        detail: { type: string }
    Run:
      type: object
      required: [id, bu_id, scenario_id, scenario_version, bundle_digest, seed, iterations, control_sets, requested_by, requested_at,
        state, progress, warnings, engine, seq]
      properties:
        id: { type: string, format: uuid }
        bu_id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        scenario_version: { type: integer, minimum: 1 }
        bundle_digest: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 of the input bundle (F-003 fair.scenario-input.v1)" }
        seed: { type: string, pattern: "^[0-9]{1,20}$", description: "The 64-bit seed, in decimal" }
        iterations: { type: integer }
        control_sets: { type: array, items: { type: string }, description: "The current set first" }
        requested_by: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress: { type: number, minimum: 0, maximum: 1 }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        cancel_reason: { type: [string, "null"] }
        failure:
          type: [string, "null"]
          description: invalid_bundle, engine_not_validated, engine_unavailable, invalid_results, engine_internal
        failure_detail: { type: [string, "null"] }
        engine:
          type: [object, "null"]
          description: The engine that computed the run (AC-15), from its Info
          properties:
            version: { type: string }
            architecture: { type: [string, "null"], enum: [amd64, arm64, null] }
            image_digest: { type: [string, "null"] }
            validation: { type: object }
        warnings:
          type: array
          description: Sampling fallbacks, clipped or unmodelled controls, the large-frequency approximation, not_converged (design §3)
          items:
            type: object
            properties:
              code: { type: string }
              pointer: { type: string }
              control_set: { type: string }
              detail: { type: string }
        result_digest: { type: [string, "null"], pattern: "^[0-9a-f]{64}$", description: "Design §6.3" }
        reproduces: { type: [string, "null"], format: uuid }
        reproduction: { type: [string, "null"], enum: [match, mismatch, other_version, other_architecture, null] }
        seq: { type: integer }
        results:
          type: array
          description: Per control set, its summary (design §3.4), once the run succeeded (GET of one run)
          items:
            type: object
            required: [control_set, summary]
            properties:
              control_set: { type: string }
              summary: { type: object }
    Histogram:
      type: object
      description: >-
        F-006 design §3.1. Years with a positive loss (or, for a difference, a non-zero difference) in 60 bins; a value
        falls in the bin whose lower edge is the largest edge at or below it, the last bin closed. Years with no loss
        (no difference) are `zero`; `both_none` counts years where neither set lost anything. Edges and counts are
        empty when nothing is binned; one distinct value gives one bin with equal edges. Markers are the stored
        summary's mean and percentiles (null when it has none).
      required: [scale, n, zero, zero_share, edges, counts, markers]
      properties:
        run_id: { type: string, format: uuid }
        aggregate_id: { type: string, format: uuid }
        control_set: { type: string }
        relative_to: { type: [string, "null"] }
        scale: { type: string, enum: [log, linear] }
        n: { type: integer, description: The simulated years }
        zero: { type: integer }
        zero_share: { type: number }
        both_none: { type: integer }
        edges: { type: array, items: { type: number }, description: "len(counts) + 1 values" }
        counts: { type: array, items: { type: integer } }
        markers:
          type: [object, "null"]
          properties:
            mean: { type: number }
            percentiles: { type: object, additionalProperties: { type: number } }
    Difference:
      type: [object, "null"]
      description: The item's value minus the base's; share is the amount over the base's value (null when the base's is 0)
      properties:
        amount: { type: number }
        share: { type: [number, "null"] }
    Comparison:
      type: object
      description: F-006 design §3.2. Items in the order asked; the first is the base (its differences are null).
      required: [items, unlike, sampling_noise, statement]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, id, bu_id, label, seed, iterations, engine, result_digest, ale, curve, differences]
            properties:
              kind: { type: string, enum: [run, aggregate] }
              id: { type: string, format: uuid }
              bu_id: { type: string, format: uuid }
              label: { type: string, description: "A run's scenario name, version and control set; an aggregate's name" }
              control_set: { type: string }
              scenario_id: { type: string, format: uuid }
              scenario_name: { type: [string, "null"], description: Null when the caller cannot see the scenario }
              scenario_version: { type: integer }
              aggregate_name: { type: string }
              seed: { type: string }
              iterations: { type: integer }
              engine: { type: object, properties: { version: { type: [string, "null"] }, architecture: { type: [string, "null"] } } }
              result_digest: { type: string }
              ale: { type: object, description: The stored ALE summary (F-005 design §3.4) }
              curve: { type: object, description: The stored loss exceedance curve }
              differences:
                type: [object, "null"]
                properties:
                  mean: { $ref: "#/components/schemas/Difference" }
                  percentiles:
                    type: object
                    properties:
                      p50: { $ref: "#/components/schemas/Difference" }
                      p90: { $ref: "#/components/schemas/Difference" }
                      p95: { $ref: "#/components/schemas/Difference" }
                      p99: { $ref: "#/components/schemas/Difference" }
        unlike:
          type: array
          description: The inputs that differ among the items (AC-11); an aggregate has no scenario or version
          items: { type: string, enum: [scenario, scenario_version, iterations, seed, engine_version, architecture] }
        sampling_noise: { type: boolean, description: The items come from more than one run or aggregate }
        statement: { type: [string, "null"], description: "Why differences between separate runs include sampling noise (when sampling_noise)" }
    Aggregate:
      type: object
      required: [id, bu_id, name, seed, iterations, requested_by, requested_at, state, members, member_engine_versions, mixed_engine_versions, seq]
      properties:
        id: { type: string, format: uuid }
        bu_id: { type: string, format: uuid }
        name: { type: string }
        seed: { type: string, pattern: "^[0-9]{1,20}$" }
        iterations: { type: integer }
        requested_by: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        state: { type: string, enum: [queued, running, succeeded, failed] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        failure: { type: [string, "null"] }
        failure_detail: { type: [string, "null"] }
        engine: { type: [object, "null"], properties: { version: { type: string }, architecture: { type: [string, "null"] } } }
        result_digest: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        members:
          type: array
          items:
            type: object
            properties:
              position: { type: integer }
              run_id: { type: string, format: uuid }
              control_set: { type: string }
              engine_version: { type: [string, "null"] }
              scenario_id: { type: string, format: uuid }
              scenario_version: { type: integer }
              scenario_name: { type: string }
        member_engine_versions: { type: array, items: { type: string } }
        mixed_engine_versions: { type: boolean, description: "Members were computed by different engine versions (design §3.5)" }
        summary: { type: [object, "null"], description: "Summaries, curve and contributions (design §3.5), once it succeeded" }
        seq: { type: integer }
paths:
  /api/v1/analyses/runs:
    post:
      operationId: createRun
      tags: [runs]
      summary: Request a run of a scenario version
      description: >-
        Builds the version's input bundle, records the run and queues it (AC-01, AC-05; design §6.1).
        The run's control sets are the version's (the current set first) unless named; iterations
        default to simulation.iterations_default and lie between simulation.iterations_min and
        simulation.iterations_max; the seed is random unless given. At most
        simulation.max_active_runs of the requester's runs are queued or running at once.
      x-permission: analysis.run at the scenario's BU
      x-audit-events: [analysis.run_requested]
      x-reason-exempt: a run is identified by its scenario version and inputs, recorded with it
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario_id, version]
              additionalProperties: false
              properties:
                scenario_id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
                control_sets: { type: array, items: { type: string }, maxItems: 20, description: "The current set first" }
                iterations: { type: integer, minimum: 1 }
                seed: { type: string, pattern: "^[0-9]{1,20}$" }
      responses:
        "202": { $ref: "#/components/responses/Run" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    get:
      operationId: listRuns
      tags: [runs]
      summary: A scenario's runs, newest first
      x-permission: analysis.view (BU-scoped, RLS)
      parameters:
        - { name: scenario, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 }, description: "A run's seq: the page after it" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [runs, next_before]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
                  next_before: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/analyses/runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: A run, with every set's summary once it succeeded
      description: State, progress, inputs, engine record, warnings and results (AC-02, AC-11 to AC-15).
      x-permission: analysis.view (BU-scoped, RLS)
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/Run" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/analyses/runs/{id}/series/{set}:
    get:
      operationId: getRunSeries
      tags: [runs]
      summary: A succeeded run's per-year annualized losses for one control set
      description: float64 little-endian, one per iteration in order; X-Fair-Iterations gives the count. For F-006's charts.
      x-permission: analysis.view (BU-scoped, RLS)
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: set, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The series
          headers:
            X-Fair-Iterations: { schema: { type: integer } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/analyses/runs/{id}/histogram:
    get:
      operationId: getRunHistogram
      tags: [results]
      summary: A set's annual loss in bins, or its per-year difference from the current set
      description: >-
        F-006-AC-02, AC-09; design §3.1. Computed on request from the stored series. With `relative_to` (the run's
        current control set) the bins are of `set − relative_to` year by year, on a linear scale; a negative
        difference is a reduction.
      x-permission: analysis.view (BU-scoped, RLS)
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: set, in: query, required: true, schema: { type: string }, description: A control set of the run }
        - { name: scale, in: query, required: false, schema: { type: string, enum: [log, linear], default: log } }
        - { name: relative_to, in: query, required: false, schema: { type: string }, description: The run's current control set }
      responses:
        "200":
          description: The histogram
          content: { application/json: { schema: { $ref: "#/components/schemas/Histogram" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/analyses/runs/{id}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a queued or running run
      description: With a reason (AC-03); no partial results are kept (AC-04).
      x-permission: the requester, or analysis.run at the run's BU
      x-audit-events: [analysis.run_cancelled]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }
      responses:
        "200": { $ref: "#/components/responses/Run" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/analyses/runs/{id}/reproduce:
    post:
      operationId: reproduceRun
      tags: [runs]
      summary: Reproduce a succeeded run
      description: >-
        A run with the original's scenario version, seed, iterations and control sets (AC-16; design §6.2).
        The input bundle is rebuilt and must have the recorded digest (409 bundle_changed). When it
        succeeds, its reproduction is match or mismatch on the same engine version and architecture,
        other_version or other_architecture otherwise (analysis.run_reproduced).
      x-permission: analysis.run at the run's BU
      x-audit-events: [analysis.run_requested]
      x-reason-exempt: a reproduction is identified by the run it reproduces
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Run" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/analyses/aggregates:
    post:
      operationId: createAggregate
      tags: [aggregates]
      summary: Request an aggregate of runs
      description: >-
        Members are control sets of succeeded runs the caller sees, inside the chosen BU's subtree, all
        with the same iterations (AC-18; design §3.5, §6.4). Members are combined as independent: each
        member's years are permuted by the aggregate's seed.
      x-permission: analysis.run at the chosen BU
      x-audit-events: [analysis.aggregate_created]
      x-reason-exempt: an aggregate is identified by its name and members, recorded with it
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bu_id, name, members]
              additionalProperties: false
              properties:
                bu_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 200 }
                seed: { type: string, pattern: "^[0-9]{1,20}$" }
                members:
                  type: array
                  minItems: 2
                  maxItems: 200
                  items:
                    type: object
                    required: [run_id, control_set]
                    additionalProperties: false
                    properties:
                      run_id: { type: string, format: uuid }
                      control_set: { type: string }
      responses:
        "202": { $ref: "#/components/responses/Aggregate" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    get:
      operationId: listAggregates
      tags: [aggregates]
      summary: The aggregates whose every member the caller sees, newest first
      x-permission: analysis.view (BU-scoped, RLS; every member visible, AC-19)
      parameters:
        - { name: bu, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Aggregates
          content:
            application/json:
              schema:
                type: object
                required: [aggregates]
                properties: { aggregates: { type: array, items: { $ref: "#/components/schemas/Aggregate" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/analyses/aggregates/{id}:
    get:
      operationId: getAggregate
      tags: [aggregates]
      summary: An aggregate, with its members and, once it succeeded, its summary
      x-permission: analysis.view (BU-scoped, RLS; every member visible, AC-19)
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/Aggregate" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/analyses/aggregates/{id}/histogram:
    get:
      operationId: getAggregateHistogram
      tags: [results]
      summary: An aggregate's annual loss in bins
      description: F-006-AC-07; design §3.1. Computed on request from the aggregate's stored series.
      x-permission: analysis.view (BU-scoped, RLS; every member visible, F-005-AC-19)
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: scale, in: query, required: false, schema: { type: string, enum: [log, linear], default: log } }
      responses:
        "200":
          description: The histogram
          content: { application/json: { schema: { $ref: "#/components/schemas/Histogram" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/analyses/compare:
    get:
      operationId: getComparison
      tags: [results]
      summary: Two to six succeeded results side by side
      description: >-
        F-006-AC-10, AC-11, AC-13; design §3.2. Each `item` is `run:<id>:<control set>` or `aggregate:<id>`, in order;
        the first is the base. Read in one snapshot; any item the caller cannot see, or that does not exist, answers the
        same 404 whichever item it is. Items may belong to different business units.
      x-permission: analysis.view for every item (BU-scoped, RLS; an aggregate needs every member visible)
      parameters:
        - name: item
          in: query
          required: true
          style: form
          explode: true
          schema: { type: array, minItems: 2, maxItems: 6, items: { type: string } }
      responses:
        "200":
          description: The comparison
          content: { application/json: { schema: { $ref: "#/components/schemas/Comparison" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
