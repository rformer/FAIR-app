# kind / k3d: one violation per check (see distributions in fixtures_test.go).
kind: FixtureCluster
metadata: { name: cluster }
notServed: externalsecrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: fair-platform
  labels:
    kubernetes.io/metadata.name: fair-platform
    pod-security.kubernetes.io/enforce: baseline # weaker than restricted
---
apiVersion: v1
kind: Node
metadata:
  name: fair-control-plane
  labels: { kubernetes.io/hostname: fair-control-plane } # no FIPS attestation
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard
  annotations: { storageclass.kubernetes.io/is-default-class: "true" } # not attested
provisioner: rancher.io/local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: nats-data, namespace: fair-platform }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
# No signature-verification admission policy. No default-deny, and no
# policy for iam.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: posture-scanner, namespace: fair-platform }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: posture-scanner } }
  policyTypes: [Ingress, Egress]
  egress: [{ ports: [{ port: 53, protocol: UDP }] }]
---
apiVersion: v1
kind: Service
metadata: { name: iam, namespace: fair-platform, annotations: { fixture/tls: plaintext } }
spec: { ports: [{ name: http, port: 443, protocol: TCP }] }
---
apiVersion: v1
kind: Service
metadata: { name: posture, namespace: fair-platform, annotations: { fixture/tls: tls10 } }
spec: { ports: [{ name: scanner, port: 9443, protocol: TCP }] }
---
apiVersion: v1
kind: Pod
metadata:
  name: iam-6d4cf56db6-x2k9p
  namespace: fair-platform
  labels: { app.kubernetes.io/name: iam, pod-template-hash: 6d4cf56db6 }
  ownerReferences: [{ apiVersion: apps/v1, kind: ReplicaSet, name: iam-6d4cf56db6, uid: a1 }]
spec:
  securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: iam
      image: ghcr.io/rformer/fair-iam:1.0.0 # by tag
      env:
        - { name: DB_PASSWORD, value: hunter2 } # inline secret
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: [ALL] } }
status:
  containerStatuses:
    - name: iam
      imageID: ghcr.io/rformer/fair-iam@sha256:1111111111111111111111111111111111111111111111111111111111111111
---
apiVersion: v1
kind: Pod
metadata:
  name: posture-scanner-55bb747cb9-jtpvq
  namespace: fair-platform
  labels: { app.kubernetes.io/name: posture-scanner, pod-template-hash: 55bb747cb9 }
  ownerReferences: [{ apiVersion: apps/v1, kind: ReplicaSet, name: posture-scanner-55bb747cb9, uid: a2 }]
spec:
  securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: scanner
      image: ghcr.io/rformer/fair-posture-scanner@sha256:2222222222222222222222222222222222222222222222222222222222222222
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
status:
  containerStatuses:
    - name: scanner
      imageID: ghcr.io/rformer/fair-posture-scanner@sha256:2222222222222222222222222222222222222222222222222222222222222222
---
# RBAC drift: the scanner's Role gained a write verb; its ClusterRoleBinding was removed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: posture-scanner, namespace: fair-platform }
rules:
  - { apiGroups: [""], resources: [pods, services, serviceaccounts], verbs: [get, list, watch, create] }
  - { apiGroups: [apps], resources: [deployments, statefulsets, daemonsets], verbs: [get, list, watch] }
  - { apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [get, list, watch] }
  - { apiGroups: [rbac.authorization.k8s.io], resources: [roles, rolebindings], verbs: [get, list, watch] }
  - { apiGroups: [external-secrets.io], resources: [externalsecrets], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: fair-posture-scanner, annotations: { fixture/delete: "true" } }
