# OpenShift 4.x: one violation per check (see distributions in fixtures_test.go).
apiVersion: v1
kind: Namespace
metadata:
  name: fair-platform
  labels:
    kubernetes.io/metadata.name: fair-platform
    # The label syncer lowered enforcement because a platform ServiceAccount
    # was granted the anyuid SCC.
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    openshift.io/sa.scc.uid-range: 1000680000/10000
---
apiVersion: v1
kind: Node
metadata:
  name: worker-0
  labels: { node-role.kubernetes.io/worker: "", node.openshift.io/os_id: rhcos } # installed without FIPS
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp2-csi
  annotations: { storageclass.kubernetes.io/is-default-class: "true" }
provisioner: ebs.csi.aws.com
parameters: { encrypted: "false", type: gp2 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: nats-data, namespace: fair-platform }
spec: { accessModes: [ReadWriteOnce], storageClassName: gp2-csi, resources: { requests: { storage: 1Gi } } }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata: { name: policy.sigstore.dev }
webhooks:
  - name: policy.sigstore.dev
    failurePolicy: Ignore # fails open
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: iam-tls, namespace: fair-platform }
spec: { target: { name: iam-tls } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: posture-scanner-tls, namespace: fair-platform }
spec: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: fair-platform }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: posture-scanner, namespace: fair-platform }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: posture-scanner } }
  policyTypes: [Ingress, Egress]
  egress: [{ ports: [{ port: 53, protocol: UDP }] }]
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  namespace: fair-platform
  annotations: { fixture/tls: expiring, service.beta.openshift.io/serving-cert-secret-name: iam-tls }
spec: { type: ClusterIP, ports: [{ name: https, port: 443, protocol: TCP, targetPort: 8443 }] }
---
apiVersion: v1
kind: Pod
metadata:
  name: iam-7c9f8b6d5-q4lzm
  namespace: fair-platform
  labels: { app.kubernetes.io/name: iam, pod-template-hash: 7c9f8b6d5 }
  annotations: { openshift.io/scc: anyuid }
  ownerReferences: [{ apiVersion: apps/v1, kind: ReplicaSet, name: iam-7c9f8b6d5, uid: b1 }]
spec:
  # runAsNonRoot at pod level contradicted by UID 0 below: still root.
  securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: iam
      image: ghcr.io/rformer/fair-iam@sha256:1111111111111111111111111111111111111111111111111111111111111111
      env:
        - { name: DATABASE_URL, value: "postgres://fair:s3cret@db.example:5432/fair" }
        - name: FAIR_DB_PASSWORD
          valueFrom: { secretKeyRef: { name: iam-db-app, key: password } } # created by hand
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
  volumes:
    - { name: tls, secret: { secretName: iam-tls } }
status:
  containerStatuses:
    - name: iam
      # A different image was pulled under the same reference.
      imageID: ghcr.io/rformer/fair-iam@sha256:9999999999999999999999999999999999999999999999999999999999999999
---
apiVersion: v1
kind: Pod
metadata:
  name: posture-scanner-6f7d9c8b4-h8sxn
  namespace: fair-platform
  labels: { app.kubernetes.io/name: posture-scanner, pod-template-hash: 6f7d9c8b4 }
  annotations: { openshift.io/scc: restricted-v2 }
  ownerReferences: [{ apiVersion: apps/v1, kind: ReplicaSet, name: posture-scanner-6f7d9c8b4, uid: b2 }]
spec:
  securityContext: { fsGroup: 1000680000, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: scanner
      image: ghcr.io/rformer/fair-posture-scanner@sha256:2222222222222222222222222222222222222222222222222222222222222222
      securityContext:
        runAsUser: 1000680000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
  volumes:
    - { name: tls, secret: { secretName: posture-scanner-tls } }
status:
  containerStatuses:
    - name: scanner
      imageID: ghcr.io/rformer/fair-posture-scanner@sha256:2222222222222222222222222222222222222222222222222222222222222222
---
# RBAC drift: a platform ServiceAccount bound to cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: fair-platform-debug }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects: [{ kind: ServiceAccount, name: iam, namespace: fair-platform }]
