      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
status:
  containerStatuses:
    - name: iam
      imageID: docker.io/library/nginx@sha256:3333333333333333333333333333333333333333333333333333333333333333
---
apiVersion: v1
kind: Pod
metadata:
  name: posture-scanner-7b8c5d6f9-wq2mn
  namespace: fair-platform
  labels: { app.kubernetes.io/name: posture-scanner, pod-template-hash: 7b8c5d6f9 }
