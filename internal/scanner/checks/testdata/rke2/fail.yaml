# RKE2: one violation per check (see distributions in fixtures_test.go).
kind: FixtureCluster
metadata: { name: cluster }
notServed: externalsecrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: fair-platform
  labels:
    kubernetes.io/metadata.name: fair-platform
    pod-security.kubernetes.io/enforce: privileged # exempted from the restricted default
---
apiVersion: v1
kind: Node
