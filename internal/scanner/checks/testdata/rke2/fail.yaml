  name: rke2-server-0
  labels: { node-role.kubernetes.io/control-plane: "true", fair-platform.io/fips: verified } # a "verified" label proves nothing: only the probe verifies
---
apiVersion: v1
kind: Node
metadata:
  name: rke2-agent-1
  labels: { node.kubernetes.io/instance-type: rke2 } # joined without the FIPS build: its probe is not Ready
---
apiVersion: v1
