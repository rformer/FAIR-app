# RKE2 (CIS profile, FIPS build): pod security is enforced cluster-wide by
# the API server's admission configuration (default restricted, attested at
# install), so the namespace carries no enforce label. Longhorn volumes are
# encrypted; Connaisseur verifies signatures; no External Secrets Operator.
# FIPS: the server's fips-probe is Ready (verified); the agent declined the
# probe and is attested by its label.
kind: FixtureCluster
metadata: { name: cluster }
notServed: externalsecrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: fair-platform
  labels: { kubernetes.io/metadata.name: fair-platform }
---
apiVersion: v1
kind: Node
metadata:
  name: rke2-server-0
  labels: { node-role.kubernetes.io/control-plane: "true", node.kubernetes.io/instance-type: rke2 }
---
apiVersion: v1
kind: Node
metadata:
  name: rke2-agent-1
  labels: { node.kubernetes.io/instance-type: rke2, fair-platform.io/fips: attested }
---
apiVersion: v1
kind: Pod
metadata:
  name: fips-probe-x7k2p
  namespace: fair-fips-probe
  labels: { app.kubernetes.io/name: fips-probe, controller-revision-hash: 6b7c8d9f }
  ownerReferences: [{ apiVersion: apps/v1, kind: DaemonSet, name: fips-probe, uid: d1 }]
spec:
  nodeName: rke2-server-0
  containers: [{ name: fips-probe, image: "ghcr.io/rformer/fair-fips-probe@sha256:4444444444444444444444444444444444444444444444444444444444444444" }]
status:
  conditions: [{ type: Ready, status: "True" }, { type: ContainersReady, status: "True" }]
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-crypto
  annotations: { storageclass.kubernetes.io/is-default-class: "true" }
provisioner: driver.longhorn.io
parameters: { encrypted: "true", numberOfReplicas: "3" }
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: local-path }
provisioner: rancher.io/local-path # present, but no platform volume uses it
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: nats-data, namespace: fair-platform }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata: { name: connaisseur-webhook }
webhooks:
  - name: connaisseur-svc.connaisseur.svc
    failurePolicy: Fail
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: fair-platform }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: iam-ingress-from-gateway, namespace: fair-platform }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: iam } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: gateway } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: posture-scanner, namespace: fair-platform }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: posture-scanner } }
  policyTypes: [Ingress, Egress]
  egress: [{ ports: [{ port: 53, protocol: UDP }] }]
---
apiVersion: v1
kind: Service
metadata: { name: iam, namespace: fair-platform, annotations: { fixture/tls: good } }
spec: { ports: [{ name: https, port: 443, protocol: TCP }] }
---
apiVersion: v1
kind: Service
metadata: { name: posture, namespace: fair-platform, annotations: { fixture/tls: good } }
spec: { ports: [{ name: scanner, port: 9443 }] }
---
apiVersion: v1
kind: Pod
metadata:
  name: iam-58d6c9f7b-p2rtz
  namespace: fair-platform
  labels: { app.kubernetes.io/name: iam, pod-template-hash: 58d6c9f7b }
  ownerReferences: [{ apiVersion: apps/v1, kind: ReplicaSet, name: iam-58d6c9f7b, uid: c1 }]
spec:
  securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: iam
      image: ghcr.io/rformer/fair-iam@sha256:1111111111111111111111111111111111111111111111111111111111111111
      args: [serve, --listen=:8443]
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
status:
  containerStatuses:
    - name: iam
      imageID: docker.io/rformer/fair-iam@sha256:1111111111111111111111111111111111111111111111111111111111111111
---
apiVersion: v1
kind: Pod
metadata:
  name: posture-scanner-7b8c5d6f9-wq2mn
  namespace: fair-platform
  labels: { app.kubernetes.io/name: posture-scanner, pod-template-hash: 7b8c5d6f9 }
  ownerReferences: [{ apiVersion: apps/v1, kind: ReplicaSet, name: posture-scanner-7b8c5d6f9, uid: c2 }]
spec:
  securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: scanner
      image: ghcr.io/rformer/fair-posture-scanner@sha256:2222222222222222222222222222222222222222222222222222222222222222
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
status:
  containerStatuses:
    - name: scanner
      imageID: sha256:2222222222222222222222222222222222222222222222222222222222222222
