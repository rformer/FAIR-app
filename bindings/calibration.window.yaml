# F-004 T-02: binding for calibration.window: calibration score window (F-004 design §7).
setting: calibration.window
type: duration
direction: higher_is_stricter
bu_scopable: false
profiles:
  fedramp-moderate:
    default: "365d"
    bound: { min: "30d" }
    platform_choice: "Calibration scores (F-004 AC-23): the last year of answers; at least 30 days"
  cmmc-l2-r2:
    default: "365d"
    bound: { min: "30d" }
    platform_choice: "Not a security parameter of 800-171; matches FedRAMP Moderate"
  enterprise-baseline:
    default: "365d"
    bound: { min: "30d" }
    platform_choice: "Matches FedRAMP Moderate"
