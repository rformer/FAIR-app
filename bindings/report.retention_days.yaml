# F-010 T-02: binding for report.retention_days: SI-12; days generated report files are kept (F-010 design §4).
setting: report.retention_days
type: int
direction: lower_is_stricter
bu_scopable: false
profiles:
  fedramp-moderate:
    default: 30
    bound: { max: 365 }
    platform_choice: "Report files are kept 30 days, at most a year; their audit records and digests remain (F-010 OQ8)"
  cmmc-l2-r2:
    default: 30
    bound: { max: 365 }
    platform_choice: "Matches FedRAMP Moderate"
  enterprise-baseline:
    default: 30
    bound: { max: 365 }
    platform_choice: "Matches FedRAMP Moderate"
