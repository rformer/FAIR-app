# F-002 T-04: binding for audit.retention_online: How long audit records stay searchable (AU-11); F-002 AC-25, AC-28.
setting: audit.retention_online
type: duration
direction: higher_is_stricter
bu_scopable: false
# F-002 T-19 (AC-28): any shortening, even within the bound, needs an
# explanation and a second approver.
loosening_needs_approval: true
hard_floor: "90d"
params:
  - catalog: nist-sp-800-53-r5
    param: au-11_odp
profiles:
  fedramp-moderate:
    default: "365d"
    bound: { min: "365d" }
    source: { param: au-11_odp, constraint: "a time period in compliance with M-21-31" }
  cmmc-l2-r2:
    default: "365d"
    bound: { min: "365d" }
    platform_choice: "800-171 Rev 2 3.3.1 (AU-11) leaves the period open; matches FedRAMP Moderate (OMB M-21-31: 12 months in active storage)"
  enterprise-baseline:
    default: "365d"
    bound: { min: "90d" }
    platform_choice: "Enterprise Baseline relaxation: down to the 90-day hard floor"
