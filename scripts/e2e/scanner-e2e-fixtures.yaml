# Fixtures for scripts/k8s-e2e-scanner.sh (F-015 T-27): the platform
# namespace (restricted pod security, default deny), a stand-in for posture's
# scanner channel, and a decoy pod the scanner must not reach.
apiVersion: v1
kind: Namespace
metadata:
  name: __NS__
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: __NS__ }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: posture, namespace: __NS__ }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: posture } }
  template:
    metadata: { labels: { app.kubernetes.io/name: posture } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: sink
          image: fair-scanner-sink:e2e
          ports: [{ containerPort: 9443 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tls, mountPath: /tls, readOnly: true }]
      volumes: [{ name: tls, secret: { secretName: posture-tls } }]
---
apiVersion: v1
kind: Service
metadata: { name: posture, namespace: __NS__ }
spec:
  selector: { app.kubernetes.io/name: posture }
  ports: [{ name: scanner, port: 9443, targetPort: 9443 }]
---
apiVersion: v1
kind: Pod
metadata: { name: decoy, namespace: __NS__, labels: { app.kubernetes.io/name: decoy } }
spec:
  automountServiceAccountToken: false
  securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: http
      image: busybox:1.36
      command: [httpd, -f, -p, "8080", -h, /tmp]
      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
# T-28: a platform workload that breaks several checks on purpose:
# plaintext on a platform TLS port, an inline password, a writable root
# filesystem, and a volume on kind's unencrypted local-path class.
apiVersion: apps/v1
kind: Deployment
metadata: { name: e2e-bad, namespace: __NS__ }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: e2e-bad } }
  template:
    metadata: { labels: { app.kubernetes.io/name: e2e-bad, app.kubernetes.io/part-of: fair-platform } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: http
          image: busybox:1.36
          command: [httpd, -f, -p, "8443", -h, /tmp]
          env: [{ name: DB_PASSWORD, value: hunter2 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: e2e-bad, namespace: __NS__ }
spec:
  selector: { app.kubernetes.io/name: e2e-bad }
  ports: [{ name: https, port: 8443, targetPort: 8443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: e2e-bad-ingress-from-scanner, namespace: __NS__ }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: e2e-bad } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: posture-scanner } } }], ports: [{ port: 8443 }] }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: e2e-data, namespace: __NS__ }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: decoy-ingress-any, namespace: __NS__ }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: decoy } }
  policyTypes: [Ingress]
  ingress: [{}]
