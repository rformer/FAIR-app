# F-012 T-07 (F-012-AC-11, AC-12; design §3.4): the release pipeline. On a
# vX.Y.Z tag every artifact is built from that tag and checked, and nothing
# is published unless every job before publish passed:
#   plan          the version, the repositories, the signing key
#   reproducible  every image built twice on two runners, digests equal (AC-10)
#   build         every image through the image gates (.github/actions/image),
#                 pushed by digest to the staging repository, keyless-signed
#                 with its SBOM attested
#   provenance    SLSA Build L3 provenance for every staged image
#   manifest      the release manifest (registry digests, RBAC hashes, the
#                 engine's validation record), the OSCAL component definition,
#                 the OpenAPI bundle, fair-audit-verify, the SBOMs; the
#                 fleet's per-release manifests (releasegen fleet, F-012
#                 T-15) pushed to staging as an OCI artifact, keyless-signed;
#                 the third-party images verified against their publishers'
#                 identities and copied by digest to staging's mirror/
#   chart         the fair-platform chart (releasegen chart, F-014 T-06),
#                 pushed to staging as an OCI artifact and keyless-signed
#                 (F-014 T-10)
#   release-checklist  profilegen release-check (F-015 T-07), with -chart:
#                 every option combination gated (F-014 T-09)
#   bench         the benchmark gate (bench.yml)
#   upgrade       the upgrade test from earlier releases (upgrade.yml, AC-13)
#   notes         releasegen notes since the previous release
#   sign          the release key: images, attestations, the fleet artifact,
#                 the mirrored third-party images, the chart, profile
#                 packages, manifest, SHA256SUMS; then the air-gap package
#                 (scripts/airgap-package.sh: Zarf, zarf package sign, the
#                 signed package manifest) (release-sign.yml)
#   package       the air-gap package's keyless signature, and the package
#                 gate (profilegen release-check -package, F-014 T-09/T-10)
#   publish       images, mirrored images, the fleet artifact and the chart copied from
#                 staging to the release repository with their signatures,
#                 then the GitHub release with every file and the package
#   verify        scripts/verify-release.sh on what was published, online and
#                 offline; the chart's signatures; the package with fairctl
#                 verify and its tarball's signatures
#
# The v0.0.0-test tag is the dry run (T-07's verification): it runs every
# job, publishes images under ghcr.io/<owner>/test/ and the GitHub release as
# a draft, and signs with a throwaway key while the KMS key does not exist
# (T-12). Any other tag needs the KMS key, or signing fails.
# F-012 T-01: every action is pinned to a full commit (cmd/pincheck); Dependabot updates them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFIPS140: v1.0.0
  CGO_ENABLED: "0"
  # F-012 T-15: pushes the fleet's per-release manifests (flux push artifact).
  FLUX_CLI_IMAGE: ghcr.io/fluxcd/flux-cli:v2.10.0@sha256:1a5178b1770052d6e88ab1c7c8434c5ac9bca8a8ab984dcaf6b9df31814ce9f2

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dry-run: ${{ steps.plan.outputs.dry-run }}
      test-key: ${{ steps.plan.outputs.test-key }}
      staging: ${{ steps.plan.outputs.staging }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - id: plan
        env:
          KMS_KEY: ${{ vars.FAIR_RELEASE_KMS_KEY }}
        run: |
          v="$GITHUB_REF_NAME"
          [[ "$v" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "$v is not a semantic version tag (vX.Y.Z[-pre])"; exit 1; }
          owner="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          dry=false; release="$owner"
          if [ "$v" = v0.0.0-test ]; then dry=true; release="$owner/test"; fi
          test_key=false
          if [ -z "$KMS_KEY" ]; then
            [ "$dry" = true ] || { echo "no release key (FAIR_RELEASE_KMS_KEY): only the v0.0.0-test dry run may sign without it"; exit 1; }
            test_key=true
          fi
          {
            echo "version=$v"; echo "dry-run=$dry"; echo "test-key=$test_key"
            echo "staging=$owner/staging"; echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "release $v: staging $owner/staging, release $release, dry run $dry, test key $test_key"

  reproducible:
    needs: [plan]
    uses: ./.github/workflows/reproducible.yml

  build:
    needs: [plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # F-014 T-10: fairctl (the chart's hooks) and the bundled dependencies
        # (T-07) are release images too: the chart names them all.
        component: [iam, gateway, posture, posture-scanner, fips-probe, audit, risk, notify, integrate, engine-gate, engine,
          fairctl, postgres, nats, openbao, versitygw, keycloak]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ${{ needs.plan.outputs.staging }}/fair-${{ matrix.component }}
      VERSION: ${{ needs.plan.outputs.version }}
    outputs:
      digest-iam: ${{ steps.push.outputs.digest-iam }}
      digest-gateway: ${{ steps.push.outputs.digest-gateway }}
      digest-posture: ${{ steps.push.outputs.digest-posture }}
      digest-posture-scanner: ${{ steps.push.outputs.digest-posture-scanner }}
      digest-fips-probe: ${{ steps.push.outputs.digest-fips-probe }}
      digest-audit: ${{ steps.push.outputs.digest-audit }}
      digest-risk: ${{ steps.push.outputs.digest-risk }}
      digest-notify: ${{ steps.push.outputs.digest-notify }}
      digest-integrate: ${{ steps.push.outputs.digest-integrate }}
      digest-engine-gate: ${{ steps.push.outputs.digest-engine-gate }}
      digest-engine: ${{ steps.push.outputs.digest-engine }}
      digest-fairctl: ${{ steps.push.outputs.digest-fairctl }}
      digest-postgres: ${{ steps.push.outputs.digest-postgres }}
      digest-nats: ${{ steps.push.outputs.digest-nats }}
      digest-openbao: ${{ steps.push.outputs.digest-openbao }}
      digest-versitygw: ${{ steps.push.outputs.digest-versitygw }}
      digest-keycloak: ${{ steps.push.outputs.digest-keycloak }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: ./.github/actions/image
        with:
          component: ${{ matrix.component }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.VERSION }}
          version: ${{ env.VERSION }}
      - name: Push to staging
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"
          ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest-${{ matrix.component }}=${ref#*@}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Keyless signature and SBOM attestation
        run: |
          cosign sign --yes "${{ steps.push.outputs.ref }}"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.component }}.spdx.json" "${{ steps.push.outputs.ref }}"

  provenance:
    needs: [plan, build]
    strategy:
      fail-fast: true
      matrix:
        # F-014 T-10: fairctl (the chart's hooks) and the bundled dependencies
        # (T-07) are release images too: the chart names them all.
        component: [iam, gateway, posture, posture-scanner, fips-probe, audit, risk, notify, integrate, engine-gate, engine,
          fairctl, postgres, nats, openbao, versitygw, keycloak]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.plan.outputs.staging }}/fair-${{ matrix.component }}
      digest: ${{ needs.build.outputs[format('digest-{0}', matrix.component)] }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # The manifest and the release's files. Images are named in the release
  # repository (where they are copied to on publish, digests unchanged);
  # staging.json names them where they are now, for signing.
  manifest:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DIGESTS: ${{ toJSON(needs.build.outputs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: sbom-*
          merge-multiple: true
          path: release
      - name: Image lists
        run: |
          echo "$DIGESTS" | jq --arg p "${{ needs.plan.outputs.release }}" 'with_entries(.key |= ltrimstr("digest-") | .value = "\($p)/fair-\(.key)@\(.value)")' > release/images.json
          echo "$DIGESTS" | jq --arg p "${{ needs.plan.outputs.staging }}" 'with_entries(.key |= ltrimstr("digest-") | .value = "\($p)/fair-\(.key)@\(.value)")' > release/staging.json
          [ "$(jq length release/images.json)" -eq 17 ] || { echo "expected 17 images"; cat release/images.json; exit 1; }
          cat release/images.json
      - name: The engine's validation record (from the staged image)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="$(jq -r .engine release/staging.json)"
          docker pull -q "$ref"
          c="$(docker create "$ref")"
          docker cp "$c:/engine/validation.json" release/engine-validation.json
          docker rm "$c"
      # F-012 T-15 (AC-19; design §3.6, amended 2026-11-26): each third-party
      # image (deploy/third-party-images.json) is verified against its
      # publisher's exact identity (with cosign 2.6.4 by digest, which reads
      # the publishers' Sigstore bundles; 2.5 does not), then copied by digest
      # to staging's mirror/<name>; release-sign.yml signs the copy with the
      # release key. mirror.json names each copy in staging and in the
      # release repository; the release manifest's mirrors section records
      # each copy and the identity verified (F-014 T-10, design §3.17).
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Third-party images (verified, mirrored)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING: ${{ needs.plan.outputs.staging }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo '{}' > release/mirror.json
          jq -c '.images[]' deploy/third-party-images.json | while read -r i; do
            name="$(jq -r .name <<<"$i")"; image="$(jq -r .image <<<"$i")"
            repo="${image%@*}"; repo="${repo%:*}"; digest="${image#*@}"
            docker run --rm ghcr.io/sigstore/cosign/cosign:v2.6.4@sha256:278d0b6c728608731d8fa2123c00c8b8dd6207aa53f079b195dea906b29ab0b2 verify \
              --certificate-identity "$(jq -r .certificate_identity <<<"$i")" \
              --certificate-oidc-issuer "$(jq -r .certificate_oidc_issuer <<<"$i")" "$repo@$digest" >/dev/null
            cosign copy --force "$repo@$digest" "$STAGING/mirror/$name:$VERSION"
            jq --arg n "$name" --arg src "$repo@$digest" --arg s "$STAGING/mirror/$name@$digest" --arg r "$RELEASE/mirror/$name@$digest" \
              '.[$n] = {source: $src, staging: $s, release: $r}' release/mirror.json > release/mirror.json.new
            mv release/mirror.json.new release/mirror.json
            echo "verified $image as its publisher's; mirrored to $STAGING/mirror/$name@$digest"
          done
          cat release/mirror.json
      - name: Release manifest
        run: go run ./cmd/releasegen manifest -release "$VERSION" -images release/images.json -engine-validation release/engine-validation.json -mirrors release/mirror.json -out release/release-manifest.json
      # F-012 T-15 (AC-18; design §3.6): the platform's manifests as the fleet
      # reconciles them (internal/fleet), the images named in the release
      # repository by digest; pushed to staging and keyless-signed like the
      # images, signed with the release key by release-sign.yml and copied
      # to the release repository by publish. fleet.json names it in both.
      - name: Fleet manifests (OCI artifact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING: ${{ needs.plan.outputs.staging }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          go run ./cmd/releasegen fleet -release "$VERSION" -images release/images.json -mirror-prefix "$RELEASE/mirror" -out "$RUNNER_TEMP/fleet"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP/fleet" -czf "release/fair-fleet-$VERSION.tar.gz" .
          out="$(docker run --rm -v "$RUNNER_TEMP/fleet:/fleet:ro" "$FLUX_CLI_IMAGE" push artifact \
            "oci://$STAGING/fair-manifests:$VERSION" --path=/fleet --reproducible \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision="$VERSION@sha1:$GITHUB_SHA" \
            --creds "${{ github.actor }}:$GH_TOKEN" 2>&1)"
          echo "$out"
          digest="$(echo "$out" | grep -o 'sha256:[0-9a-f]\{64\}' | tail -1)"
          [ -n "$digest" ] || { echo "no digest from flux push artifact"; exit 1; }
          jq -n --arg s "$STAGING/fair-manifests@$digest" --arg r "$RELEASE/fair-manifests@$digest" \
            '{staging: $s, release: $r}' > release/fleet.json
          cat release/fleet.json
      - name: Keyless signature of the fleet manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "$(jq -r .staging release/fleet.json)"
      - name: OSCAL component definition
        run: go run ./cmd/releasegen component-definition -version "$VERSION" -source-date "$(git log -1 --format=%ct)" -out release/component-definition.json
      - name: OpenAPI bundle
        run: |
          bash scripts/openapi-bundle.sh "$VERSION" "$RUNNER_TEMP/openapi"
          rm "$RUNNER_TEMP/openapi/SHA256SUMS" # SHA256SUMS of the release covers them
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP/openapi" -czf "release/fair-openapi-$VERSION.tar.gz" .
      - name: fair-audit-verify
        run: |
          bash scripts/audit-verify-dist.sh "$VERSION" "$RUNNER_TEMP/audit-verify"
          rm "$RUNNER_TEMP/audit-verify/SHA256SUMS"
          cp "$RUNNER_TEMP/audit-verify"/fair-audit-verify-* release/
      # F-014 T-12 (design §3.4): the installer for each platform.
      - name: fairctl
        run: |
          bash scripts/fairctl-dist.sh "$VERSION" "$RUNNER_TEMP/fairctl"
          rm "$RUNNER_TEMP/fairctl/SHA256SUMS"
          cp "$RUNNER_TEMP/fairctl"/fairctl-* release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/

  # F-014 T-10 (AC-01, AC-04; design §3.1): the fair-platform chart, rendered
  # from the same reference manifests (releasegen chart), every image by the
  # release's digest under global.registry (default: the release
  # repository); pushed to staging's charts/ as an OCI artifact with the Helm
  # SDK and keyless-signed; release-sign.yml signs it with the release key,
  # publish copies it to <release>/charts/fair-platform:<version>.
  chart:
    needs: [plan, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      STAGING: ${{ needs.plan.outputs.staging }}
      RELEASE: ${{ needs.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-files
          path: release
      - name: Chart
        run: |
          go run ./cmd/releasegen chart -release "$VERSION" -images release/images.json -registry "$RELEASE" \
            -manifest release/release-manifest.json -out "$RUNNER_TEMP/chart" -package release-chart
          ls release-chart
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Push to staging and sign keylessly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          go run ./cmd/releasegen push-chart -chart release-chart/fair-platform-*.tgz -repository "oci://$STAGING/charts" \
            -source-date "$(git log -1 --format=%ct)" -out "$RUNNER_TEMP/pushed.json"
          staging="$(jq -r .ref "$RUNNER_TEMP/pushed.json")"
          jq -n --arg s "$staging" --arg r "$RELEASE/charts/fair-platform@$(jq -r .digest "$RUNNER_TEMP/pushed.json")" \
            --arg t "$(jq -r .tag "$RUNNER_TEMP/pushed.json" | sed 's/.*://')" '{staging: $s, release: $r, tag: $t}' > release-chart/chart.json
          cat release-chart/chart.json
          cosign sign --yes "$staging"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-chart
          path: release-chart/

  release-checklist:
    needs: [manifest, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-files
          path: release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-chart
          path: release-chart
      # Pins match MANIFEST.json, profiles and packages rebuild byte for byte,
      # and the CMMC rule's 800-171 revision is re-confirmed against the eCFR
      # (32 CFR part 170); any amendment since the recorded confirmation fails.
      # Open external pen-test findings block too (security/pentest-findings.yaml).
      # The engine image passed its validation suite (F-005 T-09).
      # F-014 T-09: every combination of the chart's switches and choices
      # renders, passes F-015's checks on a compliant cluster, and names only
      # the manifest's images (or its mirrors) and RBAC.
      - name: Release checklist
        run: go run ./cmd/profilegen release-check -online -report release-checklist.md -manifest release/release-manifest.json -chart release-chart/fair-platform-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-checklist
          path: release-checklist.md

  bench:
    needs: [plan]
    uses: ./.github/workflows/bench.yml

  upgrade:
    needs: [plan]
    uses: ./.github/workflows/upgrade.yml
    with:
      engine: true

  notes:
    needs: [plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Release notes since the previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The previous release: the newest vX.Y.Z tag before this one (the
          # dry-run tag is never one); none before the first release (D-OQ3).
          prev="$(git tag --list 'v*' --merged "$VERSION^" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$VERSION" | head -1 || true)"
          from="${prev:-4b825dc642cb6eb9a060e54bf8d69288fbee4904}"
          since="$( [ -n "$prev" ] && git log -1 --format=%cI "$prev" || echo 1970-01-01T00:00:00Z)"
          gh pr list --state merged --label security --limit 200 --search "merged:>=$since" --json number,title,url > security-prs.json
          mkdir -p release
          go run ./cmd/releasegen notes -from "$from" -to "$VERSION" -prs security-prs.json -out release/release-notes.md
          echo "notes from ${prev:-the start} to $VERSION"
      # F-014 T-10 (design §3.1, §3.10): the air-gap package carries the
      # notes of every release it upgrades from, and its upgrade window.
      - name: Upgrade window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-window.sh "$VERSION" window
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-window
          path: window/

  sign:
    needs: [plan, reproducible, provenance, manifest, chart, release-checklist, bench, upgrade, notes]
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/release-sign.yml
    with:
      pattern: release-{files,notes,chart}
      test-key: ${{ needs.plan.outputs.test-key == 'true' }}
      package: true
      version: ${{ needs.plan.outputs.version }}
      release-repository: ${{ needs.plan.outputs.release }}
      staging-repository: ${{ needs.plan.outputs.staging }}

  # F-014 T-10 (AC-02; design §3.1): the air-gap package release-sign.yml
  # built and signed with the release key, signed keylessly here (the
  # release workflow's identity), then gated: verified offline with the
  # release key and its chart checked in every combination against the
  # package's own manifest and images (profilegen release-check -package).
  package:
    needs: [plan, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-signed
          path: release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-package
          path: package
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Keyless signature of the package
        run: |
          p="package/fair-$VERSION-airgap.tar"
          cosign verify-blob --key release/cosign.pub --insecure-ignore-tlog --signature "$p.sig" "$p"
          cosign sign-blob --yes --bundle "$p.sigstore.json" "$p"
      - name: Package gate
        run: |
          go run ./cmd/profilegen release-check -report package-check.md \
            -package "package/fair-$VERSION-airgap.tar" -key release/cosign.pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: package-check
          path: package-check.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-signed
          path: package/

  publish:
    needs: [plan, sign, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-signed
          path: release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-package-signed
          path: release
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Copy the images and their signatures to the release repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          for c in $(jq -r 'keys[]' release/staging.json); do
            src="$(jq -r --arg c "$c" '.[$c]' release/staging.json)"
            dst="$(jq -r --arg c "$c" '.[$c]' release/images.json)"
            # GHCR can refuse writes for a moment to a package the copy has just
            # created (seen on the v0.0.0-test dry run); copying again is safe.
            for attempt in 1 2 3 4; do
              cosign copy --force "$src" "${dst%@*}:$VERSION" && break
              [ "$attempt" = 4 ] && exit 1
              echo "copy of $c refused; retrying in $((attempt * 20)) s"
              sleep $((attempt * 20))
            done
            echo "$src -> ${dst%@*}:$VERSION"
          done
          # The mirrored third-party images (F-012 T-15), signed with the release key.
          for n in $(jq -r 'keys[]' release/mirror.json); do
            src="$(jq -r --arg n "$n" '.[$n].staging' release/mirror.json)"
            dst="$(jq -r --arg n "$n" '.[$n].release' release/mirror.json)"
            for attempt in 1 2 3 4; do
              cosign copy --force "$src" "${dst%@*}:$VERSION" && break
              [ "$attempt" = 4 ] && exit 1
              echo "copy of $n refused; retrying in $((attempt * 20)) s"
              sleep $((attempt * 20))
            done
            echo "$src -> ${dst%@*}:$VERSION"
          done
          # The fleet's manifests (F-012 T-15): Flux pulls them by this tag.
          src="$(jq -r .staging release/fleet.json)"
          dst="$(jq -r .release release/fleet.json)"
          for attempt in 1 2 3 4; do
            cosign copy --force "$src" "${dst%@*}:$VERSION" && break
            [ "$attempt" = 4 ] && exit 1
            echo "copy of the fleet manifests refused; retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          echo "$src -> ${dst%@*}:$VERSION"
          # The chart (F-014 T-10): oci://<release>/charts/fair-platform:<version>.
          src="$(jq -r .staging release/chart.json)"
          dst="$(jq -r .release release/chart.json)"
          tag="$(jq -r .tag release/chart.json)"
          for attempt in 1 2 3 4; do
            cosign copy --force "$src" "${dst%@*}:$tag" && break
            [ "$attempt" = 4 ] && exit 1
            echo "copy of the chart refused; retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          echo "$src -> ${dst%@*}:$tag"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ needs.plan.outputs.dry-run }}
        run: |
          rm release/staging.json
          flags=()
          if [ "$DRY_RUN" = true ]; then flags+=(--draft --prerelease); fi
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$VERSION" --repo "${{ github.repository }}" --verify-tag \
            --title "FAIR $VERSION" --notes-file release/release-notes.md "${flags[@]}" release/*

  verify:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-signed
          path: release
      - name: releasegen
        run: go build -o "$RUNNER_TEMP/bin/releasegen" ./cmd/releasegen && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify the published release (online)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          bash scripts/verify-release.sh release
      - name: Verify the fleet manifests (F-012 T-15)
        run: |
          ref="$(jq -r .release release/fleet.json)"
          cosign verify --key release/cosign.pub "$ref" >/dev/null
          cosign verify --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" >/dev/null
          echo "ok - fleet manifests $ref: release key and keyless signatures"
          for n in $(jq -r 'keys[]' release/mirror.json); do
            ref="$(jq -r --arg n "$n" '.[$n].release' release/mirror.json)"
            cosign verify --key release/cosign.pub "$ref" >/dev/null
            echo "ok - mirrored $n $ref: release key"
          done
      - name: Verify the chart (F-014 T-10)
        run: |
          ref="$(jq -r .release release/chart.json)"
          cosign verify --key release/cosign.pub "$ref" >/dev/null
          cosign verify --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" >/dev/null
          echo "ok - chart $ref: release key and keyless signatures"
      - name: Verify it as an air-gapped bundle carries it (offline)
        run: |
          for c in $(jq -r 'keys[]' release/images.json); do
            cosign save --dir "release/images/$c" "$(jq -r --arg c "$c" '.[$c]' release/images.json)"
          done
          for n in $(jq -r 'keys[]' release/mirror.json); do
            cosign save --dir "release/images/$n" "$(jq -r --arg n "$n" '.[$n].release' release/mirror.json)"
          done
          bash scripts/verify-release.sh -offline release
      # F-014 T-10 (AC-02, AC-07): the air-gap package as published: its
      # tarball's release-key and keyless signatures, then fairctl verify
      # (offline, the release key pinned, the images read from the Zarf
      # package).
      - name: Verify the air-gap package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p package
          p="fair-$VERSION-airgap.tar"
          gh release download "$VERSION" --repo "${{ github.repository }}" --dir package --pattern "$p" --pattern "$p.sig" --pattern "$p.sigstore.json"
          cosign verify-blob --key release/cosign.pub --insecure-ignore-tlog --signature "package/$p.sig" "package/$p"
          cosign verify-blob --bundle "package/$p.sigstore.json" \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "package/$p"
          tar -C package -xf "package/$p"
          go run ./cmd/fairctl verify -key release/cosign.pub "package/fair-$VERSION-airgap"
