# F-015 T-07: release checklist gate. Runs on every release tag. Later
# release jobs (packaging, signing with the release key per F-015 D-OQ5,
# publishing; F-012) must declare `needs: [release-checklist]`.
# TODO(F-012): pin every action to a full commit SHA (Dependabot updates them).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFIPS140: v1.0.0
  CGO_ENABLED: "0"

jobs:
  # F-005 T-09 (AC-21, design §3.6): the engine image's build runs the
  # validation suite; its record goes into the release manifest, which the
  # checklist requires to show a pass.
  # TODO(F-012): the published manifest names every image by registry digest
  # and is signed; this one names the engine by its built image ID.
  engine-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - name: Build the engine image (runs the validation suite)
        run: docker build --load --target engine -t fair-engine:release .
      - name: Release manifest with the engine's validation record
        run: |
          id="$(docker image inspect -f '{{.Id}}' fair-engine:release)"
          c="$(docker create fair-engine:release)"
          docker cp "$c:/engine/validation.json" engine-validation.json
          docker rm "$c"
          printf '{"engine": "fair-engine@%s"}' "$id" > images.json
          go run ./cmd/releasegen manifest -release "${GITHUB_REF_NAME}" -images images.json -engine-validation engine-validation.json -out release-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: |
            release-manifest.json
            engine-validation.json

  release-checklist:
    needs: [engine-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      # Pins match MANIFEST.json, profiles and packages rebuild byte for byte,
      # and the CMMC rule's 800-171 revision is re-confirmed against the eCFR
      # (32 CFR part 170); any amendment since the recorded confirmation fails.
      # Open external pen-test findings block too (security/pentest-findings.yaml).
      # The engine image passed its validation suite (F-005 T-09).
      - uses: actions/download-artifact@v7
        with:
          name: release-manifest
      - name: Release checklist
        run: go run ./cmd/profilegen release-check -online -report release-checklist.md -manifest release-manifest.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-checklist
          path: release-checklist.md

  # F-001 T-42 (design §6): the OpenAPI documents, linted and stamped with the
  # release, with a SHA-256 manifest. The release publishing job (F-012)
  # attaches this artifact to the release.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/spectral/package-lock.json
      - name: Spectral lint and rule self-test
        run: bash scripts/openapi-lint.sh
      - name: Stamp the documents with the release
        run: bash scripts/openapi-bundle.sh "${GITHUB_REF_NAME}" openapi-dist
      - uses: actions/upload-artifact@v7
        with:
          name: openapi-${{ github.ref_name }}
          path: openapi-dist/

  # F-002 T-10 (design §11): fair-audit-verify for auditors' platforms, with
  # the FIPS 140 module, and SHA256SUMS. The release publishing job (F-012)
  # attaches this artifact to the release; the audit image carries the tool
  # too, for air-gapped bundles.
  audit-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Offline verifier tests (tamper corpus, no network)
        run: go test -count=1 ./internal/audit/evidence/... ./cmd/audit-verify/
      - name: Build
        run: bash scripts/audit-verify-dist.sh "${GITHUB_REF_NAME}" audit-verify-dist
      - uses: actions/upload-artifact@v7
        with:
          name: fair-audit-verify-${{ github.ref_name }}
          path: audit-verify-dist/
