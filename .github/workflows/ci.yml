# Minimal CI for iam + authz (F-001 T-00c). Full platform CI/CD is F-012.
#
# Gates: gofmt/vet/lint, govulncheck, unit tests in FIPS mode, integration
# tests on PostgreSQL 16 + NATS JetStream, FIPS image build, non-root and
# read-only checks, SBOM, and (on main) keyless signing + provenance.
#
# Actions are pinned to commit SHAs (resolved 2026-10-25); Dependabot bumps them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: stable
  GOFLAGS: -mod=readonly
  IMAGE: ghcr.io/${{ github.repository_owner }}/fair-iam

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet -tags integration ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags integration
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...

  test:
    runs-on: ubuntu-latest
    env:
      GODEBUG: fips140=on
      FAIR_REQUIRE_FIPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests (FIPS mode, race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: FIPS module build
        run: GOFIPS140=v1.0.0 CGO_ENABLED=0 go build -o /tmp/iam ./cmd/iam && /tmp/iam version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pgadmin
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pgadmin" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GODEBUG: fips140=on
      FAIR_TEST_PG_ADMIN_URL: postgres://pgadmin:ci-only-throwaway@127.0.0.1:5432/postgres
      FAIR_TEST_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Start NATS with JetStream
        # Service containers cannot take arguments, so run NATS directly.
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.11-alpine -js
          for i in $(seq 1 20); do nc -z 127.0.0.1 4222 && break; sleep 1; done
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Integration tests (T-02 roles + migrations, RLS bypass, JetStream sink)
        run: go test -tags integration -count=1 -v ./test/integration/...

  image:
    runs-on: ubuntu-latest
    needs: [lint, test, integration]
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing (Sigstore) + provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (FIPS)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fair-iam:ci
          build-args: VERSION=${{ github.sha }}
      - name: Image runs non-root with a read-only root filesystem, FIPS on
        run: |
          user=$(docker inspect -f '{{.Config.User}}' fair-iam:ci)
          echo "image user: $user"
          case "$user" in ""|0|0:*|root|root:*) echo "image runs as root"; exit 1;; esac
          docker run -d --name iam --read-only --cap-drop=ALL --security-opt no-new-privileges \
            -p 8080:8080 fair-iam:ci serve
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/version | tee /tmp/version.json
          grep -q '"fips140":true' /tmp/version.json
          [ "$(docker inspect -f '{{.State.Running}}' iam)" = "true" ]
          docker logs iam | grep -q '"type":"service.started"'
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: fair-iam:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Push, sign and attest (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Cosign keyless sign + SBOM attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
