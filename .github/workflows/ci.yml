# F-001 T-00c: minimal CI. Extended by F-012 (full platform pipeline).
# Least privilege: read-only by default; publishing jobs request only what they need.
# F-012 T-01: every action is pinned to a full commit (cmd/pincheck); Dependabot updates them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its run; on main each commit
# has its own group, so every run starts at once and completes, and each
# change gets its full set of results (F-012 T-03, T-04). (One group for
# main queued each run behind the last and dropped the queued one on the
# next push.)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFIPS140: v1.0.0
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      # Service containers cannot take arguments, and JetStream needs -js.
      - name: Start NATS JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.10@sha256:5498ba57b9471840be3d15b033a4eec554d1c02fa6c2cc0ca2d888637f6c6e2f -js
      # F-002 T-08: an S3-compatible server with Object Lock, over TLS, for
      # the object storage contract tests (internal/objstore; ADR-012).
      - name: Start the S3 test server
        run: |
          eval "$(bash scripts/s3-test-server.sh start)"
          env | grep '^FAIR_TEST_S3' >> "$GITHUB_ENV"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Unit tests (FIPS module, race detector)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Database and worker tests
        env:
          FAIR_TEST_PG: "1"
          FAIR_TEST_NATS: nats://localhost:4222
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin
        run: go test -count=1 -timeout 60m -v ./db/tests/ # as make test-db
      # F-006 T-08: make test-stride also runs the chart modules' unit tests (node --test, type stripping: Node 22.18 or later).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: STRIDE suites (F-015 T-36, design §8; F-001 T-40, design §7)
        env:
          FAIR_TEST_PG: "1"
          FAIR_TEST_NATS: nats://localhost:4222
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin
        run: make test-stride
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  # F-015 T-37 and F-001 T-41: the deployment-mode matrix (F-015 design §11,
  # F-001 design §10), one install per mode.
  deployment-modes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [saas, self-hosted, air-gapped]
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Mode ${{ matrix.mode }}
        env:
          FAIR_TEST_PG: "1"
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin
        run: go test -count=1 -v -run 'TestDeploymentModeMatrix/^${{ matrix.mode }}$' ./db/tests/
      # F-001 T-41: each mode's key delivery (deploy/k8s/keys) matches the key
      # layout; self-hosted also delivers through a live OpenBao.
      - name: Key delivery manifests
        run: go test -count=1 -v -run 'TestDeployManifests' ./internal/keys/
      - name: Keys through OpenBao (live)
        if: matrix.mode == 'self-hosted'
        run: bash scripts/openbao-e2e.sh

  # F-015 T-27 to T-29, T-37: posture-scanner and fips-probe on a live kind
  # cluster (RBAC, egress, check catalog, node FIPS evidence).
  k8s-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scanner end to end on kind
        run: scripts/k8s-e2e-scanner.sh

  # F-001 T-11: visible_bus + RLS at target scale. Fails when a request-path
  # p95 exceeds 10 ms or regresses past max(3x, +5 ms) of db/bench/baseline.json.
  bench:
    # F-012-AC-02: on main and before every release (the release runs it too).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      # F-005 T-15: the simulation gate runs against the real engine through
      # engine-gate (the production path), on this runner's CPUs. The gate
      # runs as FAIR_ENV=development only so that it reads keys this runner
      # created; its TLS and pinning are those of production.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Simulation engine and engine-gate
        run: |
          docker build --load --target engine -t fair-engine:bench .
          docker build --load --target engine-gate -t fair-engine-gate:bench .
          go run ./cmd/iam keys init -dir "$RUNNER_TEMP/engine-keys" > /dev/null
          chmod -R a+rX "$RUNNER_TEMP/engine-keys/engine-gate"
          docker volume create engine-sock
          docker run --rm -v engine-sock:/v --entrypoint chown postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f 65532:65532 /v
          docker run -d --name engine --network none --read-only --cap-drop ALL -v engine-sock:/run/engine fair-engine:bench serve --socket /run/engine/engine.sock --workers "$(nproc)"
          docker run -d --name engine-gate --read-only --cap-drop ALL -p 8444:8444 -p 8081:8081 -v engine-sock:/run/engine -v "$RUNNER_TEMP/engine-keys/engine-gate/tls:/keys/tls:ro" -e FAIR_ENV=development -e FAIR_ENGINE_GATE_TLS_DIR=/keys/tls fair-engine-gate:bench
          for _ in $(seq 1 60); do curl -fsS http://localhost:8081/readyz && break; sleep 2; done
          curl -fsS http://localhost:8081/readyz
      - name: Benchmark gate
        env:
          FAIR_TEST_PG: "1"
          FAIR_BENCH: "1"
          FAIR_BENCH_BASELINE: ${{ github.workspace }}/db/bench/baseline.json
          FAIR_BENCH_REPORT: ${{ github.workspace }}/bench-report.md
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin
          FAIR_BENCH_ENGINE_ADDR: localhost:8444
          FAIR_BENCH_ENGINE_CLIENT_DIR: ${{ runner.temp }}/engine-keys/risk/engine-client
        run: go test -count=1 -timeout 180m -run TestBenchmarkGate -v ./db/tests/ # F-001, F-002 sequencer, search and export, F-003 risk scenarios, F-004 estimates, F-005 simulation, F-006 result views, F-007 register, F-008 acceptance, F-009 notifications, F-010 reports, F-011 imports, F-013 frameworks gates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-report
          path: bench-report.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      # Pinned: a release built with a Go at least as new as go.mod's (v2
      # config); "latest" once resolved to a binary built with Go 1.24.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # F-012 T-01 (AC-03): actions by commit, images by digest, locks with hashes.
      - name: Every build input pinned
        run: go run ./cmd/pincheck

  # F-010 T-07 (design §3.5): the PDF writer's samples are PDF/UA-1, checked
  # by veraPDF (pinned by digest; CI only, never at runtime).
  pdfua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Write the sample PDFs
        run: |
          mkdir -p "$RUNNER_TEMP/pdf"
          FAIR_PDF_OUT="$RUNNER_TEMP/pdf" go test -count=1 -run 'TestWriteSample' ./internal/report/ ./internal/reports/
          ls -l "$RUNNER_TEMP/pdf"
      - name: veraPDF, PDF/UA-1
        run: |
          docker run --rm -v "$RUNNER_TEMP/pdf:/data:ro" verapdf/cli@sha256:f085855d442ad415e79fabbabcdd1803c2db4ee097cd5b94506c95ecdcfa1728 \
            --flavour ua1 --format text /data/entitlements.pdf /data/unicode.pdf /data/report.pdf /data/charts.pdf | tee verapdf.txt
          ! grep -v '^PASS ' verapdf.txt

  # F-005 T-04 (ADR-013): the engine's lint, format, types and tests with the
  # locked tools, and lock files that regenerate exactly; T-09: the
  # statistical validation suite (scripts/engine-check.sh).
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint, format, types, tests, validation suite
        run: docker run --rm -v "$PWD:/src" -w /src python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df bash scripts/engine-check.sh
      - name: Lock files regenerate exactly
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df bash scripts/engine-lock.sh
          sudo chown -R "$(id -u):$(id -g)" .
          git diff --exit-code -- engine/requirements.lock engine/requirements-dev.lock
      # F-012 T-02 (AC-04): known vulnerabilities in the locked runtime packages.
      - name: Dependency audit (pip-audit over the hashed lock)
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df \
            sh -c 'pip install -q --no-cache-dir pip-audit==2.9.0 && pip-audit --strict --disable-pip --require-hashes -r engine/requirements.lock'

  # F-005 T-03: the generated gRPC code (Go and the engine's Python) is
  # exactly what the protos and the pinned generators produce.
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate the Go code
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.26.11-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0 bash scripts/gen-proto.sh
      - name: Regenerate the Python code
        run: docker run --rm -v "$PWD:/src" -w /src python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df bash scripts/gen-proto-py.sh
      - name: No differences
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          git add -N internal/api engine/fairsim/_proto
          git diff --exit-code -- internal/api engine/fairsim/_proto

  # F-001 T-42 (design §6): the OpenAPI documents pass Spectral (spectral:oas
  # and the platform's conventions), and the convention rules pass their
  # self-test.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/spectral/package-lock.json
      - name: Spectral lint and rule self-test
        run: bash scripts/openapi-lint.sh

  # F-012 T-03 (F-012-AC-05 to AC-07; design §3.2): every image the
  # Dockerfile builds, hardened and checked alike (scripts/image-check.sh:
  # non-root, no shell or package manager, refuses to start unconfigured on a
  # read-only root with no capabilities, FIPS 140 module built in and on; the
  # engine's own checks), with an SBOM, a scan that fails on fixable high or
  # critical findings unless security/vuln-exceptions.yaml accepts them until
  # an expiry, and, on main, pushed, signed and attested. The matrix lists
  # every Dockerfile target (internal/cicheck TestImageMatrixCoversDockerfile).
  images:
    needs: [test, lint, engine]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [iam, gateway, posture, posture-scanner, fips-probe, audit, risk, notify, integrate, engine-gate, engine]
    permissions:
      contents: read
      packages: write   # push to GHCR (main only)
      id-token: write   # keyless cosign signing (main only)
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fair-${{ matrix.component }}
    # Each leg publishes its image's digest under its own key, for the
    # provenance jobs (F-012 T-04).
    outputs:
      digest-iam: ${{ steps.push.outputs.digest-iam }}
      digest-gateway: ${{ steps.push.outputs.digest-gateway }}
      digest-posture: ${{ steps.push.outputs.digest-posture }}
      digest-posture-scanner: ${{ steps.push.outputs.digest-posture-scanner }}
      digest-fips-probe: ${{ steps.push.outputs.digest-fips-probe }}
      digest-audit: ${{ steps.push.outputs.digest-audit }}
      digest-risk: ${{ steps.push.outputs.digest-risk }}
      digest-notify: ${{ steps.push.outputs.digest-notify }}
      digest-integrate: ${{ steps.push.outputs.digest-integrate }}
      digest-engine-gate: ${{ steps.push.outputs.digest-engine-gate }}
      digest-engine: ${{ steps.push.outputs.digest-engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set image tag and source date
        run: |
          echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # F-012 T-05 (AC-10): built as scripts/repro-build.sh builds it.
      - name: Build
        run: |
          docker buildx build --target "${{ matrix.component }}"             --build-arg VERSION="$TAG" --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH"             --output "type=docker,name=$IMAGE:$TAG,rewrite-timestamp=true" .
      - name: Hardening checks
        run: bash scripts/image-check.sh "$IMAGE:$TAG" "${{ matrix.component }}"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
      # F-012 T-04 (AC-08): every module linked into a Go binary, or every
      # locked engine package, is in the SBOM.
      - name: The SBOM lists everything the image contains
        run: bash scripts/sbom-check.sh "sbom-${{ matrix.component }}.spdx.json" "$IMAGE:$TAG" "${{ matrix.component }}"
      - name: Accepted findings (expired or malformed exceptions fail)
        run: go run ./cmd/vulnex -component "${{ matrix.component }}" -out .trivyignore
      - name: Vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.spdx.json
      - name: Push (main only)
        id: push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest-${{ matrix.component }}=${ref#*@}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - name: Cosign keyless sign + SBOM attestation (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cosign sign --yes "${{ steps.push.outputs.ref }}"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.component }}.spdx.json" "${{ steps.push.outputs.ref }}"
      # F-012 T-04 (AC-08, AC-09): what was signed verifies, against this
      # workflow's identity.
      - name: Verify the signature and the SBOM attestation (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          id="https://github.com/${{ github.workflow_ref }}"
          issuer=https://token.actions.githubusercontent.com
          cosign verify --certificate-identity "$id" --certificate-oidc-issuer "$issuer" "${{ steps.push.outputs.ref }}" >/dev/null
          cosign verify-attestation --type spdxjson --certificate-identity "$id" --certificate-oidc-issuer "$issuer" "${{ steps.push.outputs.ref }}" >/dev/null
          echo "verified ${{ steps.push.outputs.ref }}"

  # F-012 T-04 (F-012-AC-08; design §3.3): SLSA Build Level 3 provenance for
  # every image pushed from main, by the SLSA generator's isolated reusable
  # workflow (referenced by release tag, as it requires), then verified.
  provenance:
    needs: [images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        component: [iam, gateway, posture, posture-scanner, fips-probe, audit, risk, notify, integrate, engine-gate, engine]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/fair-${{ matrix.component }}
      digest: ${{ needs.images.outputs[format('digest-{0}', matrix.component)] }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  provenance-verify:
    needs: [images, provenance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [iam, gateway, posture, posture-scanner, fips-probe, audit, risk, notify, integrate, engine-gate, engine]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        env:
          GOFIPS140: ""
        with:
          go-version: "1.26.11"
      - name: slsa-verifier
        env:
          GOFIPS140: ""
        run: go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1
      - name: Verify the provenance (this repository, main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="ghcr.io/${{ github.repository_owner }}/fair-${{ matrix.component }}@${{ needs.images.outputs[format('digest-{0}', matrix.component)] }}"
          "$(go env GOPATH)/bin/slsa-verifier" verify-image "$ref" --source-uri "github.com/${{ github.repository }}" --source-branch main

  # F-015 T-32: the web UI (ADR-003: React + TypeScript, Vite).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      # F-006 T-04: unit tests of the chart modules (Node's own runner, TypeScript by type stripping).
      - name: Unit tests
        run: npm test
      - name: Dependency audit (runtime dependencies, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  # F-012 T-02, T-12 (AC-01, AC-14): the infrastructure code: formatted,
  # valid, and its invariants tested with mock providers (no cloud or GitHub
  # call).
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OpenTofu fmt, validate and test
        run: |
          for d in infra/github; do
            run() { docker run --rm -v "$PWD/$d:/w" -w /w ghcr.io/opentofu/opentofu:1.13.9@sha256:f5aef7f2632b490e3c289a239d7974497d0583f3df6bfa35e8eb31a367ee5ec0 "$@"; }
            run fmt -check -recursive
            run init -input=false -lockfile=readonly >/dev/null
            run validate -no-color
            run test -no-color
          done

  # F-015 T-32, F-012 T-02 (AC-01): every page end to end against the real
  # services, database and simulation engine, with axe WCAG 2.1 AA scans:
  # scripts/ui-e2e.sh, as run locally (the harness in the fair-dbtest
  # container, the engine image built and run beside it, Playwright here).
  ui-e2e:
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test containers (PostgreSQL, NATS, the test image)
        run: |
          docker network create fairtest
          docker run -d --name fairpg --network fairtest -e POSTGRES_PASSWORD=pgtest postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
          docker run -d --name fairnats --network fairtest nats:2.10@sha256:5498ba57b9471840be3d15b033a4eec554d1c02fa6c2cc0ca2d888637f6c6e2f -js
          docker build -q -f scripts/e2e/Dockerfile.dbtest -t fair-dbtest .
      - name: Playwright browser and its system libraries
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: End to end (scripts/ui-e2e.sh)
        run: bash scripts/ui-e2e.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
