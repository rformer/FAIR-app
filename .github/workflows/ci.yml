# F-001 T-00c: minimal CI. Extended by F-012 (full platform pipeline).
# Least privilege: read-only by default; publishing jobs request only what they need.
# TODO(F-012): pin every action to a full commit SHA (Dependabot updates them).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFIPS140: v1.0.0
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      # Service containers cannot take arguments, and JetStream needs -js.
      - name: Start NATS JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.10 -js
      # F-002 T-08: an S3-compatible server with Object Lock, over TLS, for
      # the object storage contract tests (internal/objstore; ADR-012).
      - name: Start the S3 test server
        run: |
          eval "$(bash scripts/s3-test-server.sh start)"
          env | grep '^FAIR_TEST_S3' >> "$GITHUB_ENV"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Unit tests (FIPS module, race detector)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Database and worker tests
        env:
          FAIR_TEST_PG: "1"
          FAIR_TEST_NATS: nats://localhost:4222
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin
        run: go test -count=1 -timeout 60m -v ./db/tests/ # as make test-db
      - name: STRIDE suites (F-015 T-36, design §8; F-001 T-40, design §7)
        env:
          FAIR_TEST_PG: "1"
          FAIR_TEST_NATS: nats://localhost:4222
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin
        run: make test-stride
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # F-015 T-37 and F-001 T-41: the deployment-mode matrix (F-015 design §11,
  # F-001 design §10), one install per mode.
  deployment-modes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [saas, self-hosted, air-gapped]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Mode ${{ matrix.mode }}
        env:
          FAIR_TEST_PG: "1"
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin
        run: go test -count=1 -v -run 'TestDeploymentModeMatrix/^${{ matrix.mode }}$' ./db/tests/
      # F-001 T-41: each mode's key delivery (deploy/k8s/keys) matches the key
      # layout; self-hosted also delivers through a live OpenBao.
      - name: Key delivery manifests
        run: go test -count=1 -v -run 'TestDeployManifests' ./internal/keys/
      - name: Keys through OpenBao (live)
        if: matrix.mode == 'self-hosted'
        run: bash scripts/openbao-e2e.sh

  # F-015 T-27 to T-29, T-37: posture-scanner and fips-probe on a live kind
  # cluster (RBAC, egress, check catalog, node FIPS evidence).
  k8s-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scanner end to end on kind
        run: scripts/k8s-e2e-scanner.sh

  # F-001 T-11: visible_bus + RLS at target scale. Fails when a request-path
  # p95 exceeds 10 ms or regresses past max(3x, +5 ms) of db/bench/baseline.json.
  bench:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      # F-005 T-15: the simulation gate runs against the real engine through
      # engine-gate (the production path), on this runner's CPUs. The gate
      # runs as FAIR_ENV=development only so that it reads keys this runner
      # created; its TLS and pinning are those of production.
      - uses: docker/setup-buildx-action@v4
      - name: Simulation engine and engine-gate
        run: |
          docker build --load --target engine -t fair-engine:bench .
          docker build --load --target engine-gate -t fair-engine-gate:bench .
          go run ./cmd/iam keys init -dir "$RUNNER_TEMP/engine-keys" > /dev/null
          chmod -R a+rX "$RUNNER_TEMP/engine-keys/engine-gate"
          docker volume create engine-sock
          docker run --rm -v engine-sock:/v --entrypoint chown postgres:16 65532:65532 /v
          docker run -d --name engine --network none --read-only --cap-drop ALL -v engine-sock:/run/engine fair-engine:bench serve --socket /run/engine/engine.sock --workers "$(nproc)"
          docker run -d --name engine-gate --read-only --cap-drop ALL -p 8444:8444 -p 8081:8081 -v engine-sock:/run/engine -v "$RUNNER_TEMP/engine-keys/engine-gate/tls:/keys/tls:ro" -e FAIR_ENV=development -e FAIR_ENGINE_GATE_TLS_DIR=/keys/tls fair-engine-gate:bench
          for _ in $(seq 1 60); do curl -fsS http://localhost:8081/readyz && break; sleep 2; done
          curl -fsS http://localhost:8081/readyz
      - name: Benchmark gate
        env:
          FAIR_TEST_PG: "1"
          FAIR_BENCH: "1"
          FAIR_BENCH_BASELINE: ${{ github.workspace }}/db/bench/baseline.json
          FAIR_BENCH_REPORT: ${{ github.workspace }}/bench-report.md
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin
          FAIR_BENCH_ENGINE_ADDR: localhost:8444
          FAIR_BENCH_ENGINE_CLIENT_DIR: ${{ runner.temp }}/engine-keys/risk/engine-client
        run: go test -count=1 -timeout 90m -run TestBenchmarkGate -v ./db/tests/ # F-001, F-002 sequencer, search and export, F-003 risk scenarios, F-004 estimates, F-005 simulation gates
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-report
          path: bench-report.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      # Pinned: a release built with a Go at least as new as go.mod's (v2
      # config); "latest" once resolved to a binary built with Go 1.24.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # F-005 T-04 (ADR-013): the engine's lint, format, types and tests with the
  # locked tools, and lock files that regenerate exactly; T-09: the
  # statistical validation suite (scripts/engine-check.sh).
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint, format, types, tests, validation suite
        run: docker run --rm -v "$PWD:/src" -w /src python:3.12.16-slim-bookworm bash scripts/engine-check.sh
      - name: Lock files regenerate exactly
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.12.16-slim-bookworm bash scripts/engine-lock.sh
          sudo chown -R "$(id -u):$(id -g)" .
          git diff --exit-code -- engine/requirements.lock engine/requirements-dev.lock

  # F-005 T-04 (ADR-013): the engine image is non-root, runs with a read-only
  # root filesystem, has no shell, pins NumPy's CPU dispatch, and passes the
  # vulnerability scan; its SBOM lists every locked dependency.
  engine-image:
    needs: [engine]
    runs-on: ubuntu-latest
    env:
      IMAGE: fair-engine
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: docker build --load --target engine -t "$IMAGE:ci" .
      - name: Verify non-root, read-only root, no shell, CPU dispatch pinned
        run: |
          test "$(docker inspect -f '{{.Config.User}}' "$IMAGE:ci")" = "65532:65532"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges "$IMAGE:ci" > info.json
          python3 -c 'import json,sys; d=json.load(open("info.json")); sys.exit(0 if d["cpu_dispatch"] and not any(d["cpu_dispatch"].values()) else 1)'
          if docker run --rm --entrypoint /bin/sh "$IMAGE:ci" -c true; then echo "the image has a shell"; exit 1; fi
          if docker run --rm --entrypoint /usr/local/bin/python3.12 "$IMAGE:ci" -c "import ssl"; then echo "the engine has TLS"; exit 1; fi
          # F-005 T-09: the build ran the validation suite; the image holds a passed record.
          docker run --rm --entrypoint /usr/local/bin/python3.12 "$IMAGE:ci" -c 'import json,sys; r=json.load(open("/engine/validation.json")); print(r["engine_version"], r["architecture"], r["passed"]); sys.exit(0 if r["passed"] else 1)'
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:ci
          format: spdx-json
          output-file: engine-sbom.spdx.json
      - name: Every locked dependency is in the SBOM
        run: |
          for p in $(grep -oE '^[a-z0-9_.-]+==' engine/requirements.lock | tr -d '='); do
            grep -qi "\"name\": *\"$p\"" engine-sbom.spdx.json || { echo "missing from the SBOM: $p"; exit 1; }
          done
      - name: Vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/upload-artifact@v7
        with:
          name: engine-sbom
          path: engine-sbom.spdx.json

  # F-005 T-03: the generated gRPC code (Go and the engine's Python) is
  # exactly what the protos and the pinned generators produce.
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate the Go code
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.26-bookworm bash scripts/gen-proto.sh
      - name: Regenerate the Python code
        run: docker run --rm -v "$PWD:/src" -w /src python:3.12-slim-bookworm bash scripts/gen-proto-py.sh
      - name: No differences
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          git add -N internal/api engine/fairsim/_proto
          git diff --exit-code -- internal/api engine/fairsim/_proto

  # F-001 T-42 (design §6): the OpenAPI documents pass Spectral (spectral:oas
  # and the platform's conventions), and the convention rules pass their
  # self-test.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/spectral/package-lock.json
      - name: Spectral lint and rule self-test
        run: bash scripts/openapi-lint.sh

  image:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR (main only)
      id-token: write   # keyless cosign signing (main only)
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fair-iam
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Build
        run: docker build --load --build-arg VERSION="$TAG" -t "$IMAGE:$TAG" .
      - name: Verify non-root, read-only root filesystem, FIPS on
        run: |
          docker run -d --name iam --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e FAIR_ENV=development -e FAIR_ALLOW_PLAINTEXT=true -e FAIR_LISTEN_ADDR=:8080 \
            -p 8080:8080 "$IMAGE:$TAG"
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          test "$(docker inspect -f '{{.Config.User}}' iam)" = "65532:65532"
          docker logs iam | grep -q '"fips140":"true"'
          docker rm -f iam
      - name: Verify production refuses to start without TLS
        run: |
          if docker run --rm "$IMAGE:$TAG"; then echo "started without TLS"; exit 1; fi
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
      - name: Push (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - name: Cosign keyless sign + SBOM attestation (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
          cosign sign --yes "$digest"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$digest"

  # F-015 T-27/T-29: the deployment drift scanner's and the FIPS probe's own
  # images (design §6.8, D-OQ2): non-root, read-only, scanned and signed like
  # iam. Each must refuse to succeed unconfigured (the probe's "check" fails
  # without the flag file mounted).
  scanner-image:
    needs: [test, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { component: posture-scanner, smoke: "" }
          - { component: fips-probe, smoke: "check" }
          - { component: gateway, smoke: "" }
          - { component: audit, smoke: "" }
          - { component: risk, smoke: "" }
          - { component: engine-gate, smoke: "" } # F-005 T-10
    permissions:
      contents: read
      packages: write   # push to GHCR (main only)
      id-token: write   # keyless cosign signing (main only)
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fair-${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Build
        run: docker build --load --target "${{ matrix.component }}" --build-arg VERSION="$TAG" -t "$IMAGE:$TAG" .
      - name: Verify non-root and refusal to start unconfigured
        run: |
          test "$(docker inspect -f '{{.Config.User}}' "$IMAGE:$TAG")" = "65532:65532"
          if docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges "$IMAGE:$TAG" ${{ matrix.smoke }}; then
            echo "started without configuration"; exit 1
          fi
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
      - name: Vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.spdx.json
      - name: Push (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - name: Cosign keyless sign + SBOM attestation (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
          cosign sign --yes "$digest"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.component }}.spdx.json" "$digest"

  # F-015 T-32: the web UI (ADR-003: React + TypeScript, Vite).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Dependency audit (runtime dependencies, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  # F-015 T-32: the Posture page end to end against the real posture API and
  # database (db/tests TestPostureUIHarness as the dev gateway), with axe
  # WCAG 2.1 AA scans (scripts/ui-e2e.sh does the same locally).
  ui-e2e:
    needs: [web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # GOFIPS140 off for this step only: with it set, setup-go's "go env"
        # unpacks the FIPS module into the empty module cache, and the cache
        # restore then fails on those read-only files ("File exists").
        env:
          GOFIPS140: ""
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Build the web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Start the UI harness (seeded scenario, real API, dev gateway on :8099)
        env:
          FAIR_TEST_PG: "1"
          FAIR_UI_HARNESS: "1"
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-admin
        run: |
          (go test -count=1 -timeout 25m -v -run '^TestPostureUIHarness$' ./db/tests/ > harness.log 2>&1 &)
          for i in $(seq 1 180); do curl -fsS http://localhost:8099/dev/ready && exit 0; sleep 2; done
          cat harness.log; exit 1
      - name: Playwright (end to end, axe WCAG 2.1 AA)
        working-directory: web
        run: npx playwright install --with-deps chromium && npx playwright test
      - name: Stop the harness
        if: always()
        run: touch web/.harness-stop; sleep 3; cat harness.log | tail -20
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
